                }

                function renderTodos() {
                    listWrap.innerHTML = "";
                    renderStats();
                    let todos = getTodos();

                    if (filter === "active") todos = todos.filter(t => !t.done);
                    else if (filter === "done") todos = todos.filter(t => t.done);
                    if (priorityFilter !== "all") todos = todos.filter(t => t.priority === priorityFilter);

                    // Sort: high priority undone first, then medium, then low, then done
                    const pOrd = { high: 0, medium: 1, low: 2 };
                    todos.sort((a, b) => {
                        if (a.done !== b.done) return a.done ? 1 : -1;
                        return (pOrd[a.priority] || 1) - (pOrd[b.priority] || 1);
                    });

                    if (!todos.length) {
                        listWrap.appendChild(Utils.el("div", { class: "empty-state", style: { padding: "30px" } }, [
                            Utils.el("div", { html: Icons.svg("todo", 30) }),
                            Utils.el("div", { class: "es-title" }, "All clear!"),
                            Utils.el("div", { class: "es-sub" }, filter === "all" ? "Add your first task above." : "No tasks in this filter.")
                        ]));
                        return;
                    }

                    todos.forEach((todo) => {
                        const pInfo = PRIORITIES[todo.priority || "medium"];
                        const isOverdue = todo.dueDate && !todo.done && new Date(todo.dueDate) < new Date();
                        const dueDateStr = todo.dueDate ? new Date(todo.dueDate).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : null;

                        const item = Utils.el("div", { class: "todo-item" + (todo.done ? " done-item" : ""), style: { borderLeft: `3px solid ${todo.done ? "transparent" : pInfo.color}`, marginLeft: "0", paddingLeft: "12px" } });

                        const check = Utils.el("div", { class: "todo-check" + (todo.done ? " done" : ""), onClick: () => toggleTodo(todo.id), html: todo.done ? Icons.svg("check", 11) : "" });
                        const textWrap = Utils.el("div", { class: "col grow", style: { minWidth: 0 } });
                        const textEl = Utils.el("div", { class: "todo-text" + (todo.done ? " done" : ""), style: { lineHeight: "1.4" } }, Utils.escapeHtml(todo.text));
                        textWrap.appendChild(textEl);

                        const meta = Utils.el("div", { class: "row gap-2", style: { marginTop: "3px", flexWrap: "wrap" } });
                        if (todo.category) meta.appendChild(Utils.el("span", { class: "badge", style: { fontSize: "9px", background: "var(--ink-4)", color: "var(--text-3)" } }, todo.category));
                        if (dueDateStr) meta.appendChild(Utils.el("span", { style: { fontSize: "10px", color: isOverdue ? "#E0708A" : "var(--text-3)" } }, (isOverdue ? "⚠ " : "📅 ") + dueDateStr));
                        if (meta.children.length) textWrap.appendChild(meta);

                        const noteBtn = Utils.el("button", { class: "btn btn-ghost btn-sm btn-icon", title: "Convert to note", "aria-label": "Convert to note", onClick: () => convertToNote(todo), html: Icons.svg("note", 12), style: { opacity: "0.5", flex: "none" } });
                        const del = Utils.el("button", { class: "btn btn-ghost btn-sm btn-icon", title: "Delete task", "aria-label": "Delete task", onClick: () => deleteTodo(todo.id), html: Icons.svg("trash", 12), style: { opacity: "0.5", flex: "none" } });
                        item.appendChild(check);
                        item.appendChild(textWrap);
                        item.appendChild(noteBtn);
                        item.appendChild(del);
                        listWrap.appendChild(item);
                    });
                }

                function addTodo() {
                    const text = taskInput.value.trim();
                    if (!text) return;
                    const todos = getTodos();
                    const todo = { id: Utils.uid("todo"), text, done: false, priority: prioritySelect.value, category: catSelect.value, dueDate: dueInput.value || null, ts: Date.now() };
                    todos.push(todo);
                    StateManager.set("todos2", todos);
                    EventBus.emit("todo:created", { todo });
                    taskInput.value = ""; dueInput.value = ""; catSelect.value = "";
                    renderTodos();
                    NotificationCenter.push({ type: "success", title: "Task added", duration: 1200 });
                }

                function toggleTodo(id) {
                    const todos = getTodos();
                    const t = todos.find(t => t.id === id);
                    if (t) {
                        const previous = { ...t };
                        t.done = !t.done; t.completedAt = t.done ? Date.now() : null;
                        StateManager.set("todos2", todos);
                        EventBus.emit(t.done ? "todo:completed" : "todo:updated", { todo: t, previous });
                        renderTodos();
                    }
                }

                function deleteTodo(id) {
                    const previous = getTodos().find(t => t.id === id);
                    StateManager.set("todos2", getTodos().filter(t => t.id !== id));
                    if (previous) EventBus.emit("todo:deleted", { todo: previous });
                    renderTodos();
                }

                function clearDone() {
                    const removed = getTodos().filter(t => t.done);
                    StateManager.set("todos2", getTodos().filter(t => !t.done));
                    if (removed.length) EventBus.emit("todo:cleared", { count: removed.length, todos: removed });
                    renderTodos();
                }

                function convertToNote(todo) {
                    const note = WorkspaceBridge.createNoteFromTodo(todo);
                    if (note) NotificationCenter.push({ type: "success", title: "Task converted to note", duration: 1400 });
                }

                addBtn.addEventListener("click", addTodo);
                taskInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addTodo(); });
                const unsubscribe = StateManager.subscribe("todos2", () => { if (!destroyed) renderTodos(); });
                renderTodos();

                // Seed with sample tasks if empty
                if (!getTodos().length) {
                    const samples = [
                        { text: "Explore the Architecture Atlas", priority: "high", category: "Research" },
                        { text: "Try the Simulation Lab boids", priority: "medium", category: "Research" },
                        { text: "Write session notes", priority: "low", category: "Personal" },
                        { text: "Review Knowledge Graph connections", priority: "medium", category: "Work" },
                    ];
                    const seeded = samples.map((s, i) => ({ ...s, id: Utils.uid("todo"), done: i === 2, ts: Date.now() - i * 86400000, dueDate: null }));
                    StateManager.set("todos2", seeded);
                    EventBus.emit("todo:seeded", { count: seeded.length });
                    renderTodos();
                }
                return { destroy() { destroyed = true; unsubscribe(); } };
            }
            return { mount };
        })();


        /* ==== js/apps/agenda.js ==== */
        "use strict";
        /******************************************************************
         * [APP:AGENDA] — Due-date projection over the shared To-Do store
         ******************************************************************/
        const AgendaApp = (() => {
            function dateKey(value) {
                if (!value) return "no-date";
                const date = new Date(`${value}T00:00:00`);
                return Number.isNaN(date.getTime()) ? "no-date" : value;
            }
            function labelFor(key) {
                if (key === "no-date") return "No due date";
                const today = new Date();
                const todayKey = today.toISOString().slice(0, 10);
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                const tomorrowKey = tomorrow.toISOString().slice(0, 10);
                if (key < todayKey) return "Overdue";
                if (key === todayKey) return "Today";
                if (key === tomorrowKey) return "Tomorrow";
                return new Date(`${key}T00:00:00`).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
            }
            function mount(bodyEl) {
                let destroyed = false;
                const summary = Utils.el("div", { class: "app-toolbar" });
                const list = Utils.el("div", { class: "grow scroll-y", style: { padding: "10px 14px" } });
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [summary, list]));

                function render() {
                    if (destroyed) return;
                    const todos = StateManager.get("todos2") || [];
                    const active = todos.filter((todo) => !todo.done);
                    const overdue = active.filter((todo) => todo.dueDate && dateKey(todo.dueDate) < new Date().toISOString().slice(0, 10)).length;
                    summary.innerHTML = "";
                    summary.appendChild(Utils.el("span", { class: "text-2", style: { fontWeight: "600" } }, "Agenda"));
                    summary.appendChild(Utils.el("span", { class: "badge b-brass" }, `${active.length} active`));
                    if (overdue) summary.appendChild(Utils.el("span", { class: "badge b-rose" }, `${overdue} overdue`));
                    summary.appendChild(Utils.el("div", { class: "grow" }));
                    summary.appendChild(Utils.el("button", { class: "btn btn-primary btn-sm", html: Icons.svg("todo", 12) + "<span>Open To-Do</span>", onClick: () => AppRegistry.launch("todo") }));
                    list.innerHTML = "";
                    const groups = {};
                    todos.forEach((todo) => { const key = dateKey(todo.dueDate); (groups[key] ||= []).push(todo); });
                    const keys = Object.keys(groups).sort((a, b) => a === "no-date" ? 1 : b === "no-date" ? -1 : a.localeCompare(b));
                    if (!keys.length) {
                        list.appendChild(Utils.el("div", { class: "empty-state" }, [

        "use strict";
        /******************************************************************
         * [APP:SYSTEMMONITOR] — System Monitor dashboard (enhanced with live charts + process list)
         ******************************************************************/
        const SystemMonitorApp = (() => {
            // Simulated process list
            const PROCESSES = [
                { name: "window-mgr", pid: 99, baseCpu: 8, baseMem: 24 },
                { name: "renderer3d", pid: 200, baseCpu: 22, baseMem: 48 },
                { name: "animation-eng", pid: 210, baseCpu: 12, baseMem: 16 },
                { name: "dock", pid: 137, baseCpu: 2, baseMem: 8 },
                { name: "topbar", pid: 144, baseCpu: 1, baseMem: 6 },
                { name: "state-mgr", pid: 50, baseCpu: 0, baseMem: 12 },
                { name: "event-bus", pid: 55, baseCpu: 0, baseMem: 5 },
                { name: "perf-monitor", pid: 60, baseCpu: 1, baseMem: 4 },
                { name: "knowledge-svc", pid: 310, baseCpu: 4, baseMem: 32 },
                { name: "network-sim", pid: 400, baseCpu: 3, baseMem: 10 },
            ];

            function getSimCpu() { return Math.min(98, Math.max(5, PerfMonitor.getFps() > 55 ? 15 + Math.random() * 20 : 40 + Math.random() * 30)); }
            function getSimMem() {
                const m = PerfMonitor.memInfo();
                if (m) return (m.used / m.limit * 100);
                return 30 + Math.random() * 20;
            }

            const cpuHistory = Array(40).fill(20);
            const memHistory = Array(40).fill(30);
            const netHistory = Array(40).fill(0);

            function mount(bodyEl) {
                const wrap = Utils.el("div", { class: "sysmon-wrap" });
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [wrap]));

                // Top stat gauges
                const statsGrid = Utils.el("div", { class: "sysmon-stats" });
                const cpuGaugeVal = Utils.el("div", { class: "sysmon-gauge-value" }, "–");
                const memGaugeVal = Utils.el("div", { class: "sysmon-gauge-value" }, "–");
                const fpsGaugeVal = Utils.el("div", { class: "sysmon-gauge-value" }, "–");
                const winGaugeVal = Utils.el("div", { class: "sysmon-gauge-value" }, "–");
                const cpuBar = Utils.el("div", { class: "sysmon-bar-fill", style: { background: "var(--accent-2)", width: "20%" } });
                const memBar = Utils.el("div", { class: "sysmon-bar-fill", style: { background: "var(--brass)", width: "30%" } });

                const makeGauge = (label, valEl, sub, barFill, color) => {
                    const g = Utils.el("div", { class: "sysmon-gauge" });
                    g.appendChild(Utils.el("div", { class: "sysmon-gauge-label" }, label));
                    g.appendChild(valEl);
                    g.appendChild(Utils.el("div", { class: "sysmon-gauge-sub" }, sub));
                    if (barFill) {
                        const bar = Utils.el("div", { class: "sysmon-bar" }, [barFill]);
                        g.appendChild(bar);
                    }
                    return g;
                };
                statsGrid.appendChild(makeGauge("CPU Usage", cpuGaugeVal, "simulated", cpuBar, "var(--accent-2)"));
                statsGrid.appendChild(makeGauge("Memory", memGaugeVal, "of total", memBar, "var(--brass)"));
                statsGrid.appendChild(makeGauge("Frame Rate", fpsGaugeVal, "frames/sec", null, null));
                statsGrid.appendChild(makeGauge("Windows", winGaugeVal, "open", null, null));
                wrap.appendChild(statsGrid);

                // Charts
                const chartsGrid = Utils.el("div", { class: "sysmon-charts" });
                const cpuCanvas = Utils.el("canvas", { style: { width: "100%", height: "80px", display: "block" } });
                const memCanvas = Utils.el("canvas", { style: { width: "100%", height: "80px", display: "block" } });
                const cpuCard = Utils.el("div", { class: "sysmon-chart-card" }, [Utils.el("div", { class: "sysmon-chart-title" }, "CPU History"), cpuCanvas]);
                const memCard = Utils.el("div", { class: "sysmon-chart-card" }, [Utils.el("div", { class: "sysmon-chart-title" }, "Memory History"), memCanvas]);
                chartsGrid.appendChild(cpuCard);
                chartsGrid.appendChild(memCard);
                wrap.appendChild(chartsGrid);

                function drawHistoryChart(canvas, data, color, fillColor) {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const rect = canvas.getBoundingClientRect();
                    if (!rect.width) return;
                    canvas.width = Math.round(rect.width * dpr);
                    canvas.height = Math.round(rect.height * dpr);
                    const ctx = canvas.getContext("2d");
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    const w = rect.width, h = rect.height;
                    ctx.clearRect(0, 0, w, h);
                    if (data.length < 2) return;
                    const max = 100;
                    const pts = data.map((v, i) => [i / (data.length - 1) * w, h - (v / max * h * 0.9 + h * 0.05)]);
                    // Fill
                    ctx.beginPath();
                    ctx.moveTo(pts[0][0], h);
                    pts.forEach(([x, y]) => ctx.lineTo(x, y));
                    ctx.lineTo(pts[pts.length - 1][0], h);
                    ctx.closePath();
                    const grad = ctx.createLinearGradient(0, 0, 0, h);
                    grad.addColorStop(0, fillColor);
                    grad.addColorStop(1, "rgba(0,0,0,0)");
                    ctx.fillStyle = grad;
                    ctx.fill();
                    // Line
                    ctx.beginPath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.lineJoin = "round";
                    pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
                    ctx.stroke();
                    // Current value line
                    const last = pts[pts.length - 1];
                    ctx.beginPath();
                    ctx.setLineDash([3, 3]);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.moveTo(0, last[1]); ctx.lineTo(w, last[1]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Process list
                const procHeader = Utils.el("div", { class: "sysmon-process-header" }, [
                    Utils.el("div", {}, "Process"),
                    Utils.el("div", {}, "PID"),
                    Utils.el("div", {}, "CPU %"),
                    Utils.el("div", {}, "Mem MB"),
                ]);
                const procList = Utils.el("div", { class: "sysmon-process-list" });
                procList.appendChild(Utils.el("div", { style: { fontWeight: "600", fontSize: "11px", color: "var(--text-2)", marginBottom: "6px" } }, "Running Processes"));
                procList.appendChild(procHeader);
                const procRows = {};
                PROCESSES.forEach(p => {
                    const cpuEl = Utils.el("div", { class: "sysmon-process-val" });
                    const memEl = Utils.el("div", { class: "sysmon-process-val" });
                    const row = Utils.el("div", { class: "sysmon-process-row" }, [
                        Utils.el("div", { class: "sysmon-process-name" }, p.name),
                        Utils.el("div", { class: "sysmon-process-val", style: { color: "var(--text-3)" } }, String(p.pid)),
                        cpuEl, memEl
                    ]);
                    procRows[p.pid] = { cpuEl, memEl };
                    procList.appendChild(row);
                });
                wrap.appendChild(procList);

                function update() {
                    const cpu = getSimCpu();
                    const mem = getSimMem();
                    const fps = PerfMonitor.getFps();
                    const wins = WindowManager.windows.size;

                    cpuHistory.push(cpu); cpuHistory.shift();
                    memHistory.push(mem); memHistory.shift();
                    netHistory.push(Math.random() * 40); netHistory.shift();

                    cpuGaugeVal.textContent = cpu.toFixed(0) + "%";
                    memGaugeVal.textContent = mem.toFixed(0) + "%";
                    fpsGaugeVal.textContent = fps;
                    winGaugeVal.textContent = wins;
                    cpuBar.style.width = cpu + "%";
                    cpuBar.style.background = cpu > 80 ? "var(--rose)" : cpu > 60 ? "var(--amber)" : "var(--accent-2)";
                    memBar.style.width = mem + "%";

                    drawHistoryChart(cpuCanvas, cpuHistory, "#57D9C4", "rgba(87,217,196,0.15)");
                    drawHistoryChart(memCanvas, memHistory, "#C9A468", "rgba(201,164,104,0.15)");

                    PROCESSES.forEach(p => {
                        const variance = Math.random() * 6 - 3;
                        const pCpu = Math.max(0, Math.min(99, p.baseCpu + variance)).toFixed(1);
                        const pMem = (p.baseMem + Math.random() * 2 - 1).toFixed(1);
                        if (procRows[p.pid]) {
                            procRows[p.pid].cpuEl.textContent = pCpu;
                            procRows[p.pid].cpuEl.style.color = pCpu > 20 ? "var(--rose)" : pCpu > 10 ? "var(--amber)" : "var(--accent-2)";
                            procRows[p.pid].memEl.textContent = pMem;
                        }
                    });
                }

                update();
                const timer = setInterval(update, 1500);
                return { destroy() { clearInterval(timer); } };
            }
            return { mount };
        })();

        "use strict";
        /******************************************************************
         * [APP:CODEEDITOR] — Code Editor with REPL console
         ******************************************************************/
        const CodeEditorApp = (() => {
            // Simple syntax highlighting (basic)
            function highlight(code) {
                // Very naive; just for demonstration
                const escaped = Utils.escapeHtml(code);
                // Keywords, strings, comments, numbers
                let html = escaped;
                // Comments
                html = html.replace(/\/\/.*/g, (m) => `<span class="sh-comment">${m}</span>`);
                html = html.replace(/\/\*.*?\*\//gs, (m) => `<span class="sh-comment">${m}</span>`);
                // Strings
                html = html.replace(/(".*?"|'.*?')/g, (m) => `<span class="sh-string">${m}</span>`);
                // Numbers
                html = html.replace(/\b(\d+\.?\d*)\b/g, (m) => `<span class="sh-number">${m}</span>`);
                // Keywords
                const keywords = ['function', 'var', 'let', 'const', 'if', 'else', 'for', 'while', 'return', 'class', 'new',
                    'this', 'try', 'catch', 'finally', 'throw', 'switch', 'case', 'break', 'continue', 'import', 'export',
                    'default', 'from', 'async', 'await', 'yield'
                ];
                const kwRegex = new RegExp('\\b(' + keywords.join('|') + ')\\b', 'g');
                html = html.replace(kwRegex, (m) => `<span class="sh-keyword">${m}</span>`);
                // Function calls
                html = html.replace(/\b([a-zA-Z_]\w*)\s*\(/g, (m, p1) => `<span class="sh-function">${p1}</span>(`);
                return html;
            }

            function mount(bodyEl) {
                let code = "";
                let lines = [""];
                let currentLine = 0;
                let destroyed = false;

                const gutter = Utils.el("div", { class: "editor-gutter" });
                const textarea = Utils.el("textarea", { class: "editor-textarea", spellcheck: "false", autofocus: true });
                const highlightLayer = Utils.el("div", { class: "syntax-highlight" });
                const editorWrap = Utils.el("div", { class: "editor-wrap" }, [gutter, Utils.el("div", { style: { flex: "1",
                            position: "relative", overflow: "hidden" } }, [highlightLayer, textarea])]);

                ]));

                // Sync gutter and highlighting
                function updateEditor() {
                    const text = textarea.value;
                    code = text;
                    lines = code.split("\n");
                    // Update gutter
                    gutter.innerHTML = lines.map((_, i) =>
                        `<span class="gutter-line${i === currentLine ? " active-line" : ""}">${i + 1}</span>`
                    ).join("");
                    // Update syntax highlight
                    highlightLayer.innerHTML = highlight(code) + "\n";
                    // Update line/col
                    const pos = textarea.selectionStart;
                    const before = text.substring(0, pos);
                    const line = before.split("\n").length - 1;
                    const col = before.split("\n").pop().length + 1;
                    document.getElementById("line-col").textContent = `${line + 1}:${col}`;
                    // Scroll gutter to match textarea
                    gutter.scrollTop = textarea.scrollTop;
                    highlightLayer.scrollTop = textarea.scrollTop;
                    // Update active line
                    const gutterLines = gutter.querySelectorAll(".gutter-line");
                    gutterLines.forEach((el, i) => el.classList.toggle("active-line", i === line));
                }

                textarea.addEventListener("input", updateEditor);
                textarea.addEventListener("scroll", () => {
                    gutter.scrollTop = textarea.scrollTop;
                    highlightLayer.scrollTop = textarea.scrollTop;
                });
                textarea.addEventListener("keydown", (e) => {
                    if (e.key === "Tab") {
                        e.preventDefault();
                        const start = textarea.selectionStart;
                        const end = textarea.selectionEnd;
                        textarea.value = textarea.value.substring(0, start) + "  " + textarea.value.substring(end);
                        textarea.selectionStart = textarea.selectionEnd = start + 2;
                        updateEditor();
                    }
                });

                // Console logging
                function logToConsole(msg, type = "info") {
                    const line = Utils.el("div", { class: `log-line log-${type}` });
                    const prefix = Utils.el("span", { class: "log-prefix" }, `[${type}]`);
                    const value = Utils.el("span", { class: "log-value" }, msg);
                    line.appendChild(prefix);
                    line.appendChild(value);
                    consoleOutput.appendChild(line);
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                }

                // Run code
                document.getElementById("run-code").addEventListener("click", () => {
                    const codeToRun = textarea.value;
                    // Clear console output (keep last few lines)
                    consoleOutput.innerHTML = "";
                    // Capture console.log
                    const originalLog = console.log;
                    const originalError = console.error;
                    const originalWarn = console.warn;
                    console.log = (...args) => { logToConsole(args.map(a => String(a)).join(" "), "info");
                        originalLog(...args); };
                    console.error = (...args) => { logToConsole(args.map(a => String(a)).join(" "), "error");
                        originalError(...args); };
                    console.warn = (...args) => { logToConsole(args.map(a => String(a)).join(" "), "warn");
                        originalWarn(...args); };
                    try {
                        // Wrap in a function to have its own scope
                        const result = new Function(codeToRun)();
                        if (result !== undefined) logToConsole(String(result), "result");
                    } catch (e) {
                        logToConsole(String(e), "error");
                    } finally {
                        console.log = originalLog;
                        console.error = originalError;
                        console.warn = originalWarn;
                    }
                });

                document.getElementById("clear-console").addEventListener("click", () => {
                    consoleOutput.innerHTML = "";
                });

                // Initial content
                textarea.value = `// Welcome to the Code Editor\n// Write JavaScript and press Run\n\nfunction greet(name) {\n  return "Hello, " + name + "!";\n}\n\nconsole.log(greet("TITAN"));`;
                updateEditor();
                textarea.focus();

                return { destroy() { destroyed = true; } };
            }
            return { mount };
        })();

                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/^#{3} (.+)$/gm, "<h3>$1</h3>")
                    .replace(/^#{2} (.+)$/gm, "<h2>$1</h2>")
                    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                    .replace(/\*(.+?)\*/g, "<em>$1</em>")
                    .replace(/`(.+?)`/g, "<code>$1</code>")
                    .replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>")
                    .replace(/^---+$/gm, "<hr>")
                    .replace(/\[(.+?)\]\((.+?)\)/g, "<a href='$2'>$1</a>")
                    .replace(/^- (.+)$/gm, "<li>$1</li>")
                    .replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
                    .replace(/\n{2,}/g, "</p><p>")

        /* ==== js/apps/colorpicker.js ==== */
        "use strict";
        /******************************************************************
         * [APP:COLORPICKER] — Interactive color picker with HSB/HEX/RGB
         ******************************************************************/
        const ColorPickerApp = (() => {
            function mount(bodyEl) {
                const hueCanvas = Utils.el("canvas", { class: "hue-canvas" });
                const preview = Utils.el("div", { class: "color-preview" });
                const values = Utils.el("div", { class: "color-values" });
                const infoPanel = Utils.el("div", { class: "info-panel" }, [preview, values]);
                const wrap = Utils.el("div", { class: "color-picker-wrap" }, [hueCanvas, infoPanel]);
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [wrap]));

                const ctx = hueCanvas.getContext("2d");
                let w = 0,
                    h = 0;
                let hue = 0,
                    sat = 1,
                    bri = 1;
                let picking = false;

                const ro = Utils.observeCanvasResize(hueCanvas, ctx, (cw, ch) => { w = cw;
                    h = ch;
                    renderHue(); });

                function renderHue() {
                    if (w === 0 || h === 0) return;
                    const imageData = ctx.createImageData(w, h);
                    const data = imageData.data;
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const i = (y * w + x) * 4;
                            const satVal = x / w;
                            const briVal = 1 - y / h;
                            const [r, g, b] = hsvToRgb(hue, satVal, briVal);
                            data[i] = r;
                            data[i + 1] = g;
                            data[i + 2] = b;
                            data[i + 3] = 255;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    // Draw crosshair at current sat/bri
                    const cx = sat * w;
                    const cy = (1 - bri) * h;
                    ctx.strokeStyle = "rgba(255,255,255,0.9)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
                    ctx.fillStyle = "#fff";
                    ctx.fill();
                }

                function hsvToRgb(h, s, v) {
                    const c = v * s;
                    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
                    const m = v - c;
                    let r, g, b;
                    if (h < 60) { r = c;
                        g = x;
                        b = 0; } else if (h < 120) { r = x;
                        g = c;
                        b = 0; } else if (h < 180) { r = 0;
                        g = c;
                        b = x; } else if (h < 240) { r = 0;
                        g = x;
                        b = c; } else if (h < 300) { r = x;
                        g = 0;
                        b = c; } else { r = c;
                        g = 0;
                        b = x; }
                    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
                }

                function rgbToHsv(r, g, b) {
                    r /= 255;
                    g /= 255;
                    b /= 255;
                    const max = Math.max(r, g, b),
                        min = Math.min(r, g, b);
                    const v = max;
                    const d = max - min;
                    const s = max === 0 ? 0 : d / max;
                    let h = 0;
                    if (max !== min) {
                        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
                        else if (max === g) h = ((b - r) / d + 2) * 60;
                        else h = ((r - g) / d + 4) * 60;
                    }
                    return [h, s, v];
                }

                function updateColor() {
                    const [r, g, b] = hsvToRgb(hue, sat, bri);
                    const hex = "#" + [r, g, b].map(c => c.toString(16).padStart(2, "0")).join("");
                    preview.style.background = hex;
                    values.innerHTML = `
                        <div>HEX: ${hex}</div>
                        <div>RGB: ${r}, ${g}, ${b}</div>
                        <div>HSB: ${Math.round(hue)}°, ${Math.round(sat * 100)}%, ${Math.round(bri * 100)}%</div>
                    `;
                    renderHue();
                }

                // Hue slider: we'll use the canvas click/touch to pick hue
                // Add a hue bar above the main canvas? For simplicity, we'll use a small hue slider.
                // Instead, we'll add a hue slider below the canvas.
                const hueSlider = Utils.el("input", { type: "range", class: "slider", min: "0", max: "360",
                    value: String(hue), style: { width: "100%", marginTop: "8px" }, onInput: (e) => { hue = parseFloat(
                            e.target.value);
                        updateColor(); } });
                wrap.appendChild(hueSlider);

                function pickColor(e) {
                    const rect = hueCanvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;
                    sat = Math.min(1, Math.max(0, x));
                    bri = Math.min(1, Math.max(0, 1 - y));
                    updateColor();
                }

                hueCanvas.addEventListener("pointerdown", (e) => { picking = true;
                    pickColor(e);
                    hueCanvas.setPointerCapture(e.pointerId); });
                hueCanvas.addEventListener("pointermove", (e) => { if (picking) pickColor(e); });
                hueCanvas.addEventListener("pointerup", () => { picking = false; });
                hueCanvas.addEventListener("pointercancel", () => { picking = false; });

                updateColor();
                return { destroy() { ro.disconnect(); } };
            }
            return { mount };
        })();

                { title: "Static Glow", artist: "Void", key: "E", scale: "minor", bpm: 84, color: "#A0E0A0", emoji: "✨" },
                { title: "Aurora Protocol", artist: "Nebula", key: "Bb", scale: "major", bpm: 64, color: "#DDA0DD", emoji: "🌌" },
                { title: "Quantum Drift", artist: "Axiom", key: "C#", scale: "minor", bpm: 110, color: "#FFD700", emoji: "⚡" },
            ];

            function mount(bodyEl) {
                let currentIndex = 0;

                let scheduledNodes = [];
                let nextNoteTime = 0;

                let scheduleInterval = null;
                let vizRaf = null;
                let analyser = null;
                let vizDataArray = null;
                let volume = 0.55;
                let shuffle = false;
                let loopMode = false;
                let currentBeat = 0;

                // Scale definitions: intervals in semitones from root
                const SCALES = {
                    minor:  [0, 2, 3, 5, 7, 8, 10, 12, 14, 15],
                    major:  [0, 2, 4, 5, 7, 9, 11, 12, 14, 16],
                };
                const NOTE_NAMES = { "C": 261.63, "C#": 277.18, "D": 293.66, "D#": 311.13, "E": 329.63, "F": 349.23, "F#": 369.99, "G": 392.00, "G#": 415.30, "A": 440.00, "A#": 466.16, "Bb": 466.16, "B": 493.88 };

                function getScaleFreqs(keyName, scaleName) {
                    const root = NOTE_NAMES[keyName] || 261.63;
                    return (SCALES[scaleName] || SCALES.minor).map(s => root * Math.pow(2, s / 12));
                }

                // Web Audio setup
                function ensureAudio() {
                    if (audioCtx) return;
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = volume;
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    vizDataArray = new Uint8Array(analyser.frequencyBinCount);
                    masterGain.connect(analyser);
                    analyser.connect(audioCtx.destination);
                }

                function scheduleNote(freq, waveform, startTime, duration, vol = 0.15) {
                    const osc = audioCtx.createOscillator();
                    const envGain = audioCtx.createGain();
                    osc.type = waveform;
                    osc.frequency.value = freq;
                    osc.connect(envGain);
                    envGain.connect(masterGain);
                    envGain.gain.setValueAtTime(0, startTime);
                    envGain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
                    envGain.gain.linearRampToValueAtTime(vol * 0.6, startTime + duration * 0.3);
                    envGain.gain.linearRampToValueAtTime(0, startTime + duration - 0.02);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                    scheduledNodes.push(osc);
                    osc.onended = () => { scheduledNodes = scheduledNodes.filter(n => n !== osc); };
                    return osc;
                }

                // Multi-voice melodic sequencer
                function scheduleSong() {
                    const song = PLAYLIST[currentIndex];
                    const freqs = getScaleFreqs(song.key, song.scale);
                    const bps = song.bpm / 60;
                    const beatDur = 1 / bps;
                    const PATTERNS = {
                        0: [0, 2, 4, 7, 4, 2, 5, 3], 1: [0, 4, 7, 2, 5, 0, 4, 6],
                        2: [0, 3, 5, 7, 5, 3, 0, 2], 3: [2, 4, 7, 9, 7, 4, 2, 0],
                        4: [0, 2, 3, 5, 7, 5, 3, 2], 5: [0, 5, 4, 2, 3, 5, 7, 5],
                        6: [0, 4, 7, 9, 7, 5, 4, 2], 7: [0, 3, 7, 10, 7, 3, 5, 4],
                    };
                    const melody = PATTERNS[currentIndex % 8];
                    const bassPattern = melody.map(i => Math.max(0, i - 7));

                    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                        const patIdx = currentBeat % melody.length;
                        const melIdx = melody[patIdx] % freqs.length;
                        const bassIdx = bassPattern[patIdx] % freqs.length;

                        // Melody voice (triangle)
                        const melFreq = freqs[melIdx] * (currentBeat % 16 < 8 ? 2 : 3);
                        scheduleNote(melFreq, "triangle", nextNoteTime, beatDur * 0.8, 0.12);

                        // Bass voice (sawtooth at octave below)
                        if (currentBeat % 2 === 0) {
                            scheduleNote(freqs[bassIdx] / 2, "sawtooth", nextNoteTime, beatDur * 1.6, 0.08);
                        }

                        // Pad voice (sine, chord tones)
                        if (currentBeat % 4 === 0) {
                            [0, 4, 7].forEach((interval, vi) => {
                                const padFreq = freqs[(melIdx + interval) % freqs.length];
                                scheduleNote(padFreq, "sine", nextNoteTime + vi * 0.04, beatDur * 3.5, 0.05);
                            });
                        }

                        // Hi-hat (noise-like)
                        if (currentBeat % 2 === 1) {
                            scheduleNote(freqs[2] * 8, "square", nextNoteTime, 0.05, 0.02);
                        }

                        nextNoteTime += beatDur;
                        currentBeat++;
                    }
                }

                function stopAllNodes() {
                    if (scheduleInterval) { clearInterval(scheduleInterval); scheduleInterval = null; }
                    scheduledNodes.forEach(n => { try { n.stop(); } catch(e) {} });
                    scheduledNodes = [];
                }

                function startPlayback() {
                    ensureAudio();
                    if (audioCtx.state === "suspended") audioCtx.resume();
                    stopAllNodes();
                    nextNoteTime = audioCtx.currentTime + 0.05;
                    currentBeat = 0;
                    scheduleInterval = setInterval(scheduleSong, 25);
                    playing = true;
                    playBtn.innerHTML = Icons.svg("pause", 18);
                    playBtn.classList.add("playing");
                    startVizLoop();
                    renderPlaylist();
                    updateNowPlaying();
                }

                function stopPlayback() {
                    stopAllNodes();
                    if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
                    playing = false;
                    playBtn.innerHTML = Icons.svg("play", 18);
                    playBtn.classList.remove("playing");
                    renderPlaylist();
                }

                function togglePlay() {
                    if (playing) stopPlayback(); else startPlayback();
                }

                // Waveform visualizer
                const vizCanvas = Utils.el("canvas", { style: { width: "100%", height: "60px", display: "block", borderRadius: "var(--r-sm)", background: "rgba(0,0,0,0.2)" } });
                function startVizLoop() {
                    if (vizRaf) cancelAnimationFrame(vizRaf);
                    const song = PLAYLIST[currentIndex];
                    function draw() {
                        if (!playing) return;
                        vizRaf = requestAnimationFrame(draw);
                        const dpr = Math.min(window.devicePixelRatio || 1, 2);
                        const rect = vizCanvas.getBoundingClientRect();
                        if (rect.width === 0) return;
                        if (vizCanvas.width !== Math.round(rect.width * dpr)) { vizCanvas.width = Math.round(rect.width * dpr); vizCanvas.height = Math.round(rect.height * dpr); }
                        const ctx2 = vizCanvas.getContext("2d");
                        ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
                        const w = rect.width, h = rect.height;
                        ctx2.clearRect(0, 0, w, h);
                        if (analyser) {
                            analyser.getByteTimeDomainData(vizDataArray);
                            ctx2.beginPath();
                            ctx2.strokeStyle = song.color || "#57D9C4";
                            ctx2.lineWidth = 1.5;
                            ctx2.shadowColor = song.color || "#57D9C4";
                            ctx2.shadowBlur = 8;
                            const sliceW = w / vizDataArray.length;
                            let x = 0;
                            for (let i = 0; i < vizDataArray.length; i++) {
                                const v = vizDataArray[i] / 128.0;
                                const y = (v * h) / 2;
                                if (i === 0) ctx2.moveTo(x, y); else ctx2.lineTo(x, y);
                                x += sliceW;
                            }
                            ctx2.lineTo(w, h / 2);
                            ctx2.stroke();
                            ctx2.shadowBlur = 0;

                            // Frequency bars
                            analyser.getByteFrequencyData(vizDataArray);
                            const barW = Math.max(2, w / 64);
                            for (let i = 0; i < 64; i++) {
                                const barH = (vizDataArray[i] / 255) * h * 0.5;
                                const alpha = 0.18 + (vizDataArray[i] / 255) * 0.5;
                                ctx2.fillStyle = song.color ? song.color.replace("#", "rgba(").split("").join("") : `rgba(87,217,196,${alpha})`;
                                ctx2.globalAlpha = alpha;
                                ctx2.fillRect(i * barW + 1, h - barH, barW - 1, barH);
                            }
                            ctx2.globalAlpha = 1;
                        }
                    }
                    draw();
                }

                // Now-playing display
                const albumArt = Utils.el("div", { style: { width: "52px", height: "52px", borderRadius: "var(--r-md)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "28px", flexShrink: "0", background: "var(--ink-3)", border: "1px solid var(--hairline)" } });
                const trackInfo = Utils.el("div", { style: { fontWeight: "600", fontSize: "13px", color: "var(--text-1)" } }, "Select a song");
                const artistInfo = Utils.el("div", { style: { fontSize: "11px", color: "var(--text-3)", marginTop: "2px" } }, "");
                const bpmInfo = Utils.el("div", { style: { fontSize: "10px", color: "var(--text-3)", fontFamily: "var(--font-mono)", marginTop: "4px" } }, "");
                const nowPlayingInfo = Utils.el("div", { class: "col grow", style: { minWidth: 0 } }, [trackInfo, artistInfo, bpmInfo]);

                const playBtn = Utils.el("button", { class: "btn", style: { width: "44px", height: "44px", borderRadius: "50%", background: "var(--accent)", color: "var(--text-inv)", flexShrink: "0" }, html: Icons.svg("play", 18), onClick: togglePlay });
                 const prevBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", "aria-label": "Previous track", title: "Previous track", html: Icons.svg("previous", 16), onClick: () => { currentIndex = (currentIndex - 1 + PLAYLIST.length) % PLAYLIST.length; startPlayback(); } });
                 const nextBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", "aria-label": "Next track", title: "Next track", html: Icons.svg("next", 16), onClick: () => { currentIndex = (currentIndex + 1) % PLAYLIST.length; startPlayback(); } });
                 const shuffleBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", "aria-label": "Toggle shuffle", title: "Toggle shuffle", html: Icons.svg("shuffle", 16), onClick: () => { shuffle = !shuffle; shuffleBtn.style.opacity = shuffle ? "1" : "0.4"; } });
                 const loopBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", "aria-label": "Toggle loop", title: "Toggle loop", html: Icons.svg("repeat", 16), onClick: () => { loopMode = !loopMode; loopBtn.style.opacity = loopMode ? "1" : "0.4"; } });
                shuffleBtn.style.opacity = "0.4";
                loopBtn.style.opacity = "0.4";
                const volumeSlider = Utils.el("input", { type: "range", class: "slider volume-slider", min: "0", max: "1", step: "0.01", value: String(volume), onInput: (e) => { volume = parseFloat(e.target.value); if (masterGain) masterGain.gain.value = volume; } });

                const controls = Utils.el("div", { class: "player-controls", style: { flexDirection: "column", gap: "12px" } }, [
                    Utils.el("div", { class: "row gap-3", style: { alignItems: "center" } }, [albumArt, nowPlayingInfo]),
                    vizCanvas,
                    Utils.el("div", { class: "row gap-2", style: { justifyContent: "center", alignItems: "center" } }, [prevBtn, shuffleBtn, playBtn, loopBtn, nextBtn]),
                     Utils.el("div", { class: "row gap-2", style: { alignItems: "center" } }, [Utils.el("span", { style: { fontSize: "10px", color: "var(--text-3)" }, html: Icons.svg("volume", 13) }), volumeSlider, Utils.el("span", { style: { fontSize: "10px", color: "var(--text-3)" }, html: Icons.svg("volumeHigh", 13) })]),
                ]);

                const playlistEl = Utils.el("div", { class: "playlist" });
                const wrap = Utils.el("div", { class: "music-player-wrap" }, [controls, playlistEl]);
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [wrap]));

                function updateNowPlaying() {
                    const song = PLAYLIST[currentIndex];
                    albumArt.textContent = song.emoji || "🎵";
                    albumArt.style.boxShadow = `0 0 20px ${song.color}44`;
                    albumArt.style.background = `${song.color}22`;
                    trackInfo.textContent = song.title;
                    artistInfo.textContent = song.artist;
                    bpmInfo.textContent = `♩ ${song.bpm} BPM · ${song.key} ${song.scale} · Web Audio`;
                    trackInfo.style.color = song.color || "var(--text-1)";
                    playBtn.style.background = song.color || "var(--accent)";
                }

                function renderPlaylist() {
                    playlistEl.innerHTML = "";
                    PLAYLIST.forEach((song, idx) => {
                        const item = Utils.el("div", { class: "song-item" + (idx === currentIndex ? " playing" : ""),
                            onClick: () => { currentIndex = idx; if (playing) startPlayback(); else { updateNowPlaying(); renderPlaylist(); } } });
                        item.style.borderLeft = `3px solid ${idx === currentIndex ? song.color : "transparent"}`;
                        item.appendChild(Utils.el("div", { style: { fontSize: "16px", width: "24px", textAlign: "center" } }, song.emoji || "♪"));
                        const info = Utils.el("div", { class: "col grow", style: { minWidth: 0 } }, [
                            Utils.el("div", { class: "song-name" }, `${song.title}`),
                            Utils.el("div", { style: { fontSize: "10px", color: "var(--text-3)" } }, `${song.artist} · ${song.bpm} BPM`)
                        ]);
                        item.appendChild(info);
                        if (idx === currentIndex && playing) item.appendChild(Utils.el("div", { style: { fontSize: "10px", color: song.color, animation: "pulse 1s infinite" } }, "▶"));
                        playlistEl.appendChild(item);
                    });
                }

                renderPlaylist();
                updateNowPlaying();

                return {
                    destroy() {
                        stopPlayback();
                        if (audioCtx) audioCtx.close().catch(() => {});
                    }
                };
            }
            return { mount };
        })();



        /* ==== js/apps/pomodoro.js ==== */
        "use strict";
        /******************************************************************
         * [APP:POMODORO] — Pomodoro timer with circular progress + Web Audio
         ******************************************************************/
        const PomodoroApp = (() => {
            const MODES = [
                { id: "work", label: "Focus", duration: 25 * 60, color: "#E0708A" },
                { id: "short", label: "Short Break", duration: 5 * 60, color: "#57D9C4" },
                { id: "long", label: "Long Break", duration: 15 * 60, color: "#8B85E0" },
            ];
            function mount(bodyEl) {
                let modeIdx = 0, remaining = MODES[0].duration, running = false, interval = null, sessions = 0;
                let audioCtx = null;

                const canvas = Utils.el("canvas", { width: "200", height: "200", style: { width: "200px", height: "200px" } });
                const digitsEl = Utils.el("div", { class: "pom-digits" });
                const modeEl = Utils.el("div", { class: "pom-mode" });
                const timeWrap = Utils.el("div", { class: "pomodoro-time" }, [digitsEl, modeEl]);
                const ring = Utils.el("div", { class: "pomodoro-ring" }, [canvas, timeWrap]);

                const dotsEl = Utils.el("div", { class: "pom-sessions" });
                const startBtn = Utils.el("button", { class: "btn btn-primary", onClick: toggleTimer }, "Start");
                const resetBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: resetTimer }, "Reset");
                const modeRow = Utils.el("div", { class: "row gap-2" });
                MODES.forEach((m, i) => modeRow.appendChild(Utils.el("button", { class: "btn btn-ghost btn-sm" + (i === 0 ? " active" : ""), onClick: (e) => { setMode(i, e.currentTarget); } }, m.label)));

                const wrap = Utils.el("div", { class: "pomodoro-wrap" }, [modeRow, ring, dotsEl, Utils.el("div", { class: "pom-controls" }, [startBtn, resetBtn])]);
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [wrap]));

                function setMode(idx, btn) {
                    modeIdx = idx;
                    remaining = MODES[idx].duration;
                    if (running) { clearInterval(interval); running = false; startBtn.textContent = "Start"; }
                    [...modeRow.children].forEach(b => b.classList.remove("active"));
                    if (btn) btn.classList.add("active");
                    render();
                }

                function toggleTimer() {
                    if (running) {
                        clearInterval(interval); running = false; startBtn.textContent = "Start";
                    } else {
                        running = true; startBtn.textContent = "Pause";
                        interval = setInterval(() => {
                            remaining--;
                            if (remaining <= 0) {
                                clearInterval(interval); running = false; startBtn.textContent = "Start";
                                playAlert();
                                if (MODES[modeIdx].id === "work") { sessions++; renderDots(); }
                                NotificationCenter.push({ type: "success", title: "Pomodoro complete! 🎉", message: MODES[modeIdx].label + " session finished.", duration: 5000 });
                                if (MODES[modeIdx].id === "work") setMode(sessions % 4 === 0 ? 2 : 1, null);
                                else setMode(0, null);
                            }
                            render();
                        }, 1000);
                    }
                }

                function resetTimer() {
                    clearInterval(interval); running = false; startBtn.textContent = "Start";
                    remaining = MODES[modeIdx].duration; render();
                }

                function playAlert() {
                    try {
                        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        if (audioCtx.state === "suspended") audioCtx.resume();
                        [440, 554, 659, 880].forEach((freq, i) => {
                            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                            osc.frequency.value = freq; osc.type = "sine";
                            g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.18);
                            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i * 0.18 + 0.3);
                            osc.connect(g); g.connect(audioCtx.destination);
                            osc.start(audioCtx.currentTime + i * 0.18);
                            osc.stop(audioCtx.currentTime + i * 0.18 + 0.35);
                        });
                    } catch (e) {}
                }

                function renderDots() {
                    dotsEl.innerHTML = "";
                    for (let i = 0; i < Math.max(sessions, 4); i++) {
                        const dot = Utils.el("div", { class: "pom-dot" + (i < sessions ? " done" : "") });
                        dotsEl.appendChild(dot);
                        if (i === 3 && i < sessions - 1) { dotsEl.appendChild(Utils.el("div", { style: { width: "1px", height: "8px", background: "var(--hairline)", margin: "0 4px" } })); }
                    }
                }

                function render() {
                    const mode = MODES[modeIdx];
                    const total = mode.duration;
                    const frac = Math.max(0, remaining / total);
                    const m = Math.floor(remaining / 60), s = remaining % 60;
                    digitsEl.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
                    modeEl.textContent = mode.label;

                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const size = 200;
                    canvas.width = size * dpr; canvas.height = size * dpr;
                    const ctx = canvas.getContext("2d");
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.clearRect(0, 0, size, size);

                    // Background ring
                    ctx.beginPath();
                    ctx.arc(100, 100, 88, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(255,255,255,0.05)";
                    ctx.lineWidth = 10;
                    ctx.stroke();

                    // Progress arc
                    const startAngle = -Math.PI / 2;
                    const endAngle = startAngle + frac * Math.PI * 2;
                    ctx.beginPath();
                    ctx.arc(100, 100, 88, startAngle, endAngle);
                    ctx.strokeStyle = mode.color;
                    ctx.lineWidth = 10;
                    ctx.lineCap = "round";
                    ctx.shadowColor = mode.color;
                    ctx.shadowBlur = running ? 12 : 0;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                renderDots();
                render();
                return { destroy() { clearInterval(interval); if (audioCtx) audioCtx.close().catch(() => {}); } };
            }
            return { mount };
        })();

        "use strict";
        /******************************************************************
         * [APP:WORLDCLOCK] — World Clock with 8 cities
         ******************************************************************/
        const WorldClockApp = (() => {
            const CITIES = [
                { name: "New York", tz: "America/New_York", flag: "🇺🇸" },
                { name: "London", tz: "Europe/London", flag: "🇬🇧" },
                { name: "Paris", tz: "Europe/Paris", flag: "🇫🇷" },
                { name: "Dubai", tz: "Asia/Dubai", flag: "🇦🇪" },
                { name: "Mumbai", tz: "Asia/Kolkata", flag: "🇮🇳" },
                { name: "Singapore", tz: "Asia/Singapore", flag: "🇸🇬" },
                { name: "Tokyo", tz: "Asia/Tokyo", flag: "🇯🇵" },
                { name: "Sydney", tz: "Australia/Sydney", flag: "🇦🇺" },
                { name: "Cape Town", tz: "Africa/Johannesburg", flag: "🇿🇦" },
                { name: "São Paulo", tz: "America/Sao_Paulo", flag: "🇧🇷" },
                { name: "Los Angeles", tz: "America/Los_Angeles", flag: "🇺🇸" },
                { name: "Chicago", tz: "America/Chicago", flag: "🇺🇸" },
            ];

            function mount(bodyEl) {
                const grid = Utils.el("div", { class: "world-clock-grid" });
                bodyEl.appendChild(Utils.el("div", { class: "world-clock-wrap" }, [grid]));

                const cards = {};
                CITIES.forEach(city => {
                    const timeEl = Utils.el("div", { class: "clock-time" });
                    const dateEl = Utils.el("div", { class: "clock-date" });
                    const fillEl = Utils.el("div", { class: "clock-day-fill" });
                    const bar = Utils.el("div", { class: "clock-day-bar" }, [fillEl]);
                    const card = Utils.el("div", { class: "clock-card" }, [
                        Utils.el("div", { class: "row gap-2" }, [
                            Utils.el("span", { style: { fontSize: "18px" } }, city.flag),
                            Utils.el("div", { class: "col", style: { flex: "1" } }, [
                                Utils.el("div", { class: "clock-city" }, city.name),
                                Utils.el("div", { class: "clock-zone" }, city.tz.split("/")[1]?.replace(/_/g, " ") || city.tz),
                            ])
                        ]),
                        timeEl, dateEl, bar
                    ]);
                    cards[city.name] = { timeEl, dateEl, fillEl };
                    grid.appendChild(card);
                });

                function update() {
                    const now = Date.now();
                    CITIES.forEach(city => {
                        try {
                            const d = new Date(now);
                            const opts = { timeZone: city.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
                            const dateOpts = { timeZone: city.tz, weekday: "short", month: "short", day: "numeric" };
                            const timeStr = d.toLocaleTimeString("en-GB", opts);
                            const dateStr = d.toLocaleDateString("en-GB", dateOpts);
                            const h = parseInt(timeStr.split(":")[0]);
                            const isDaytime = h >= 6 && h < 20;
                            const secInDay = h * 3600 + parseInt(timeStr.split(":")[1]) * 60 + parseInt(timeStr.split(":")[2]);
                            const dayFrac = secInDay / 86400;
                            const c = cards[city.name];
                            c.timeEl.textContent = timeStr;
                            c.dateEl.textContent = dateStr;
                            c.timeEl.style.color = isDaytime ? "var(--accent)" : "var(--violet-bright, var(--accent-3))";
                            c.fillEl.style.width = (dayFrac * 100) + "%";
                            c.fillEl.style.background = isDaytime ? "var(--brass)" : "var(--violet)";
                        } catch (e) { cards[city.name].timeEl.textContent = "N/A"; }
                    });
                }

                update();
                const timer = setInterval(update, 1000);
                return { destroy() { clearInterval(timer); } };
            }
            return { mount };
        })();

                    .replace(/^#{4} (.+)$/gm, "<h4>$1</h4>").replace(/^#{3} (.+)$/gm, "<h3>$1</h3>")
                    .replace(/^#{2} (.+)$/gm, "<h2>$1</h2>").replace(/^# (.+)$/gm, "<h1>$1</h1>")
                    .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>")
                    .replace(/~~(.+?)~~/g, "<del>$1</del>").replace(/`{3}[\s\S]*?`{3}/g, m => `<pre><code>${m.slice(3, -3).trim()}</code></pre>`)
                    .replace(/`(.+?)`/g, "<code>$1</code>").replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>")
                    .replace(/^---+$/gm, "<hr>").replace(/\[(.+?)\]\((.+?)\)/g, "<a href='$2' target='_blank'>$1</a>")
                    .replace(/!\[(.+?)\]\((.+?)\)/g, "<img alt='$1' src='$2' style='max-width:100%'>")

                    .replace(/^\d+\. (.+)$/gm, "<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)+/g, "<ul>$&</ul>")
                    .replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>")

            function mount(bodyEl, api = {}) {
                const payload = api.payload || {};
                let currentFileId = payload.fileId || null;
                let currentFilePath = payload.path || "/Documents/untitled.md";
                let content = payload.content !== undefined ? String(payload.content) : (StateManager.get("mdEditorContent") || STARTER);
                let autoSaveTimer = null;

                const wordCountEl = Utils.el("span", { class: "md-word-count" });
                const exportBtn = Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: exportHtml }, "Export HTML");
                const saveBtn = Utils.el("button", { class: "btn btn-primary btn-sm", html: Icons.svg("save", 12) + "<span>Save</span>", title: "Save to shared workspace", onClick: saveToWorkspace });
                const toolbar = Utils.el("div", { class: "app-toolbar" }, [
                    Utils.el("span", { class: "text-2", style: { fontSize: "12px", fontWeight: "600" } }, payload.path ? payload.path.split("/").pop() : "Markdown Editor"),
                    Utils.el("div", { class: "grow" }),
                    wordCountEl,
                    saveBtn,
                    exportBtn,
                ]);

                const textarea = Utils.el("textarea", { class: "md-textarea", spellcheck: "false", placeholder: "Write Markdown here…" });
                textarea.value = content;
                const preview = Utils.el("div", { class: "md-preview" });

                const leftPane = Utils.el("div", { class: "md-editor-pane" }, [
                         Utils.el("div", { class: "md-pane-header" }, [Utils.el("span", { class: "row gap-1", html: Icons.svg("edit", 13) + "<span>Editor</span>" })]),
                    textarea
                ]);
                const rightPane = Utils.el("div", { class: "md-editor-pane" }, [
                         Utils.el("div", { class: "md-pane-header" }, [Utils.el("span", { class: "row gap-1", html: Icons.svg("eye", 13) + "<span>Preview</span>" })]),
                    preview
                ]);

                const editorArea = Utils.el("div", { class: "md-editor-wrap grow" }, [leftPane, rightPane]);
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [toolbar, editorArea]));

                function updatePreview() {
                    content = textarea.value;
                    preview.innerHTML = renderMd(content) || "<p><em>Nothing to preview yet…</em></p>";
                    const words = content.trim() ? content.trim().split(/\s+/).length : 0;
                    const chars = content.length;
                    wordCountEl.textContent = `${words}w · ${chars}c`;
                }

                function saveToWorkspace() {
                    const value = textarea.value;
                    if (currentFileId) {
                        WorkspaceBridge.updateFile(currentFileId, { content: value, size: `${value.length} B` });
                    } else {
                        const parts = currentFilePath.split("/").filter(Boolean);
                        const name = parts.pop() || "untitled.md";
                        const file = WorkspaceBridge.createFile({ name, path: "/" + parts.join("/"), type: "md", content: value });
                        if (file) {
                            currentFileId = file.id;
                            currentFilePath = WorkspaceBridge.normalizePath(file.path + "/" + file.name);
                            api.setMeta?.("saved");
                        }
                    }
                    StateManager.set("mdEditorContent", value);
                    NotificationCenter.push({ type: "success", title: "Markdown saved", duration: 1200 });
                }

                textarea.addEventListener("input", () => {
                    updatePreview();
                    clearTimeout(autoSaveTimer);
                    autoSaveTimer = setTimeout(() => {
                        StateManager.set("mdEditorContent", textarea.value);
                        if (currentFileId) WorkspaceBridge.updateFile(currentFileId, { content: textarea.value, size: `${textarea.value.length} B` });
                    }, 500);
                });

                textarea.addEventListener("keydown", (e) => {
                    if (e.key === "Tab") {
                        e.preventDefault();
                        const start = textarea.selectionStart, end = textarea.selectionEnd;
                        textarea.value = textarea.value.slice(0, start) + "  " + textarea.value.slice(end);
                        textarea.selectionStart = textarea.selectionEnd = start + 2;
                        updatePreview();
                    }
                });

                function exportHtml() {
                    const html = `<!DOCTYPE html>\n<html>\n<head><meta charset="utf-8"><title>Export</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.7}h1,h2,h3{border-bottom:1px solid #eee;padding-bottom:8px}code{background:#f4f4f4;padding:2px 6px;border-radius:4px}pre{background:#f4f4f4;padding:16px;border-radius:8px;overflow-x:auto}blockquote{border-left:4px solid #ddd;padding:4px 16px;color:#666}</style></head>\n<body>${renderMd(textarea.value)}</body>\n</html>`;
                    const blob = new Blob([html], { type: "text/html" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a"); a.href = url; a.download = "export.html"; a.click();
                    URL.revokeObjectURL(url);
                    NotificationCenter.push({ type: "success", title: "Exported to HTML", duration: 2000 });
                }

                updatePreview();
                return { destroy() { clearTimeout(autoSaveTimer); StateManager.set("mdEditorContent", textarea.value); } };
            }
            return { mount };
        })();
