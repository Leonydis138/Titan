        const AIChatApp = (() => {
            const COSMOS_NAME = "Cosmos";
            const AVATAR = "✦";

            const KB = {
                greeting: ["Hello! I'm Cosmos, your AI companion in TITAN Ω. How can I help you explore today?", "Welcome back. I'm here to help you think, explore, and discover. What's on your mind?", "Greetings, explorer. Ready to dive into some deep questions?"],
                help: ["TITAN Ω features a window manager, 3D visualization, simulation lab, knowledge graph, and much more. Try pressing Ctrl+K to open the command palette!", "You can launch apps from the Dock at the bottom, or use Ctrl+K for quick access. The right-click context menu also has useful options.", "Need help? Try the Architecture Atlas for a visual overview, or open the Help app for full documentation."],
                simulation: ["The Simulation Lab supports several modes: Boids flocking, Cellular Automata, and Particle Physics. Each demonstrates emergence from simple rules.", "Emergence is fascinating — complex behavior arising from simple local interactions. The boids simulation is a beautiful example: three rules produce seemingly intelligent group behavior.", "Conway's Game of Life in the Cellular Automata module is one of the most famous examples of emergence. A Turing-complete system from just four rules."],
                consciousness: ["Consciousness remains one of the deepest mysteries in science and philosophy. The hard problem — why there is subjective experience at all — has no consensus answer.", "Some theorists like Tononi propose Integrated Information Theory (IIT), suggesting consciousness correlates with the amount of integrated information (Φ) in a system.", "Emergent consciousness theories suggest that awareness may arise from sufficiently complex information processing — though the threshold remains unknown."],
                philosophy: ["The map is not the territory — Alfred Korzybski's insight reminds us that our models of reality are always approximations, never the thing itself.", "Gödel's incompleteness theorems show that any sufficiently powerful formal system contains true statements it cannot prove. There are limits to what can be known within a system.", "Hofstadter's strange loops — self-referential systems that fold back on themselves — may be key to understanding consciousness, meaning, and identity."],
                physics: ["Quantum mechanics challenges our intuitions about determinism. The double-slit experiment shows particles exist in superposition until observed.", "The universe contains roughly 10^80 atoms, yet started from a single point of infinite density. The Big Bang was not an explosion in space — it was an expansion of space itself.", "Dark matter makes up about 27% of the universe's mass-energy. We know it exists through gravitational effects, but its nature remains unknown."],
                code: ["I can help you think through algorithms, data structures, and code architecture. What are you working on?", "Good code is clear, testable, and composed of small, single-responsibility units. What pattern are you exploring?", "The TITAN Ω codebase is entirely vanilla JS — no dependencies. Everything from the window manager to the 3D renderer is built from scratch."],
                math: ["Mathematics is the language of the universe. From Euler's identity (e^(iπ) + 1 = 0) to the Mandelbrot set, beauty hides in abstract structures.", "The Collatz conjecture is deceptively simple: take any positive integer, if even divide by 2, if odd multiply by 3 and add 1. It always seems to reach 1 — but this has never been proven.", "Benford's Law states that in many naturally occurring datasets, the leading digit is 1 about 30% of the time. This has been used to detect fraud in financial records."],
                default: ["That's an interesting thought. Could you elaborate? I'm here to explore ideas with you.", "Tell me more — I find this topic fascinating and would like to understand your perspective better.", "I don't have a specific answer for that, but let's think through it together. What do you already know about the subject?", "Curious question. Let me reflect on that… complexity often hides in seemingly simple questions.", "The boundaries between disciplines are where the most interesting discoveries happen. What's the connection you're seeing?"]
            };

            function classifyTopic(msg) {
                const m = msg.toLowerCase();
                if (/hello|hi|hey|greet|welcome/.test(m)) return "greeting";
                if (/help|how|what is titan|feature|app|window|dock/.test(m)) return "help";
                if (/simul|boid|cellular|particle|emergent|emergence/.test(m)) return "simulation";
                if (/consciou|aware|sentient|experience|qualia|hard problem/.test(m)) return "consciousness";
                if (/philosoph|meaning|truth|reality|map|gödel|hofstadter/.test(m)) return "philosophy";
                if (/physic|quantum|relativity|universe|atom|dark matter/.test(m)) return "physics";
                if (/code|program|algorithm|function|javascript|software/.test(m)) return "code";
                if (/math|equation|theorem|proof|number|calculus|geometry/.test(m)) return "math";
                return "default";
            }

            function respond(msg) {
                const topic = classifyTopic(msg);
                const responses = KB[topic] || KB.default;
                return responses[Math.floor(Math.random() * responses.length)];
            }

            function mount(bodyEl) {
                const messages = StateManager.get("chatMessages") || [{ role: "ai", text: KB.greeting[0], ts: Date.now() }];
                let typing = false;
                let destroyed = false;
                let responseTimer = null;
                let typeInterval = null;
                let typingEl = null;

                const messagesEl = Utils.el("div", { class: "chat-messages" });
                const inputEl = Utils.el("textarea", { class: "chat-input", placeholder: "Ask Cosmos anything…", rows: "1" });
                const sendBtn = Utils.el("button", { class: "btn btn-primary btn-sm", style: { flex: "none" }, html: Icons.svg("chevronR", 14) });
                const inputRow = Utils.el("div", { class: "chat-input-row" }, [inputEl, sendBtn]);

                const header = Utils.el("div", { class: "chat-ai-header" }, [
                    Utils.el("div", { class: "chat-ai-avatar" }, AVATAR),
                    Utils.el("div", { class: "col" }, [
                        Utils.el("div", { style: { fontWeight: "600", fontSize: "13px" } }, COSMOS_NAME),
                        Utils.el("div", { style: { fontSize: "11px", color: "var(--text-3)" } }, "AI Research Companion")
                    ])
                ]);

                bodyEl.appendChild(Utils.el("div", { class: "chat-wrap" }, [header, messagesEl, inputRow]));

                function fmtTime(ts) {
                    return new Date(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
                }

                function addBubble(role, text, ts) {
                    const bubble = Utils.el("div", { class: `chat-bubble ${role}` });
                    const content = Utils.el("div", { class: "chat-bubble-content" });
                    content.textContent = text;
                    const meta = Utils.el("div", { class: "chat-bubble-meta" }, fmtTime(ts || Date.now()));
                    bubble.appendChild(content);
                    bubble.appendChild(meta);
                    messagesEl.appendChild(bubble);
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    return { content };
                }

                function showTyping() {
                    const el = Utils.el("div", { class: "chat-bubble ai" });
                    const dots = Utils.el("div", { class: "chat-typing" }, [
                        Utils.el("span"), Utils.el("span"), Utils.el("span")
                    ]);
                    el.appendChild(dots);
                    messagesEl.appendChild(el);
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    return el;
                }

                function renderAll() {
                    messagesEl.innerHTML = "";
                    messages.forEach(m => addBubble(m.role, m.text, m.ts));
                }

                function sendMessage() {
                    const text = inputEl.value.trim();
                    if (!text || typing) return;
                    const userMsg = { role: "user", text, ts: Date.now() };
                    messages.push(userMsg);
                    addBubble("user", text, userMsg.ts);
                    inputEl.value = "";
                    typing = true;
                    typingEl = showTyping();
                    const delay = 600 + Math.random() * 900;
                    responseTimer = setTimeout(() => {
                        responseTimer = null;
                        if (destroyed) return;
                        typingEl.remove();
                        typingEl = null;
                        const reply = respond(text);
                        const aiMsg = { role: "ai", text: reply, ts: Date.now() };
                        messages.push(aiMsg);
                        // Typewriter effect
                        const { content } = addBubble("ai", "", aiMsg.ts);
                        content.textContent = "";
                        let i = 0;
                        typeInterval = setInterval(() => {
                            content.textContent += reply[i++];
                            messagesEl.scrollTop = messagesEl.scrollHeight;
                            if (i >= reply.length) {
                                clearInterval(typeInterval);
                                typeInterval = null;
                                typing = false;
                                StateManager.set("chatMessages", messages);
                            }
                        }, 18);
                    }, delay);
                }

                inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
                sendBtn.addEventListener("click", sendMessage);

                renderAll();
                return { destroy() {
                    destroyed = true;
                    clearTimeout(responseTimer);
                    responseTimer = null;
                    clearInterval(typeInterval);
                    typeInterval = null;
                    if (typingEl) {
                        typingEl.remove();
                        typingEl = null;
                    }
                    typing = false;
                } };
            }
            return { mount };
        })();

                { name: "Dubai", country: "AE", tz: "Asia/Dubai", lat: 25.2, conditions: ["☀️ Hot & Sunny","🌤 Hazy","💨 Dusty","🌡 Scorching","☀️ Blazing"], temps: [28, 42], humidity: [20, 60], wind: [5, 20], pressure: 1010 },
                { name: "Sydney", country: "AU", tz: "Australia/Sydney", lat: -33.9, conditions: ["☀️ Beautiful","🌤 Sunny","⛅ Partly Cloudy","🌊 Sea Breeze","🌧 Showers"], temps: [15, 28], humidity: [50, 75], wind: [10, 25], pressure: 1016 },
            ];

            let selectedCity = 0;
            const rnd = Utils.seededRandom(Date.now() % 9999);

            function getWeather(city) {
                const t = city.temps[0] + Math.floor(rnd() * (city.temps[1] - city.temps[0]));
                return {
                    temp: t, condition: city.conditions[Math.floor(rnd() * city.conditions.length)],
                    humidity: city.humidity[0] + Math.floor(rnd() * (city.humidity[1] - city.humidity[0])),
                    wind: city.wind[0] + Math.floor(rnd() * (city.wind[1] - city.wind[0])),
                    pressure: city.pressure + Math.floor(rnd() * 10 - 5),
                    feelsLike: t - 2 + Math.floor(rnd() * 5),
                    uvIndex: Math.floor(rnd() * 11),
                    visibility: 5 + Math.floor(rnd() * 20),
                };
            }

            function getDayForecast(city, offset) {
                const conditions = city.conditions;
                const t = city.temps[0] + Math.floor(rnd() * (city.temps[1] - city.temps[0]));
                const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
                const d = new Date(); d.setDate(d.getDate() + offset);
                return { day: offset === 0 ? "Today" : days[d.getDay()], cond: conditions[Math.floor(rnd() * conditions.length)], temp: t };
            }

            function mount(bodyEl) {
                const cityTabsEl = Utils.el("div", { class: "row", style: { padding: "0 20px", borderBottom: "1px solid var(--hairline)", gap: "4px", overflowX: "auto" } });
                const heroEl = Utils.el("div", { class: "weather-hero" });
                const detailsEl = Utils.el("div", { class: "weather-details" });
                const forecastEl = Utils.el("div", { class: "weather-forecast" });
                const wrap = Utils.el("div", { class: "weather-wrap" }, [cityTabsEl, heroEl, detailsEl, forecastEl]);
                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [wrap]));

                const cityBtns = [];
                CITIES.forEach((city, i) => {
                    const btn = Utils.el("button", { class: "btn btn-ghost btn-sm", style: { fontSize: "11px", borderRadius: "0", borderBottom: "2px solid transparent", padding: "10px 12px" }, onClick: () => { selectedCity = i; renderCity(); } }, city.name);
                    cityBtns.push(btn);
                    cityTabsEl.appendChild(btn);
                });

                function renderCity() {
                    const city = CITIES[selectedCity];
                    const wx = getWeather(city);
                    cityBtns.forEach((b, i) => { b.style.borderBottomColor = i === selectedCity ? "var(--accent)" : "transparent"; b.style.color = i === selectedCity ? "var(--accent)" : ""; });

                    heroEl.innerHTML = "";
                    heroEl.appendChild(Utils.el("div", { class: "col" }, [
                        Utils.el("div", { class: "weather-city-name" }, city.name),
                        Utils.el("div", { class: "weather-desc" }, wx.condition),
                        Utils.el("div", { style: { fontSize: "11px", color: "var(--text-3)", marginTop: "4px" } }, city.country),
                    ]));
                    const tempWrap = Utils.el("div", { class: "col", style: { alignItems: "flex-end" } });
                    const tempRow = Utils.el("div", { class: "weather-temp-big" });
                    tempRow.innerHTML = `${wx.temp}<sup>°C</sup>`;
                    tempWrap.appendChild(tempRow);
                    tempWrap.appendChild(Utils.el("div", { style: { fontSize: "12px", color: "var(--text-3)" } }, `Feels like ${wx.feelsLike}°C`));
                    heroEl.appendChild(tempWrap);

                    detailsEl.innerHTML = "";
                    const details = [
                        { label: "Humidity", value: wx.humidity, unit: "%" },
                        { label: "Wind Speed", value: wx.wind, unit: " km/h" },
                        { label: "Pressure", value: wx.pressure, unit: " hPa" },
                        { label: "UV Index", value: wx.uvIndex, unit: "" },
                        { label: "Visibility", value: wx.visibility, unit: " km" },
                        { label: "Condition", value: wx.condition.split(" ").slice(1).join(" "), unit: "" },
                    ];
                    details.forEach(d => {
                        const card = Utils.el("div", { class: "weather-detail-card" }, [
                            Utils.el("div", { class: "weather-detail-label" }, d.label),
                            Utils.el("div", { class: "row", style: { alignItems: "baseline", gap: "2px" } }, [
                                Utils.el("div", { class: "weather-detail-value" }, String(d.value)),
                                Utils.el("span", { class: "weather-detail-unit" }, d.unit),
                            ])
                        ]);
                        detailsEl.appendChild(card);
                    });

                    forecastEl.innerHTML = "";
                    for (let i = 0; i < 7; i++) {
                        const fc = getDayForecast(city, i);
                        const day = Utils.el("div", { class: "weather-forecast-day" + (i === 0 ? " active" : "") }, [
                            Utils.el("div", { class: "day-name" }, fc.day),
                            Utils.el("div", { class: "day-icon" }, fc.cond.split(" ")[0]),
                            Utils.el("div", { class: "day-temp" }, `${fc.temp}°`),
                        ]);
                        forecastEl.appendChild(day);
                    }
                }

                renderCity();
                return { destroy() {} };
            }
            return { mount };
        })();

        /* ==== js/boot.js ==== */
        "use strict";
        /******************************************************************
         * [BOOT] — Boot sequence & animations
         ******************************************************************/
        const Boot = (() => {
            const bootScreen = document.getElementById("boot-screen");
            const progressFill = document.getElementById("boot-progress-fill");
            const statusEl = document.getElementById("boot-status");

            let progress = 0;

            function setProgress(p, msg) {
                progress = Math.max(progress, p);
                progressFill.style.width = (progress * 100) + "%";
                if (msg) statusEl.textContent = msg;
            }

            async function sequence() {
                const steps = TITAN_CONFIG.bootSteps;
                const stepTime = TITAN_CONFIG.bootDuration / steps.length;

                for (let i = 0; i < steps.length; i++) {
                    setProgress(i / steps.length, steps[i]);
                    await new Promise((resolve) => setTimeout(resolve, stepTime));
                }

                setProgress(1, "Ready.");
                await new Promise((resolve) => setTimeout(resolve, 400));

                bootScreen.classList.add("boot-hidden");
                await new Promise((resolve) => setTimeout(resolve, 1000));
                bootScreen.style.display = "none";

                StateManager.set("bootedAt", Date.now());
                Logger.info("Boot", "Initialization complete");
                EventBus.emit("boot:complete", { timestamp: Date.now() });
            }

            function replay() {
                bootScreen.style.display = "flex";
                bootScreen.classList.remove("boot-hidden");
                progress = 0;
                progressFill.style.width = "0%";
                statusEl.textContent = TITAN_CONFIG.bootSteps[0];
                sequence();
            }

            return { sequence, replay };
        })();



        /* ==== js/init.js ==== */
        "use strict";
        /******************************************************************
         * [INIT] — Main initialization
         ******************************************************************/
        window.addEventListener("DOMContentLoaded", async () => {
            try {
                const root = document.getElementById("titan-root");

                const theme = StateManager.get("theme") || TITAN_CONFIG.defaultTheme;
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.setAttribute("data-motion", StateManager.get("reduceMotion") ? "reduced" : "full");

                await Boot.sequence();

                Desktop.renderIcons(AppRegistry.list().filter((a) => a.icon));
                Desktop.startAmbient();
                Dock.render();
                ViewportMode.init();
                WindowManager.restorePersistedWindows();

                // Konami code easter egg
                const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
                let konamiIdx = 0;

                document.addEventListener("keydown", (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault();
                        CommandPalette.toggle(); }
                    if (e.key === "F1") { e.preventDefault();
                        AppRegistry.launch("help"); }
                    if ((e.ctrlKey || e.metaKey) && e.key === ",") { e.preventDefault();
                        AppRegistry.launch("settings"); }
                    if (e.altKey && e.key === "Tab") { e.preventDefault();
                        WindowManager.cycleFocus(e.shiftKey ? -1 : 1); }
                    if ((e.ctrlKey || e.metaKey) && e.key === "Tab") { e.preventDefault();
                        WindowManager.cycleFocus(e.shiftKey ? -1 : 1); }
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w") {
                        const active = document.activeElement;
                        const isInInput = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
                        if (!isInInput) { e.preventDefault(); WindowManager.closeFocused ? WindowManager.closeFocused() : WindowManager.minimizeFocused(); }
                    }
                    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "n") {
                        const active = document.activeElement;
                        if (!active || (active.tagName !== "INPUT" && active.tagName !== "TEXTAREA")) { e.preventDefault(); AppRegistry.launch("notes"); }
                    }
                    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "t") {
                        const active = document.activeElement;
                        if (!active || (active.tagName !== "INPUT" && active.tagName !== "TEXTAREA")) { e.preventDefault(); AppRegistry.launch("terminal"); }
                    }
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "n") { e.preventDefault();
                        AppRegistry.launch("memory"); }
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault();
                        const win = WindowManager.getFocused();
                        if (win) EventBus.emit("app:save", { windowId: win.id }); }
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "e") { e.preventDefault();
                        const data = StateManager.exportWorkspace();
                        Utils.downloadJSON(data, `titan_workspace_${new Date().toISOString().slice(0,10)}.json`);
                        NotificationCenter.push({ type: "success", title: "Workspace exported" }); }

                    // Konami code
                    if (e.key === KONAMI[konamiIdx]) {
                        konamiIdx++;
                        if (konamiIdx === KONAMI.length) {
                            konamiIdx = 0;
                            NotificationCenter.push({ type: "success", title: "🎮 KONAMI CODE!", message: "You found the Easter Egg! Launching Matrix…", duration: 4000 });
                            StateManager.set("wallpaperStyle", "matrix-rain");
                            setTimeout(() => AppRegistry.launch("terminal"), 1200);
                        }
                    } else { konamiIdx = 0; }
                });

                CommandPalette.registerCommands([
                    { title: "Cycle Theme", icon: "sun", keywords: "appearance theme", action: () => SettingsApp
                            .cycleTheme() },
                    { title: "Clear Memory", icon: "trash", keywords: "memory reset", action: () => { StateManager.set(
                                "memories", []);
                            NotificationCenter.push({ type: "info", title: "Long-term memory cleared" }); } },
                    { title: "Cycle Wallpaper Style", icon: "layers", keywords: "wallpaper background", action: () =>
                            Desktop.cycleWallpaper() },
                    { title: "Window Overview", icon: "grid", keywords: "windows switcher multitask focus", action: () =>
                            WindowOverview.toggle() },
                    { title: "Open Code Editor", icon: "code", keywords: "repl javascript", action: () => AppRegistry
                            .launch("code-editor") },
                    { title: "Export Workspace", icon: "upload", keywords: "save export", action: () => {
                            const data = StateManager.exportWorkspace();
                            Utils.downloadJSON(data, `titan_workspace_${new Date().toISOString().slice(0,10)}.json`);
                            NotificationCenter.push({ type: "success", title: "Workspace exported" });
                        } },
                    { title: "Import Workspace", icon: "download", keywords: "load restore", action: () => {
                            const input = Utils.el("input", { type: "file", accept: ".json",
                                style: { display: "none" } });
                            document.body.appendChild(input);
                            input.click();
                            input.onchange = (e) => {
                                const file = e.target.files?.[0];
                                if (!file) return;
                                Utils.readJSONFile(file).then((data) => {
                                    StateManager.importWorkspace(data);
                                    NotificationCenter.push({ type: "success",
                                        title: "Workspace imported" });
                                    setTimeout(() => location.reload(), 500);
                                }).catch((err) => {
                                    NotificationCenter.push({ type: "error",
                                        title: "Import failed",
                                        message: err.message || "Invalid file" });
                                });
                                input.remove();
                            };
                        } },
                    { title: "Open Calculator", icon: "calc", keywords: "math", action: () => AppRegistry.launch(
                            "calculator") },
                    { title: "Open Terminal", icon: "terminal", keywords: "command line", action: () => AppRegistry
                            .launch("terminal") },
                    { title: "Open Whiteboard", icon: "whiteboard", keywords: "draw", action: () => AppRegistry.launch(
                            "whiteboard") },
                    { title: "Open To-Do", icon: "todo", keywords: "tasks", action: () => AppRegistry.launch("todo") },
                    { title: "Open System Monitor", icon: "monitor", keywords: "performance", action: () => AppRegistry
                            .launch("system-monitor") },
                    { title: "Open File Manager", icon: "file", keywords: "files", action: () => AppRegistry.launch(
                            "file-manager") },
                    { title: "Open Notes", icon: "note", keywords: "notes", action: () => AppRegistry.launch("notes") },
                    { title: "Open Color Picker", icon: "color", keywords: "colors", action: () => AppRegistry.launch(
                            "color-picker") },
                    { title: "Open Music Player", icon: "music", keywords: "music", action: () => AppRegistry.launch("music-player") },
                    { title: "Open Pomodoro Timer", icon: "timer", keywords: "focus productivity timer", action: () => AppRegistry.launch("pomodoro") },
                    { title: "Open World Clock", icon: "clock", keywords: "time timezone world clock", action: () => AppRegistry.launch("world-clock") },
                    { title: "Open Markdown Editor", icon: "markdown", keywords: "markdown editor writing", action: () => AppRegistry.launch("md-editor") },
                    { title: "Open Cosmos AI", icon: "ai", keywords: "ai chat cosmos intelligence", action: () => AppRegistry.launch("ai-chat") },
                    { title: "Open Weather", icon: "weather", keywords: "weather forecast city", action: () => AppRegistry.launch("weather") },
                    { title: "Cycle Wallpaper", icon: "image", keywords: "wallpaper background style", action: () => Desktop.cycleWallpaper() },
                    { title: "Cycle Theme", icon: "sun", keywords: "theme appearance color", action: () => SettingsApp.cycleTheme() },
                    { title: "Replay Boot Sequence", icon: "refresh", keywords: "boot restart splash", action: () => Boot.replay() },
                ]);

                StateManager.subscribe("theme", (theme) => document.documentElement.setAttribute("data-theme", theme));
                StateManager.subscribe("reduceMotion", (reduced) => document.documentElement.setAttribute("data-motion",
                    reduced ? "reduced" : "full"));

                PerfMonitor.start();
                PresenceSim.start();

                Logger.info("TITAN", `${TITAN_CONFIG.version} (${TITAN_CONFIG.codename}) ready · ${AppRegistry.list().length} apps`);
                NotificationCenter.push({ type: "success", title: "TITAN Ω Online", message: `v${TITAN_CONFIG.version} · ${AppRegistry
                            .list().length} apps ready`, duration: 3000 });

                const enabledPlugins = StateManager.get("pluginsEnabled") || {};
                Object.entries(enabledPlugins).forEach(([id, on]) => { if (on) PluginFramework.setEnabled(id, true); });

                if (StateManager.get("firstBoot")) {
                    StateManager.set("firstBoot", false);
                    NotificationCenter.push({
                        type: "info",
                        title: "Welcome to TITAN Ω",
                        message: "Start with the Dashboard or open an app from the dock. Press Ctrl+K for the command palette.",
                        duration: 6000
                    });
                }
            } catch (e) {
                const errorEl = document.getElementById("boot-error");
                if (errorEl) {
                    errorEl.textContent = 'Fatal init error: ' + (e.message || e);
                    errorEl.classList.add('visible');
                }
                console.error('TITAN Ω init error:', e);
                throw e;
            }
        });

        document.addEventListener("visibilitychange", () => { EventBus.emit("app:visibility", { hidden: document.hidden }); });

        window.addEventListener("beforeunload", () => {
            [...WindowManager.windows.values()].forEach((w) => { try { w.handle?.destroy?.(); } catch (e) { /* noop */ } });
        });

    </script>
