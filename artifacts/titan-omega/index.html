                    unsubscribeLogNew();
                    unsubscribeLogClear();
                } };
            }
            return { mount };
        })();



        /* ==== js/apps/collabcanvas.js ==== */
        "use strict";
        /******************************************************************
         * [APP:COLLAB] — Collab Canvas
         ******************************************************************/
        const CollabCanvasApp = (() => {
            const SELF_NAMES = ["Jasper Wren", "Rosalind Kade", "Amara Voss", "Dev Okoro", "Wren Castillo",
                "Iris Halvorsen", "Milo Fontaine"
            ];
            const SWATCHES = [
                { hex: "#E8C888", label: "Brass" },
                { hex: "#57D9C4", label: "Cyan" },
                { hex: "#8B85E0", label: "Violet" },
                { hex: "#E0708A", label: "Rose" },
                { hex: "#7FE0A0", label: "Mint" },
                { hex: "#F0F0F0", label: "Chalk" }
            ];
            const STROKE_CAP = 500;

            function mount(bodyEl) {
                const selfName = Utils.pick(SELF_NAMES).trim();
                const selfHue = Utils.hashToHue(selfName);
                let selfColor = SWATCHES[0].hex;
                let brushSize = 3;
                let drawing = false;
                let liveStroke = null;
                let strokes = [];
                let w = 0,
                    h = 0;
                let destroyed = false;
                const unsubs = [];

                const canvas = Utils.el("canvas", { style: { width: "100%", height: "100%", display: "block",
                        cursor: "crosshair", touchAction: "none" } });
                const ctx = canvas.getContext("2d");
                const canvasWrap = Utils.el("div", { class: "split-main", style: { position: "relative" } }, [canvas]);

                const peerRows = new Map();
                const peerListEl = Utils.el("div", { class: "col gap-1", style: { padding: "6px 8px" } });
                const sideEl = Utils.el("div", { class: "split-side scroll-y", style: { width: "222px" } }, [
                    Utils.el("div", { class: "text-3", style: { fontSize: "10px", letterSpacing: ".07em",
                            textTransform: "uppercase", padding: "12px 12px 6px" } }, "In this canvas"),
                    peerListEl,
                    Utils.el("div", { class: "text-3", style: { fontSize: "10.5px", padding: "14px 12px",
                            borderTop: "1px solid var(--hairline)", marginTop: "8px", lineHeight: "1.5" } },
                        "Peers here are simulated locally for demonstration — nothing on this canvas leaves your browser."
                    )
                ]);

                function makePeerRow(name, hue, isSelf) {
                    const dot = Utils.el("span", { style: { width: "9px", height: "9px", borderRadius: "50%",
                            background: `hsl(${hue} 72% 58%)`, flex: "none", boxShadow: `0 0 6px hsl(${hue} 72% 58% / .7)` } });
                    const status = Utils.el("span", { class: "text-3", style: { fontSize: "10.5px" } }, "idle");
                    const row = Utils.el("div", { class: "row gap-2", style: { alignItems: "center",
                            padding: "6px 6px", borderRadius: "var(--r-sm)", background: isSelf ?
                                "rgba(255,255,255,0.04)" : "transparent" } }, [
                        dot,
                        Utils.el("div", { class: "col", style: { flex: "1", minWidth: "0" } }, [
                            Utils.el("div", { class: "text-1", style: { fontSize: "12px", fontWeight: isSelf ?
                                        "600" : "500", whiteSpace: "nowrap", overflow: "hidden",
                                    textOverflow: "ellipsis" } }, isSelf ? `${name} (you)` : name),
                            status
                        ])
                    ]);
                    return { row, statusEl: status, dotEl: dot };
                }

                const selfRow = makePeerRow(selfName, selfHue, true);
                peerListEl.appendChild(selfRow.row);
                const statusTimers = new Set();

                function rebuildPeerRows() {
                    peerRows.forEach((v) => v.row.remove());
                    peerRows.clear();
                    PresenceSim.list().forEach((p) => {
                        const r = makePeerRow(p.name, p.hue, false);
                        peerListEl.appendChild(r.row);
                        peerRows.set(p.id, r);
                    });
                }
                rebuildPeerRows();

                function flashDrawing(statusEl) {
                    statusEl.textContent = "drawing…";
                    statusEl.style.color = "var(--accent-bright)";
                    if (statusEl._t) {
                        clearTimeout(statusEl._t);
                        statusTimers.delete(statusEl._t);
                    }
                    statusEl._t = setTimeout(() => {
                        statusTimers.delete(statusEl._t);
                        statusEl._t = null;
                        statusEl.textContent = "idle";
                        statusEl.style.color = "";
                    }, 1000);
                    statusTimers.add(statusEl._t);
                }

                function pushStroke(s) {
                    strokes.push(s);
                    if (strokes.length > STROKE_CAP) strokes.splice(0, strokes.length - STROKE_CAP);
                }
                function addPeerStroke(hue, nx, ny) {
                    const n = 3 + Math.floor(Math.random() * 4);
                    const pts = [];
                    let x = nx,
                        y = ny;
                    for (let i = 0; i < n; i++) {
                        x = Utils.clamp(x + (Math.random() - 0.5) * 0.06, 0.02, 0.98);
                        y = Utils.clamp(y + (Math.random() - 0.5) * 0.06, 0.05, 0.95);
                        pts.push({ x, y });
                    }
                    pushStroke({ points: pts, color: `hsl(${hue} 70% 58%)`, width: 2.4 });
                }

                function drawStrokeSet(strokeArr) {
                    for (const s of strokeArr) {
                        if (s.points.length < 2) continue;
                        ctx.beginPath();
                        ctx.lineJoin = "round";
                        ctx.lineCap = "round";
                        ctx.strokeStyle = s.color;
                        ctx.lineWidth = s.width;
                        ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
                        for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
                        ctx.stroke();
                    }
                }

                function render() {
                    ctx.clearRect(0, 0, w, h);
                    drawStrokeSet(strokes);
                    if (liveStroke) drawStrokeSet([liveStroke]);
                    PresenceSim.list().forEach((p) => {
                        const px = p.x * w,
                            py = p.y * h;
                        ctx.beginPath();
                        ctx.fillStyle = `hsl(${p.hue} 75% 60%)`;
                        ctx.arc(px, py, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = "rgba(8,11,18,0.85)";
                        ctx.stroke();
                        ctx.font = "600 11px " + getComputedStyle(document.body).fontFamily;
                        const label = p.name;
                        const tw = ctx.measureText(label).width;
                        ctx.fillStyle = "rgba(8,11,18,0.72)";
                        ctx.fillRect(px + 9, py - 9, tw + 10, 18);
                        ctx.fillStyle = "#F2F3F8";
                        ctx.fillText(label, px + 14, py + 4);
                    });
                }

                let raf = null;

                function loop() { if (destroyed) return;
                    render();
                    raf = requestAnimationFrame(loop); }

                const ro = Utils.observeCanvasResize(canvas, ctx, (cw, ch) => { w = cw;
                    h = ch; });

                function nPoint(e) {
                    const r = canvas.getBoundingClientRect();
                    return { x: Utils.clamp((e.clientX - r.left) / r.width, 0, 1), y: Utils.clamp((e.clientY - r.top) /
                        r.height, 0, 1) };
                }
                canvas.addEventListener("pointerdown", (e) => {
                    canvas.setPointerCapture(e.pointerId);
                    drawing = true;
                    liveStroke = { points: [nPoint(e)], color: selfColor, width: brushSize };
                    flashDrawing(selfRow.statusEl);
                });
                canvas.addEventListener("pointermove", (e) => {
                    if (!drawing || !liveStroke) return;
                    liveStroke.points.push(nPoint(e));
                });
                function endStroke() {
                    if (drawing && liveStroke && liveStroke.points.length > 1) pushStroke(liveStroke);
                    drawing = false;
                    liveStroke = null;
                }
                canvas.addEventListener("pointerup", endStroke);
                canvas.addEventListener("pointercancel", endStroke);
                canvas.addEventListener("pointerleave", () => { if (drawing) endStroke(); });

                const swatchBtns = SWATCHES.map((sw) => Utils.el("button", { class: "color-swatch" + (sw.hex ===
                        selfColor ? " active" : ""), style: { background: sw.hex }, title: sw.label, onClick: (e) => {
                        selfColor = sw.hex;
                        swatchBtns.forEach((b) => b.classList.remove("active"));
                        e.currentTarget.classList.add("active");
                    } }));
                const sizeBtns = [{ v: 2, l: "S" }, { v: 3.5, l: "M" }, { v: 6, l: "L" }].map((sz) => Utils.el("button", {
                    class: "btn btn-sm" + (sz.v === brushSize ? " active" : ""), onClick: (e) => {
                        brushSize = sz.v;
                        [...e.currentTarget.parentElement.children].forEach((c) => c.classList.remove("active"));
                        e.currentTarget.classList.add("active");
                    }
                }, sz.l));
                const toolbar = Utils.el("div", { class: "app-toolbar" }, [
                    Utils.el("div", { class: "row gap-1" }, swatchBtns),
                    Utils.el("div", { style: { width: "1px", height: "18px", background: "var(--hairline)",
                            margin: "0 4px" } }),
                    Utils.el("div", { class: "btn-group" }, sizeBtns),
                    Utils.el("div", { class: "grow" }),
                    Utils.el("span", { class: "badge b-cyan" }, "SIMULATED"),
                    Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: () => { strokes = [];
                            liveStroke = null; } }, "Clear Canvas")
                ]);

                const statusbar = Utils.el("div", { class: "app-statusbar" });
                const strokeCountEl = Utils.el("span", {}, "0 strokes");
                const peerCountEl = Utils.el("span", {}, "");
                statusbar.appendChild(Utils.el("div", { class: "row gap-3" }, [strokeCountEl, peerCountEl]));
                statusbar.appendChild(Utils.el("span", {}, "No data leaves your browser"));

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [
                    toolbar,
                    Utils.el("div", { class: "app-body" }, [canvasWrap, sideEl]),
                    statusbar
                ]));

                function tickStatus() {
                    if (destroyed) return;
                    strokeCountEl.textContent = `${strokes.length} stroke${strokes.length === 1 ? "" : "s"}`;
                    peerCountEl.textContent = `${PresenceSim.list().length + 1} present`;
                }
                const statusInterval = setInterval(tickStatus, 600);
                tickStatus();

                unsubs.push(EventBus.on("presence:join", rebuildPeerRows));
                unsubs.push(EventBus.on("presence:leave", rebuildPeerRows));
                unsubs.push(EventBus.on("presence:draw", (d) => {
                    addPeerStroke(d.hue, d.x, d.y);
                    const r = peerRows.get(d.id);
                    if (r) flashDrawing(r.statusEl);
                }));

                loop();

                return {
                    destroy() {
                        destroyed = true;
                        if (raf) cancelAnimationFrame(raf);
                        ro.disconnect();
                        clearInterval(statusInterval);
                        statusTimers.forEach((timer) => clearTimeout(timer));
                        statusTimers.clear();
                        unsubs.forEach((fn) => fn());
                    }
                };
            }
            return { mount };
        })();



        /* ==== js/apps/audiolab.js ==== */
        "use strict";
        /******************************************************************
         * [APP:AUDIOLAB] — Audio Synthesis Lab
         ******************************************************************/
        const AudioLabApp = (() => {
            const SCALE = [
                { key: "a", label: "C", freq: 261.63 },
                { key: "s", label: "D", freq: 293.66 },
                { key: "d", label: "E", freq: 329.63 },
                { key: "f", label: "F", freq: 349.23 },
                { key: "g", label: "G", freq: 392.0 },
                { key: "h", label: "A", freq: 440.0 },
                { key: "j", label: "B", freq: 493.88 },
                { key: "k", label: "C5", freq: 523.25 }
            ];
            const SEQ_STEPS = 8;
            const SEQ_ROWS = [{ label: "C5", freq: 523.25 }, { label: "G4", freq: 392.0 }, { label: "E4", freq: 329.63 },
                { label: "C4", freq: 261.63 }
            ];

            function mount(bodyEl) {
                let actx = null,
                    masterGain = null,
                    analyser = null;
                let waveform = "sawtooth";
                let cutoff = 2400,
                    resonance = 2;
                let attack = 0.02,
                    decay = 0.18,
                    sustain = 0.65,
                    release = 0.35;
                let masterVol = 0.28;
                const activeVoices = new Map();
                let destroyed = false;

                function ensureCtx() {
                    if (!actx) {
                        actx = new(window.AudioContext || window.webkitAudioContext)();
                        masterGain = actx.createGain();
                        masterGain.gain.value = masterVol;
                        masterGain.connect(actx.destination);
                        analyser = actx.createAnalyser();
                        analyser.fftSize = 1024;
                        masterGain.connect(analyser);
                        statusEl.textContent = "Audio: running";
                    }
                    if (actx.state === "suspended") actx.resume();
                    return actx;
                }

                function noteOn(key, freq) {
                    const ctx = ensureCtx();
                    if (activeVoices.has(key)) return;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    osc.type = waveform;
                    osc.frequency.value = freq;
                    const filter = ctx.createBiquadFilter();
                    filter.type = "lowpass";
                    filter.frequency.value = cutoff;
                    filter.Q.value = resonance;
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0, now);
                    const a = Math.max(0.005, attack),
                        d = Math.max(0.005, decay),
                        s = Utils.clamp(sustain, 0, 1);
                    g.gain.linearRampToValueAtTime(1, now + a);
                    g.gain.linearRampToValueAtTime(s, now + a + d);
                    osc.connect(filter);
                    filter.connect(g);
                    g.connect(masterGain);
                    osc.start(now);
                    activeVoices.set(key, { osc, g });
                    updateVoiceCount();
                }
                function noteOff(key) {
                    const v = activeVoices.get(key);
                    if (!v || !actx) return;
                    const now = actx.currentTime;
                    const r = Math.max(0.02, release);
                    v.g.gain.cancelScheduledValues(now);
                    v.g.gain.setValueAtTime(v.g.gain.value, now);
                    v.g.gain.linearRampToValueAtTime(0, now + r);
                    v.osc.stop(now + r + 0.05);
                    activeVoices.delete(key);
                    updateVoiceCount();
                }
                function triggerShort(freq, dur = 0.32) {
                    const ctx = ensureCtx();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    osc.type = waveform;
                    osc.frequency.value = freq;
                    const filter = ctx.createBiquadFilter();
                    filter.type = "lowpass";
                    filter.frequency.value = cutoff;
                    filter.Q.value = resonance;
                    const g = ctx.createGain();
                    const a = Math.max(0.005, attack),
                        d = Math.max(0.005, decay),
                        s = Utils.clamp(sustain, 0, 1),
                        r = Math.max(0.02, release);
                    g.gain.setValueAtTime(0, now);
                    g.gain.linearRampToValueAtTime(1, now + a);
                    g.gain.linearRampToValueAtTime(s, now + a + d);
                    g.gain.setValueAtTime(s, now + dur);
                    g.gain.linearRampToValueAtTime(0, now + dur + r);
                    osc.connect(filter);
                    filter.connect(g);
                    g.connect(masterGain);
                    osc.start(now);
                    osc.stop(now + dur + r + 0.05);
                }
                function panic() { [...activeVoices.keys()].forEach(noteOff); }

                const keyEls = new Map();
                const keyboardEl = Utils.el("div", { class: "row gap-1", style: { padding: "10px", height: "84px" } },
                    SCALE.map((n) => {
                        const kEl = Utils.el("button", { class: "btn audio-key", style: { flex: "1", height: "100%",
                                flexDirection: "column", gap: "6px", fontFamily: "var(--font-mono)" } }, [
                            Utils.el("span", { style: { fontSize: "13px", fontWeight: "700" } }, n.label),
                            Utils.el("span", { class: "text-3", style: { fontSize: "9.5px",
                                    textTransform: "uppercase" } }, n.key)
                        ]);
                        kEl.addEventListener("pointerdown", (e) => { e.preventDefault();
                            kEl.classList.add("active");
                            noteOn(n.key, n.freq); });
                        const release2 = () => { kEl.classList.remove("active");
                            noteOff(n.key); };
                        kEl.addEventListener("pointerup", release2);
                        kEl.addEventListener("pointerleave", release2);
                        keyEls.set(n.key, kEl);
                        return kEl;
                    }));

                const visCanvas = Utils.el("canvas", { style: { width: "100%", height: "100%", display: "block" } });
                const visCtx = visCanvas.getContext("2d");
                const visWrap = Utils.el("div", { style: { height: "110px", borderBottom: "1px solid var(--hairline)",
                        position: "relative" } }, [visCanvas]);
                let visW = 0,
                    visH = 0;
                const visRo = Utils.observeCanvasResize(visCanvas, visCtx, (w, h) => { visW = w;
                    visH = h; });
                let vizRaf = null;

                function drawVis() {
                    if (destroyed) return;
                    visCtx.clearRect(0, 0, visW, visH);
                    visCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--cyan").trim() ||
                        "#57D9C4";
                    visCtx.lineWidth = 1.6;
                    if (analyser) {
                        const buf = new Uint8Array(analyser.fftSize);
                        analyser.getByteTimeDomainData(buf);
                        visCtx.beginPath();
                        for (let i = 0; i < buf.length; i++) {
                            const x = (i / buf.length) * visW;
                            const y = (buf[i] / 255) * visH;
                            i === 0 ? visCtx.moveTo(x, y) : visCtx.lineTo(x, y);
                        }
                        visCtx.stroke();
                    } else {
                        visCtx.beginPath();
                        visCtx.moveTo(0, visH / 2);
                        visCtx.lineTo(visW, visH / 2);
                        visCtx.globalAlpha = 0.3;
                        visCtx.stroke();
                        visCtx.globalAlpha = 1;
                    }
                    vizRaf = requestAnimationFrame(drawVis);
                }

                let seqOn = new Set();
                let seqPlaying = false;
                let seqStep = 0;
                let seqBpm = 120;
                let seqTimer = null;
                const seqCells = [];
                const seqGrid = Utils.el("div", { class: "col gap-1", style: { padding: "0 10px 10px" } },
                    SEQ_ROWS.map((row, ri) => Utils.el("div", { class: "row gap-1", style: { alignItems: "center" } },
                        [
                            Utils.el("span", { class: "text-3 font-mono", style: { width: "28px", fontSize: "10px" } },
                                row.label),
                            ...Array.from({ length: SEQ_STEPS }, (_, si) => {
                                const cell = Utils.el("button", { class: "seq-cell", style: { flex: "1" }, onClick: (
                                    e) => {
                                    const k = ri + "," + si;
                                    if (seqOn.has(k)) { seqOn.delete(k);
                                        e.currentTarget.classList.remove("on"); } else { seqOn.add(k);
                                        e.currentTarget.classList.add("on"); }
                                } });
                                seqCells.push({ el: cell, ri, si });
                                return cell;
                            })
                        ])));

                function seqTick() {
                    seqCells.forEach((c) => c.el.classList.toggle("playhead", c.si === seqStep));
                    SEQ_ROWS.forEach((row, ri) => { if (seqOn.has(ri + "," + seqStep)) triggerShort(row.freq, 60 /
                        seqBpm * 0.9); });
                    seqStep = (seqStep + 1) % SEQ_STEPS;
                }
                function seqStart() {
                    if (seqPlaying) return;
                    ensureCtx();
                    seqPlaying = true;
                    seqStep = 0;
                    playBtn.innerHTML = Icons.svg("pause", 13) + "<span>Stop</span>";
                    seqTimer = setInterval(seqTick, (60 / seqBpm) * 1000);
                    seqTick();
                }
                function seqStop() {
                    seqPlaying = false;
                    clearInterval(seqTimer);
                    playBtn.innerHTML = Icons.svg("play", 13) + "<span>Play</span>";
                    seqCells.forEach((c) => c.el.classList.remove("playhead"));
                }
                const playBtn = Utils.el("button", { class: "btn btn-primary btn-sm", html: Icons.svg("play", 13) +
                        "<span>Play</span>", onClick: () => seqPlaying ? seqStop() : seqStart() });
                const bpmLabel = Utils.el("span", { class: "font-mono text-2", style: { fontSize: "11px",
                        width: "52px" } }, seqBpm + " BPM");
                const bpmSlider = Utils.el("input", { type: "range", class: "slider", min: "60", max: "200", value: String(
                        seqBpm), onInput: (e) => { seqBpm = parseInt(e.target.value, 10);
                        bpmLabel.textContent = seqBpm + " BPM";
                        if (seqPlaying) { clearInterval(seqTimer);
                            seqTimer = setInterval(seqTick, (60 / seqBpm) * 1000); } } });
                const seqHeader = Utils.el("div", { class: "row gap-2", style: { alignItems: "center",
                        padding: "10px" } }, [
                    playBtn,
                    Utils.el("div", { style: { flex: "1" } }, [bpmSlider]),
                    bpmLabel,
                    Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: () => { seqOn.clear();
                            seqCells.forEach((c) => c.el.classList.remove("on")); } }, "Clear")
                ]);

                const waveBtns = [{ v: "sine", l: "Sine" }, { v: "triangle", l: "Triangle" }, { v: "sawtooth",
                    l: "Saw"
                }, { v: "square", l: "Square" }].map((wf) => Utils.el("div", { class: "chip" + (wf.v === waveform ?
                    " active" : ""), onClick: (e) => { waveform = wf.v;
                    [...e.currentTarget.parentElement.children].forEach((c) => c.classList.remove("active"));
                    e.currentTarget.classList.add("active"); } }, wf.l));
                const volSlider = Utils.el("input", { type: "range", class: "slider", min: "0", max: "0.6",
                    step: "0.02", value: String(masterVol), style: { width: "90px" }, onInput: (e) => { masterVol =
                        parseFloat(e.target.value);
                        if (masterGain) masterGain.gain.value = masterVol; } });
                const toolbar = Utils.el("div", { class: "app-toolbar" }, [
                    Utils.el("div", { class: "row gap-1" }, waveBtns),
                    Utils.el("div", { style: { width: "1px", height: "18px", background: "var(--hairline)",
                            margin: "0 4px" } }),
                    Utils.el("span", { class: "text-3", style: { fontSize: "11px" } }, "Vol"),
                    volSlider,
                    Utils.el("div", { class: "grow" }),
                    Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: panic }, "Panic")
                ]);

                function sliderRow(label, min, max, step, val, fmt, onInput) {
                    const valEl = Utils.el("span", { class: "font-mono text-2", style: { fontSize: "10.5px" } }, fmt(
                        val));
                    const s = Utils.el("input", { type: "range", class: "slider", min: String(min), max: String(max),
                        step: String(step), value: String(val), onInput: (e) => { const v = parseFloat(e.target
                                .value);
                            valEl.textContent = fmt(v);
                            onInput(v); } });
                    return Utils.el("div", { style: { marginBottom: "12px" } }, [
                        Utils.el("div", { class: "row", style: { justifyContent: "space-between",
                                marginBottom: "4px" } }, [
                            Utils.el("span", { class: "text-3", style: { fontSize: "10.5px" } }, label), valEl
                        ]),
                        s
                    ]);
                }
                const sideEl = Utils.el("div", { class: "split-side scroll-y", style: { width: "220px",
                        padding: "14px 12px" } }, [
                    Utils.el("div", { class: "text-3", style: { fontSize: "10px", letterSpacing: ".07em",
                            textTransform: "uppercase", marginBottom: "10px" } }, "Filter"),
                    sliderRow("Cutoff", 100, 8000, 10, cutoff, (v) => Math.round(v) + " Hz", (v) => cutoff = v),
                    sliderRow("Resonance", 0.1, 20, 0.1, resonance, (v) => v.toFixed(1), (v) => resonance = v),
                    Utils.el("div", { class: "text-3", style: { fontSize: "10px", letterSpacing: ".07em",
                            textTransform: "uppercase", margin: "18px 0 10px" } }, "Envelope"),
                    sliderRow("Attack", 0.005, 1, 0.005, attack, (v) => v.toFixed(2) + "s", (v) => attack = v),
                    sliderRow("Decay", 0.005, 1, 0.005, decay, (v) => v.toFixed(2) + "s", (v) => decay = v),
                    sliderRow("Sustain", 0, 1, 0.01, sustain, (v) => v.toFixed(2), (v) => sustain = v),
                    sliderRow("Release", 0.02, 2, 0.01, release, (v) => v.toFixed(2) + "s", (v) => release = v)
                ]);

                const statusEl = Utils.el("span", {}, "Audio: click a key to start");
                const voiceCountEl = Utils.el("span", {}, "0 voices");

                function updateVoiceCount() { voiceCountEl.textContent = `${activeVoices.size} voice${activeVoices.size ===
                    1 ? "" : "s"}`; }

                const mainEl = Utils.el("div", { class: "split-main", style: { flexDirection: "column" } }, [
                    visWrap,
                    keyboardEl,
                    Utils.el("div", { style: { borderTop: "1px solid var(--hairline)", flex: "1",
                            display: "flex", flexDirection: "column" } }, [seqHeader, seqGrid])
                ]);

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [
                    toolbar,
                    Utils.el("div", { class: "app-body" }, [mainEl, sideEl]),
                    Utils.el("div", { class: "app-statusbar" }, [statusEl, voiceCountEl])
                ]));

                const keyMap = new Map(SCALE.map((n) => [n.key, n]));
                function onKeyDown(e) {
                    if (e.repeat) return;
                    const k = e.key.toLowerCase();
                    const n = keyMap.get(k);
                    if (!n) return;
                    noteOn(k, n.freq);
                    keyEls.get(k)?.classList.add("active");
                }
                function onKeyUp(e) {
                    const k = e.key.toLowerCase();
                    if (!keyMap.has(k)) return;
                    noteOff(k);
                    keyEls.get(k)?.classList.remove("active");
                }
                bodyEl.tabIndex = -1;
                bodyEl.addEventListener("keydown", onKeyDown);
                bodyEl.addEventListener("keyup", onKeyUp);
                bodyEl.addEventListener("pointerdown", () => bodyEl.focus());
                let focusTimer = setTimeout(() => {
                    focusTimer = null;
                    if (!destroyed) bodyEl.focus();
                }, 50);

                drawVis();

                return {
                    destroy() {
                        destroyed = true;
                        seqStop();
                        visRo.disconnect();
                        if (vizRaf) cancelAnimationFrame(vizRaf);
                        clearTimeout(focusTimer);
                        panic();
                        bodyEl.removeEventListener("keydown", onKeyDown);
                        bodyEl.removeEventListener("keyup", onKeyUp);
                        if (actx) actx.close().catch(() => {});
                    }
                };
            }
            return { mount };
        })();



        /* ==== js/apps/graphbuilder.js ==== */
        "use strict";
        /******************************************************************
         * [APP:GRAPHBUILDER] — Graph Builder
         ******************************************************************/
        const GraphBuilderApp = (() => {
            const HUES = [42, 178, 291, 350, 142, 206];

            function mount(bodyEl) {
                let layout = new ForceLayout2D([], []);
                let selectedId = null;
                let connectMode = false;
                let pendingConnectFrom = null;
                let dragId = null;
                let lastPointer = null;
                let nodeCounter = 0;
                let w = 0,
                    h = 0;
                let destroyed = false;
                let raf = null;
                const bodyFont = getComputedStyle(document.body).fontFamily;

                const canvas = Utils.el("canvas", { style: { width: "100%", height: "100%", display: "block",
                        cursor: "crosshair" } });
                const ctx = canvas.getContext("2d");
                const canvasWrap = Utils.el("div", { class: "split-main", style: { position: "relative" } }, [canvas]);
                const ro = Utils.observeCanvasResize(canvas, ctx, (cw, ch) => { w = cw;
                    h = ch; });

                const sideEl = Utils.el("div", { class: "split-side scroll-y", style: { width: "230px" } });

                function worldToScreen(n) { return { x: w / 2 + n.x, y: h / 2 + n.y }; }
                function screenToWorld(sx, sy) { return { x: sx - w / 2, y: sy - h / 2 }; }
                function nodeAt(sx, sy) {
                    const wp = screenToWorld(sx, sy);
                    let best = null,
                        bestD = 15;
                    for (const n of layout.nodes) {
                        const d = Math.hypot(n.x - wp.x, n.y - wp.y);
                        if (d < bestD) { bestD = d;
                            best = n; }
                    }
                    return best;
                }

                function select(id) { selectedId = id;
                    renderSide(); }

                function addNodeAt(sx, sy) {
                    const wp = screenToWorld(sx, sy);
                    nodeCounter++;
                    const id = Utils.uid("node");
                    const hue = HUES[(nodeCounter - 1) % HUES.length];
                    const n = layout.addNode({ id, label: "Node " + nodeCounter, hue });
                    n.x = wp.x;
                    n.y = wp.y;
                    select(id);
                    updateStatus();
                }
                function deleteNode(id) {
                    layout.removeNode(id);
                    if (selectedId === id) selectedId = null;
                    if (pendingConnectFrom === id) pendingConnectFrom = null;
                    renderSide();
                    updateStatus();
                }
                function deleteEdge(e) { layout.removeEdge(e.a, e.b);
                    updateStatus(); }

                function newGraph() {
                    layout = new ForceLayout2D([], []);
                    selectedId = null;
                    pendingConnectFrom = null;
                    nodeCounter = 0;
                    renderSide();
                    updateStatus();
                }
                function loadGraph(saved) {
                    const nodeDefs = saved.nodes.map((n) => ({ id: n.id, label: n.label, hue: n.hue }));
                    layout = new ForceLayout2D(nodeDefs, saved.edges.map((e) => ({ a: e.a, b: e.b })));
                    saved.nodes.forEach((sn) => { const n = layout.byId.get(sn.id);
                        if (n) { n.x = sn.x;
                            n.y = sn.y;
                            n.pinned = !!sn.pinned; } });
                    layout.settled = false;
                    selectedId = null;
                    pendingConnectFrom = null;
                    nodeCounter = saved.nodes.length;
                    renderSide();
                    updateStatus();
                }
                function saveAs() {
                    if (!layout.nodes.length) { NotificationCenter.push({ type: "warning", title: "Nothing to save",
                        message: "Add at least one node first." }); return; }
                    const name = prompt("Name this graph:", "My Graph");
                    if (!name) return;
                    const snapshot = {
                        id: Utils.uid("graph"), name: name.trim() || "Untitled Graph", savedAt: Date.now(),
                        nodes: layout.nodes.map((n) => ({ id: n.id, label: n.label, hue: n.hue, x: n.x, y: n.y,
                            pinned: !!n.pinned })),
                        edges: layout.edges.map((e) => ({ a: e.a, b: e.b }))
                    };
                    StateManager.push("customGraphs", snapshot);
                    renderSide();
                    NotificationCenter.push({ type: "success", title: "Graph saved",
                        message: `"${snapshot.name}" · ${snapshot.nodes.length} nodes` });
                }

                function renderSide() {
                    sideEl.innerHTML = "";
                    if (selectedId) {
                        const n = layout.byId.get(selectedId);
                        if (!n) { selectedId = null;
                            renderSide(); return; }
                        sideEl.appendChild(Utils.el("div", { class: "text-3", style: { fontSize: "10px",
                                letterSpacing: ".07em", textTransform: "uppercase", padding: "12px 12px 8px" } },
                            "Selected Node"));
                        sideEl.appendChild(Utils.el("input", { type: "text", class: "input", value: n.label,
                            style: { margin: "0 12px 12px", width: "calc(100% - 24px)" }, onInput: (e) => { n
                                .label = e.target.value || "Untitled"; } }));
                        sideEl.appendChild(Utils.el("div", { class: "text-3", style: { fontSize: "10px",
                                padding: "0 12px 6px" } }, "Color"));
                        sideEl.appendChild(Utils.el("div", { class: "row gap-1", style: { padding: "0 12px 14px",
                                flexWrap: "wrap" } }, HUES.map((hue) => Utils.el("button", { class: "color-swatch" +
                                (n.hue === hue ? " active" : ""), style: { background: `hsl(${hue} 70% 55%)` },
                            onClick: () => { n.hue = hue;
                                renderSide(); } }))));
                        sideEl.appendChild(Utils.el("div", { class: "row gap-2", style: { padding: "0 12px" } }, [
                            Utils.el("button", { class: "btn btn-sm", onClick: () => { n.pinned = !n.pinned;
                                    layout.settled = false;
                                    renderSide(); } }, n.pinned ? "Unpin" : "Pin"),
                            Utils.el("button", { class: "btn btn-danger btn-sm", onClick: () => deleteNode(n.id) },
                                "Delete")
                        ]));
                    } else {
                        sideEl.appendChild(Utils.el("div", { class: "text-3", style: { fontSize: "10px",
                                letterSpacing: ".07em", textTransform: "uppercase", padding: "12px 12px 8px" } },
                            "Saved Graphs"));
                        const saved = StateManager.get("customGraphs") || [];
                        if (!saved.length) {
                            sideEl.appendChild(Utils.el("div", { class: "empty-state", style: { padding: "24px 16px" } },
                                [
                                    Utils.el("div", { class: "es-sub" },
                                        "Click empty canvas to add a node. Connect two nodes with Connect mode. Save your graph when you're happy with it.")
                                ]));
                        } else {
                            saved.slice().reverse().forEach((g) => {
                                sideEl.appendChild(Utils.el("div", { class: "card", style: { margin: "0 10px 8px",
                                        padding: "10px" } }, [
                                    Utils.el("div", { class: "text-1", style: { fontSize: "12.5px",
                                            fontWeight: "600", marginBottom: "2px" } }, g.name),
                                    Utils.el("div", { class: "text-3", style: { fontSize: "10.5px",
                                            marginBottom: "8px" } }, `${g.nodes.length} nodes · ${g.edges.length} edges`),
                                    Utils.el("div", { class: "row gap-2" }, [
                                        Utils.el("button", { class: "btn btn-sm", onClick: () => loadGraph(g) },
                                            "Load"),
                                        Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: () => {
                                                StateManager.removeWhere("customGraphs", (x) => x.id === g.id);
                                                renderSide(); } }, "Delete")
                                    ])
                                ]));
                            });
                        }
                    }
                }
                renderSide();

                canvas.addEventListener("pointermove", (e) => {
                    const r = canvas.getBoundingClientRect();
                    lastPointer = { x: e.clientX - r.left, y: e.clientY - r.top };
                    if (dragId) {
                        const n = layout.byId.get(dragId);
                        if (n) { const wp = screenToWorld(lastPointer.x, lastPointer.y);
                            n.x = wp.x;
                            n.y = wp.y;
                            layout.settled = false; }
                    }
                });
                canvas.addEventListener("pointerdown", (e) => {
                    const r = canvas.getBoundingClientRect();
                    const sx = e.clientX - r.left,
                        sy = e.clientY - r.top;
                    const hit = nodeAt(sx, sy);
                    if (connectMode) {
                        if (hit) {
                            if (pendingConnectFrom && pendingConnectFrom !== hit.id) {
                                layout.addEdge(pendingConnectFrom, hit.id);
                                pendingConnectFrom = null;
                                updateStatus();
                            } else pendingConnectFrom = hit.id;
                        } else pendingConnectFrom = null;
                        return;
                    }
                    if (hit) {
                        select(hit.id);
                        dragId = hit.id;
                        hit.pinned = true;
                        canvas.setPointerCapture(e.pointerId);
                    } else {
                        addNodeAt(sx, sy);
                    }
                });
                const endDrag = () => { dragId = null; };
                canvas.addEventListener("pointerup", endDrag);
                canvas.addEventListener("pointercancel", endDrag);
                canvas.addEventListener("contextmenu", (e) => {
                    e.preventDefault();
                    const r = canvas.getBoundingClientRect();
                    const sx = e.clientX - r.left,
                        sy = e.clientY - r.top;
                    const hit = nodeAt(sx, sy);
                    if (hit) { ContextMenuManager.show(e.clientX, e.clientY, [
                            { label: "Delete Node", icon: "trash", danger: true, action: () => deleteNode(hit.id) }
                        ]); return; }
                    const wp = screenToWorld(sx, sy);
                    const edge = layout.edgeNear(wp.x, wp.y, 10);
                    if (edge) ContextMenuManager.show(e.clientX, e.clientY, [
                        { label: "Delete Edge", icon: "trash", danger: true, action: () => deleteEdge(edge) }
                    ]);
                });

                function render() {
                    if (destroyed) return;
                    if (!layout.settled) layout.step();
                    ctx.clearRect(0, 0, w, h);
                    ctx.lineWidth = 1.4;
                    ctx.strokeStyle = "rgba(231,233,240,0.16)";
                    layout.edges.forEach((e) => {
                        const a = layout.byId.get(e.a),
                            b = layout.byId.get(e.b);
                        if (!a || !b) return;
                        const pa = worldToScreen(a),
                            pb = worldToScreen(b);
                        ctx.beginPath();
                        ctx.moveTo(pa.x, pa.y);
                        ctx.lineTo(pb.x, pb.y);
                        ctx.stroke();
                    });
                    if (connectMode && pendingConnectFrom && lastPointer) {
                        const a = layout.byId.get(pendingConnectFrom);
                        if (a) { const pa = worldToScreen(a);
                            ctx.save();
                            ctx.setLineDash([4, 4]);
                            ctx.strokeStyle = "rgba(232,200,136,0.85)";
                            ctx.beginPath();
                            ctx.moveTo(pa.x, pa.y);
                            ctx.lineTo(lastPointer.x, lastPointer.y);
                            ctx.stroke();
                            ctx.restore(); }
                    }
                    layout.nodes.forEach((n) => {
                        const p = worldToScreen(n);
                        const r = n.id === selectedId ? 9 : 7;
                        ctx.beginPath();
                        ctx.fillStyle = Utils.hsl(n.hue, 68, 58);
                        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                        ctx.fill();
                        if (n.id === selectedId || n.id === pendingConnectFrom) {
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = "#F2F3F8";
                            ctx.stroke();
                        }
                        ctx.fillStyle = "#E7E9F0";
                        ctx.font = "500 11px " + bodyFont;
                        ctx.fillText(n.label, p.x + r + 5, p.y + 4);
                    });
                    raf = requestAnimationFrame(render);
                }

                const connectChip = Utils.el("div", { class: "chip", html: Icons.svg("nodeEditor", 13) +
                        "<span>Connect</span>", onClick: (e) => { connectMode = !connectMode;
                        pendingConnectFrom = null;
                        e.currentTarget.classList.toggle("active", connectMode);
                        canvas.style.cursor = connectMode ? "pointer" : "crosshair"; } });
                const toolbar = Utils.el("div", { class: "app-toolbar" }, [
                    Utils.el("button", { class: "btn btn-sm", onClick: newGraph }, "New"),
                    Utils.el("button", { class: "btn btn-sm", onClick: saveAs }, "Save As…"),
                    connectChip,
                    Utils.el("button", { class: "btn btn-ghost btn-sm", onClick: () => { layout.nodes.forEach((n) => n
                            .pinned = false);
                        layout.settled = false; } }, "Unpin All"),
                    Utils.el("div", { class: "grow" }),
                    Utils.el("div", { class: "text-3", style: { fontSize: "10.5px" } },
                        "Click empty canvas to add · right-click to delete")
                ]);

                const nodeCountEl = Utils.el("span", {}, "0 nodes");
                const edgeCountEl = Utils.el("span", {}, "0 edges");

                function updateStatus() {
                    nodeCountEl.textContent = `${layout.nodes.length} node${layout.nodes.length === 1 ? "" : "s"}`;
                    edgeCountEl.textContent = `${layout.edges.length} edge${layout.edges.length === 1 ? "" : "s"}`;
                }
                updateStatus();

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [
                    toolbar,
                    Utils.el("div", { class: "app-body" }, [canvasWrap, sideEl]),
                    Utils.el("div", { class: "app-statusbar" }, [Utils.el("div", { class: "row gap-3" }, [nodeCountEl,
                        edgeCountEl
                    ])])
                ]));

                render();

                return { destroy() {
                        destroyed = true;
                        if (raf) cancelAnimationFrame(raf);
                        ro.disconnect();
                    } };
            }
            return { mount };
        })();



        /* ==== js/apps/settings.js ==== */
        "use strict";
        /******************************************************************
         * [APP:SETTINGS] — Settings & Preferences
         ******************************************************************/

        "use strict";
        /******************************************************************
         * [APP:CALCULATOR] — Scientific calculator
         ******************************************************************/
        const CalculatorApp = (() => {
            let memory = 0;
            let history = [];

            function mount(bodyEl) {
                let display = "0";
                let expression = "";
                let justEvaluated = false;
                let errorTimer = null;

                function updateDisplay() {
                    const el = bodyEl.querySelector(".calc-display");
                    if (el) el.textContent = display;
                }

                function appendDigit(d) {
                    if (justEvaluated) { clearAll(); }
                    if (display === "0" && d !== ".") display = d;
                    else display += d;
                    updateDisplay();
                }

                function appendOp(op) {
                    if (justEvaluated) { justEvaluated = false; }
                    if (["+", "-", "*", "/"].includes(display.slice(-1))) {
                        display = display.slice(0, -1) + op;
                    } else {
                        display += op;
                    }
                    updateDisplay();
                }

                function appendFunction(fn) {
                    if (display === "Error") { clearAll(); }
                    try {
                        const num = parseFloat(display);
                        if (isNaN(num)) { display = "Error";
                            updateDisplay();
                            scheduleClear(); return; }
                        let result;
                        switch (fn) {
                            case "sin":
                                result = Math.sin(num);
                                break;
                            case "cos":
                                result = Math.cos(num);
                                break;
                            case "tan":
                                result = Math.tan(num);
                                break;
                            case "log":
                                result = Math.log10(num);
                                break;
                            case "ln":
                                result = Math.log(num);
                                break;
                            case "sqrt":
                                result = Math.sqrt(num);
                                break;
                            case "sqr":
                                result = num * num;
                                break;
                            case "inv":
                                result = 1 / num;
                                break;
                            case "neg":
                                result = -num;
                                break;
                            default:
                                return;
                        }
                        display = String(result);
                        justEvaluated = true;
                        updateDisplay();
                    } catch (e) {
                        display = "Error";
                        updateDisplay();
                        scheduleClear();
                    }
                }

                function clearAll() {
                    display = "0";
                    expression = "";
                    justEvaluated = false;
                    updateDisplay();
                }

                function scheduleClear() {
                    clearTimeout(errorTimer);
                    errorTimer = setTimeout(() => {
                        errorTimer = null;
                        clearAll();
                    }, 1200);
                }

                function evaluate() {
                    try {
                        const sanitized = display.replace(/[^0-9+\-*/. ]/g, "");
                        const val = Function('"use strict"; return (' + sanitized + ')')();
                        if (typeof val === "number" && isFinite(val)) {
                            display = String(val);
                            justEvaluated = true;
                            updateDisplay();
                            // Add to history
                            history.push({ expression: sanitized, result: val });
                            if (history.length > 50) history.shift();
                        } else {
                            display = "Error";
                            updateDisplay();
                            scheduleClear();
                        }
                    } catch (e) {
                        display = "Error";
                        updateDisplay();
                        scheduleClear();
                    }
                }

                function memoryOp(op) {
                    try {
                        const num = parseFloat(display);
                        if (isNaN(num)) return;
                        if (op === "M+") memory += num;
                        else if (op === "M-") memory -= num;
                        else if (op === "MR") { display = String(memory);
                            updateDisplay(); }
                        else if (op === "MC") memory = 0;
                    } catch (e) { /* ignore */ }
                }

                const displayEl = Utils.el("div", { class: "calc-display" }, display);
                const grid = Utils.el("div", { class: "calc-grid" });

                // Basic buttons
                const basicButtons = [
                    ["C", "clear"], ["±", "neg"], ["%", "percent"], ["÷", "op", "/"],
                    ["7", "digit"], ["8", "digit"], ["9", "digit"], ["×", "op", "*"],
                    ["4", "digit"], ["5", "digit"], ["6", "digit"], ["−", "op", "-"],
                    ["1", "digit"], ["2", "digit"], ["3", "digit"], ["+", "op", "+"],
                    ["0", "digit"], [".", "digit"], ["=", "equals"]
                ];
                // Scientific buttons
                const sciButtons = [
                    ["sin", "func", "sin"], ["cos", "func", "cos"], ["tan", "func", "tan"],
                    ["log", "func", "log"], ["ln", "func", "ln"], ["√", "func", "sqrt"],
                    ["x²", "func", "sqr"], ["1/x", "func", "inv"], ["M+", "mem", "M+"],
                    ["M-", "mem", "M-"], ["MR", "mem", "MR"], ["MC", "mem", "MC"]
                ];

                // Render grid: 4 columns, we'll do basic first then sci in a second row
                const gridRows = [
                    basicButtons.slice(0, 4),
                    basicButtons.slice(4, 8),
                    basicButtons.slice(8, 12),
                    basicButtons.slice(12, 16),
                    basicButtons.slice(16, 19)
                ];
                // Add scientific row
                const sciRow = sciButtons;

                // Build grid
                gridRows.forEach((row) => {
                    const rowDiv = Utils.el("div", { class: "row gap-1", style: { marginBottom: "6px" } });
                    row.forEach(([label, type, value]) => {
                        const btn = Utils.el("button", {
                            class: "calc-btn" + (type === "op" ? " operator" : "") + (type === "equals" ?
                                " equals" : "") + (type === "func" || type === "mem" ? " operator" : ""),
                            style: { flex: "1" },
                            onClick: () => {
                                if (type === "clear") clearAll();
                                else if (type === "neg") { if (display !== "0") display = display
                                        .startsWith("-") ? display.slice(1) : "-" + display;
                                    updateDisplay(); } else if (type === "percent") { try { const num =
                                            parseFloat(display);
                                        if (!isNaN(num)) display = String(num / 100);
                                        updateDisplay(); } catch (e) { /* ignore */ } } else if (
                                    type === "digit" || type === "equals") {
                                    if (type === "equals") evaluate();
                                    else appendDigit(label);
                                } else if (type === "op") appendOp(value);
                                else if (type === "func") appendFunction(value);
                                else if (type === "mem") memoryOp(value);
                            }
                        }, label);
                        rowDiv.appendChild(btn);
                    });
                    grid.appendChild(rowDiv);
                });

                // Add scientific row (different layout – 3 columns)
                const sciRowDiv = Utils.el("div", { class: "row gap-1", style: { marginTop: "6px", flexWrap: "wrap" } });
                sciButtons.forEach(([label, type, value]) => {
                    const btn = Utils.el("button", {
                        class: "calc-btn" + (type === "func" || type === "mem" ? " operator" : ""),
                        style: { flex: "1 0 30%", minWidth: "48px" },
                        onClick: () => {
                            if (type === "func") appendFunction(value);
                            else if (type === "mem") memoryOp(value);
                        }
                    }, label);
                    sciRowDiv.appendChild(btn);
                });
                grid.appendChild(sciRowDiv);

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [
                    displayEl,
                    grid
                ]));
                return { destroy() { clearTimeout(errorTimer); } };
            }
            return { mount };
        })();

                const resolved = [];
                for (const part of parts) {
                    if (part === "..") resolved.pop();
                    else if (part !== ".") resolved.push(part);

                const workspacePath = (target) => resolvePath(cwd, target).replace(/^\/home\/user/, "") || "/";

                inputWrap.appendChild(promptEl);

                function updatePrompt() {
                    const display = cwd.replace("/home/user", "~");
                    promptEl.textContent = `user@titan:${display}$ `;
                }
                updatePrompt();

                function printRaw(html) {
                    const line = document.createElement("div");
                    line.className = "term-line";
                    line.innerHTML = html;
                    output.appendChild(line);
                    output.scrollTop = output.scrollHeight;
                }

                function print(text, color = COLORS.info) {
                    const escaped = Utils.escapeHtml(text);
                    printRaw(`<span style="color:${color}">${escaped}</span>`);
                }

                function printPair(label, value, lc = COLORS.dim, vc = COLORS.info) {

                        else if (matches.length > 1) { print(matches.join("  "), COLORS.dim); }
                    } else if (e.key === "l" && e.ctrlKey) {
                        e.preventDefault();
                        output.innerHTML = "";
                    }
                });

                // Welcome message
                printRaw(`<span style="color:${COLORS.header};font-weight:600">TITAN Ω Terminal v2.0</span><span style="color:${COLORS.dim}"> — Enhanced Shell</span>`);
                print('/etc/motd:', COLORS.dim);
                const motd = getNode("/etc/motd");
                if (motd) motd.content.split("\n").forEach(l => print(l, COLORS.success));
                print("", COLORS.dim);

                inputEl.focus();
                return { destroy() { activeIntervals.forEach((id) => clearInterval(id)); activeIntervals.clear(); } };
            }
            return { mount };
        })();



        /* ==== js/apps/whiteboard.js ==== */
        "use strict";
        /******************************************************************
         * [APP:WHITEBOARD] — Free-form drawing canvas (enhanced)
         ******************************************************************/
        const WhiteboardApp = (() => {
            const SWATCHES = ["#E8C888","#57D9C4","#8B85E0","#E0708A","#7FE0A0","#F5A623","#F0F0F0","#888888","#333333","#000000"];

            function mount(bodyEl) {
                const canvas = Utils.el("canvas", { class: "whiteboard-canvas" });
                const canvasWrap = Utils.el("div", { style: { flex: "1", position: "relative", background: "rgba(0,0,0,0.15)", overflow: "hidden" } }, [canvas]);

                let tool = "pen", color = "#E8C888", brushSize = 4;
                let drawing = false, lastX = 0, lastY = 0, startX = 0, startY = 0;
                let undoStack = [], redoStack = [];
                let snapshot = null;

                const ctx = canvas.getContext("2d");
                let w = 0, h = 0;

                const TOOLS = [
                    { id: "pen", icon: "✏️", label: "Pen" },
                    { id: "eraser", icon: "🗑", label: "Eraser" },
                    { id: "line", icon: "╱", label: "Line" },
                    { id: "rect", icon: "▭", label: "Rectangle" },
                    { id: "circle", icon: "○", label: "Circle" },
                    { id: "arrow", icon: "→", label: "Arrow" },
                ];

                const toolBtns = {};
                const toolPanel = Utils.el("div", { class: "wb-toolpanel" });
                TOOLS.forEach(t => {
                    const btn = Utils.el("button", { class: "wb-tool" + (t.id === tool ? " active" : ""),
                        title: t.label, onClick: () => {
                            tool = t.id;
                            Object.values(toolBtns).forEach(b => b.classList.remove("active"));
                            btn.classList.add("active");
                            canvas.style.cursor = t.id === "eraser" ? "cell" : t.id === "pen" ? "crosshair" : "crosshair";
                        } }, t.icon);
                    toolBtns[t.id] = btn;
                    toolPanel.appendChild(btn);
                });
                toolPanel.appendChild(Utils.el("div", { class: "wb-tool-sep" }));

                // Size buttons
                [["S","2"],["M","4"],["L","8"],["XL","14"]].forEach(([label, size]) => {
                    toolPanel.appendChild(Utils.el("button", {
                        class: "wb-tool" + (size === "4" ? " active" : ""),
                        title: `Size ${label}`,
                        onClick: (e) => { brushSize = +size; [...e.currentTarget.parentElement.querySelectorAll("[data-size]")].forEach(b => b.classList.remove("active")); e.currentTarget.classList.add("active"); },
                        dataset: { size }
                    }, label));
                });

                toolPanel.appendChild(Utils.el("div", { class: "wb-tool-sep" }));
                // Undo / Redo
                const undoBtn = Utils.el("button", { class: "wb-tool", title: "Undo (Ctrl+Z)", onClick: undo }, "↩");
                const redoBtn = Utils.el("button", { class: "wb-tool", title: "Redo (Ctrl+Y)", onClick: redo }, "↪");
                toolPanel.appendChild(undoBtn);
                toolPanel.appendChild(redoBtn);
                toolPanel.appendChild(Utils.el("div", { class: "wb-tool-sep" }));
                toolPanel.appendChild(Utils.el("button", { class: "wb-tool", title: "Export PNG", onClick: exportPng }, "💾"));
                toolPanel.appendChild(Utils.el("button", { class: "wb-tool", title: "Clear canvas", onClick: clearCanvas, style: "color:var(--rose)" }, "✕"));

                // Color swatches in toolbar
                const swatchRow = Utils.el("div", { class: "row gap-1", style: { flexWrap: "wrap", padding: "4px" } });
                SWATCHES.forEach(c => {
                    const sw = Utils.el("button", { class: "color-swatch" + (c === color ? " active" : ""),
                        style: { background: c, width: "18px", height: "18px" },
                        onClick: (e) => { color = c; [...swatchRow.children].forEach(b => b.classList.remove("active")); e.currentTarget.classList.add("active"); } });
                    swatchRow.appendChild(sw);
                });

                const toolbar = Utils.el("div", { class: "app-toolbar", style: { flexWrap: "wrap" } }, [
                    swatchRow,
                    Utils.el("div", { class: "grow" }),
                    Utils.el("button", { class: "btn btn-ghost btn-sm", style: { fontSize: "11px" }, onClick: () => toggleGrid() }, "Grid"),
                ]);

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [
                    toolbar,
                    Utils.el("div", { class: "row grow", style: { overflow: "hidden" } }, [toolPanel, canvasWrap])
                ]));

                let showGrid = false;
                function toggleGrid() {
                    showGrid = !showGrid;
                    if (!showGrid) { ctx.clearRect(0, 0, w, h); restoreSnapshot(); }
                    drawGrid();
                }

                function drawGrid() {
                    if (!showGrid) return;
                    ctx.save();
                    ctx.strokeStyle = "rgba(255,255,255,0.05)";
                    ctx.lineWidth = 1;
                    const step = 30;
                    for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                    for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
                    ctx.restore();
                }

                function saveUndo() {
                    undoStack.push(canvas.toDataURL());
                    if (undoStack.length > 40) undoStack.shift();
                    redoStack = [];
                }

                function undo() {
                    if (!undoStack.length) return;
                    redoStack.push(canvas.toDataURL());
                    const img = new Image();
                    img.src = undoStack.pop();
                    img.onload = () => { ctx.clearRect(0, 0, w, h); ctx.drawImage(img, 0, 0); if (showGrid) drawGrid(); };
                }

                function redo() {
                    if (!redoStack.length) return;
                    undoStack.push(canvas.toDataURL());
                    const img = new Image();
                    img.src = redoStack.pop();
                    img.onload = () => { ctx.clearRect(0, 0, w, h); ctx.drawImage(img, 0, 0); if (showGrid) drawGrid(); };
                }

                function clearCanvas() {
                    saveUndo();
                    ctx.clearRect(0, 0, w, h);
                    if (showGrid) drawGrid();
                }

                function exportPng() {
                    const link = document.createElement("a");
                    link.download = "whiteboard.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }

                function getPos(e) {
                    const r = canvas.getBoundingClientRect();
                    return { x: (e.clientX - r.left) * (canvas.width / r.width / window.devicePixelRatio), y: (e.clientY - r.top) * (canvas.height / r.height / window.devicePixelRatio) };
                }

                function saveSnapshot() { snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height); }
                function restoreSnapshot() { if (snapshot) ctx.putImageData(snapshot, 0, 0); }

                function drawArrow(x1, y1, x2, y2) {
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    const headLen = Math.max(10, brushSize * 3);
                    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                    ctx.moveTo(x2, y2);
                    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                }

                canvas.addEventListener("pointerdown", (e) => {
                    drawing = true;
                    const pos = getPos(e);
                    lastX = startX = pos.x; lastY = startY = pos.y;
                    canvas.setPointerCapture(e.pointerId);
                    saveUndo();
                    if (tool === "pen" || tool === "eraser") {
                        ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                    } else {
                        saveSnapshot();
                    }
                });

                canvas.addEventListener("pointermove", (e) => {
                    if (!drawing) return;
                    const pos = getPos(e);
                    ctx.lineCap = "round"; ctx.lineJoin = "round";
                    if (tool === "pen") {
                        ctx.strokeStyle = color; ctx.lineWidth = brushSize;
                        ctx.lineTo(pos.x, pos.y); ctx.stroke();
                        lastX = pos.x; lastY = pos.y;
                    } else if (tool === "eraser") {
                        ctx.strokeStyle = "rgba(0,0,0,1)"; ctx.globalCompositeOperation = "destination-out";
                        ctx.lineWidth = brushSize * 3;
                        ctx.lineTo(pos.x, pos.y); ctx.stroke();
                        ctx.globalCompositeOperation = "source-over";
                        lastX = pos.x; lastY = pos.y;
                    } else {
                        restoreSnapshot();
                        if (showGrid) drawGrid();
                        ctx.strokeStyle = color; ctx.lineWidth = brushSize;
                        ctx.beginPath();
                        if (tool === "line") { ctx.moveTo(startX, startY); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
                        else if (tool === "rect") { ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY); }
                        else if (tool === "circle") {
                            const rx = (pos.x - startX) / 2, ry = (pos.y - startY) / 2;
                            ctx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
                            ctx.stroke();
                        } else if (tool === "arrow") { drawArrow(startX, startY, pos.x, pos.y); ctx.stroke(); }
                    }
                });

                canvas.addEventListener("pointerup", () => { drawing = false; snapshot = null; ctx.beginPath(); });
                canvas.addEventListener("pointercancel", () => { drawing = false; });

                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
                    if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.shiftKey && e.key === "z"))) { e.preventDefault(); redo(); }
                };
                document.addEventListener("keydown", onKeyDown);

                const ro = Utils.observeCanvasResize(canvas, ctx, (cw, ch) => { w = cw; h = ch; if (showGrid) drawGrid(); });
                canvas.style.cursor = "crosshair";

                return { destroy() {
                    document.removeEventListener("keydown", onKeyDown);
                    ro.disconnect();
                } };
            }
            return { mount };
        })();

                // Filter chips
                const filterChips = Utils.el("div", { class: "row gap-1", style: { padding: "8px 12px", borderBottom: "1px solid var(--hairline)", flexWrap: "wrap", gap: "6px" } });
                const filters = [["all","All"],["active","Active"],["done","Done"],["high","🔴 High"],["medium","🟡 Med"],["low","🟢 Low"]];
                const chipEls = {};
                filters.forEach(([v, l]) => {
                    const chip = Utils.el("div", { class: "chip" + (v === "all" ? " active" : ""), onClick: () => {

                        priorityFilter = (v === "high" || v === "medium" || v === "low") ? v : "all";

                        Object.values(chipEls).forEach(c => c.classList.remove("active"));
                        chip.classList.add("active");
                        renderTodos();
                    } }, l);
                    chipEls[v] = chip;
                    filterChips.appendChild(chip);
                });

                // Stats bar
                const statsBar = Utils.el("div", { class: "row gap-3", style: { padding: "6px 12px", background: "var(--ink-3)", borderBottom: "1px solid var(--hairline)", fontSize: "11px" } });

                bodyEl.appendChild(Utils.el("div", { class: "app-root" }, [addRow, filterChips, statsBar, listWrap]));

                function getTodos() { return StateManager.get("todos2") || []; }

                function renderStats() {
                    const all = getTodos();
                    const done = all.filter(t => t.done).length;
                    const high = all.filter(t => t.priority === "high" && !t.done).length;
                    const pct = all.length ? Math.round(done / all.length * 100) : 0;
                    statsBar.innerHTML = "";
                    statsBar.appendChild(Utils.el("span", { class: "text-3" }, `${done}/${all.length} done`));
                    const bar = Utils.el("div", { style: { flex: "1", height: "4px", background: "var(--hairline)", borderRadius: "2px", overflow: "hidden" } },
                        [Utils.el("div", { style: { height: "100%", width: pct + "%", background: "var(--accent-2)", borderRadius: "2px", transition: "width 0.4s" } })]);
                    statsBar.appendChild(bar);
