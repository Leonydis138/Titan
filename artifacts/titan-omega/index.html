<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<!-- Created by Juan louw Greyling (juanlouw.greyling@gmail.com) -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#080B12">
    <title>TITAN Ω — Computational Workspace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23C9A468' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2357D9C4' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23E8C888'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           TITAN Ω — DESIGN SYSTEM (enhanced)
           ================================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-sans);
            color: var(--text-1);
            background: var(--ink);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            user-select: none;
        }
        input,
        textarea {
            user-select: text;
        }
        img,
        svg {
            display: block;
        }
        button {
            font: inherit;
            color: inherit;
        }
        a {
            color: inherit;
        }
        ul,
        ol {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            margin: 0;
        }
        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ---------- Design Tokens ---------- */
        :root {
            --ink: #080B12;
            --ink-2: #0D1220;
            --ink-3: #131A2C;
            --ink-4: #1A2338;
            --brass: #C9A468;
            --brass-bright: #E8C888;
            --brass-dim: #8A7148;
            --cyan: #57D9C4;
            --cyan-bright: #8EF0E0;
            --violet: #8B85E0;
            --violet-bright: #ACA6F5;
            --rose: #E0708A;
            --amber: #E0A94E;
            --text-1: #E7E9F0;
            --text-2: #9AA1B8;
            --text-3: #5C6480;
            --text-inv: #0A0D16;
            --accent: var(--brass);
            --accent-bright: var(--brass-bright);
            --accent-2: var(--cyan);
            --accent-3: var(--violet);
            --success: var(--cyan);
            --warning: var(--amber);
            --danger: var(--rose);
            --info: var(--violet);
            --bg-void: var(--ink);
            --bg-deep: var(--ink-2);
            --bg-surface: var(--ink-3);
            --bg-raised: var(--ink-4);
            --glass-bg: rgba(19, 26, 44, 0.62);
            --glass-bg-2: rgba(13, 18, 32, 0.78);
            --glass-border: rgba(201, 164, 104, 0.16);
            --glass-border-soft: rgba(231, 233, 240, 0.08);
            --glass-blur: 22px;
            --hairline: rgba(231, 233, 240, 0.09);
            --hairline-strong: rgba(231, 233, 240, 0.16);
            --sp-1: 4px;
            --sp-2: 8px;
            --sp-3: 12px;
            --sp-4: 16px;
            --sp-5: 20px;
            --sp-6: 24px;
            --sp-7: 28px;
            --sp-8: 32px;
            --sp-10: 40px;
            --sp-12: 48px;
            --sp-16: 64px;
            --r-xs: 6px;
            --r-sm: 9px;
            --r-md: 13px;
            --r-lg: 18px;
            --r-xl: 26px;
            --r-pill: 999px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 24px 64px -12px rgba(0, 0, 0, 0.65);
            --shadow-window: 0 30px 80px -16px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --glow-brass: 0 0 0 1px rgba(201, 164, 104, 0.35), 0 0 24px -4px rgba(201, 164, 104, 0.45);
            --glow-cyan: 0 0 0 1px rgba(87, 217, 196, 0.35), 0 0 24px -4px rgba(87, 217, 196, 0.5);
            --glow-violet: 0 0 0 1px rgba(139, 133, 224, 0.35), 0 0 24px -4px rgba(139, 133, 224, 0.5);
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Consolas, "Roboto Mono", Menlo, monospace;
            --fs-2xs: 10.5px;
            --fs-xs: 11.5px;
            --fs-sm: 12.5px;
            --fs-md: 13.5px;
            --fs-lg: 15.5px;
            --fs-xl: 18px;
            --fs-2xl: 23px;
            --fs-3xl: 31px;
            --fs-4xl: 42px;
            --lh-tight: 1.15;
            --lh-normal: 1.5;
            --lh-loose: 1.7;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 110ms;
            --dur-med: 220ms;
            --dur-slow: 420ms;
            --dur-slower: 700ms;
            --topbar-h: 34px;
            --dock-h: 68px;
            --mobile-dock-h: 60px;
            --z-desktop: 1;
            --z-icons: 5;
            --z-windows: 100;
            --z-dock: 800;
            --z-topbar: 900;
            --z-tooltip: 950;
            --z-palette: 1000;
            --z-overview: 1050;
            --z-context: 1100;
            --z-notify: 1200;
            --z-boot: 2000;
        }

        [data-theme="aurora"] {
            --accent: #4FD1A5;
            --accent-bright: #7EE8C3;
            --accent-2: #57C7E0;
            --accent-3: #8B85E0;
            --glass-border: rgba(79, 209, 165, 0.18);
            --glow-brass: 0 0 0 1px rgba(79, 209, 165, 0.35), 0 0 24px -4px rgba(79, 209, 165, 0.45);
        }
        [data-theme="solar"] {
            --ink: #EEF1F8;
            --ink-2: #E4E8F2;
            --ink-3: #D9DEEC;
            --ink-4: #CBD2E6;
            --text-1: #131A2C;
            --text-2: #4A5170;
            --text-3: #7B84A3;
            --text-inv: #F5F7FC;
            --glass-bg: rgba(255, 255, 255, 0.62);
            --glass-bg-2: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(19, 26, 44, 0.1);
            --glass-border-soft: rgba(19, 26, 44, 0.08);
            --hairline: rgba(19, 26, 44, 0.09);
            --hairline-strong: rgba(19, 26, 44, 0.16);
            --shadow-window: 0 30px 80px -16px rgba(30, 40, 70, 0.25), 0 0 0 1px rgba(19, 26, 44, 0.06);
        }
        [data-theme="obsidian"] {
            --ink: #000000;
            --ink-2: #07080B;
            --ink-3: #101218;
            --ink-4: #181B24;
            --glass-bg: rgba(10, 11, 15, 0.72);
            --glass-border: rgba(201, 164, 104, 0.14);
        }
        [data-theme="neon"] {
            --ink: #06030F;
            --ink-2: #0A0518;
            --ink-3: #100822;
            --ink-4: #180D30;
            --brass: #FF2DF7;
            --brass-bright: #FF80FA;
            --brass-dim: #8A1A86;
            --cyan: #00F5FF;
            --cyan-bright: #80FAFF;
            --violet: #7B2FFF;
            --violet-bright: #A87BFF;
            --accent: var(--brass);
            --accent-bright: var(--brass-bright);
            --accent-2: var(--cyan);
            --accent-3: var(--violet);
            --glass-border: rgba(255, 45, 247, 0.22);
            --glass-border-soft: rgba(0, 245, 255, 0.08);
            --glow-brass: 0 0 0 1px rgba(255, 45, 247, 0.4), 0 0 30px -4px rgba(255, 45, 247, 0.6);
            --glow-cyan: 0 0 0 1px rgba(0, 245, 255, 0.4), 0 0 30px -4px rgba(0, 245, 255, 0.6);
        }
        [data-theme="matrix"] {
            --ink: #000300;
            --ink-2: #001100;
            --ink-3: #001800;
            --ink-4: #002200;
            --brass: #00FF41;
            --brass-bright: #80FF90;
            --brass-dim: #007A1F;
            --cyan: #00DD88;
            --cyan-bright: #80FFCC;
            --violet: #00BBFF;
            --violet-bright: #80DDFF;
            --text-1: #C0FFC0;
            --text-2: #70B870;
            --text-3: #3A6E3A;
            --accent: var(--brass);
            --accent-bright: var(--brass-bright);
            --accent-2: var(--cyan);
            --accent-3: var(--violet);
            --glass-border: rgba(0, 255, 65, 0.18);
            --glass-border-soft: rgba(0, 255, 65, 0.06);
            --hairline: rgba(0, 255, 65, 0.08);
            --hairline-strong: rgba(0, 255, 65, 0.16);
            --glow-brass: 0 0 0 1px rgba(0, 255, 65, 0.4), 0 0 24px -4px rgba(0, 255, 65, 0.5);
        }
        [data-theme="forest"] {
            --ink: #050D08;
            --ink-2: #091510;
            --ink-3: #0E1E16;
            --ink-4: #142A1E;
            --brass: #7EC850;
            --brass-bright: #A8E878;
            --brass-dim: #3E6428;
            --cyan: #50D4A0;
            --cyan-bright: #88ECC4;
            --violet: #C8A050;
            --violet-bright: #E8C888;
            --accent: var(--brass);
            --accent-bright: var(--brass-bright);
            --accent-2: var(--cyan);
            --accent-3: var(--violet);
            --glass-border: rgba(126, 200, 80, 0.18);
            --glow-brass: 0 0 0 1px rgba(126, 200, 80, 0.35), 0 0 24px -4px rgba(126, 200, 80, 0.45);
        }
        [data-motion="reduced"] *,
        [data-motion="reduced"] *::before,
        [data-motion="reduced"] *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }

        /* ---------- Typography ---------- */
        .font-mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }
        .eyebrow {
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
            font-weight: 500;
        }
        .text-1 {
            color: var(--text-1);
        }
        .text-2 {
            color: var(--text-2);
        }
        .text-3 {
            color: var(--text-3);
        }
        .text-accent {
            color: var(--accent);
        }
        .text-cyan {
            color: var(--accent-2);
        }
        .text-violet {
            color: var(--accent-3);
        }

        /* ---------- Layout Utilities ---------- */
        .row {
            display: flex;
            align-items: center;
        }
        .col {
            display: flex;
            flex-direction: column;
        }
        .grow {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
        }
        .gap-1 {
            gap: var(--sp-1);
        }
        .gap-2 {
            gap: var(--sp-2);
        }
        .gap-3 {
            gap: var(--sp-3);
        }
        .gap-4 {
            gap: var(--sp-4);
        }
        .hidden {
            display: none !important;
        }
        .scroll-y {
            overflow-y: auto;
            overflow-x: hidden;
        }
        .scroll-x {
            overflow-x: auto;
            overflow-y: hidden;
        }

        /* ---------- Scrollbars ---------- */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--hairline-strong) transparent;
        }
        *::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        *::-webkit-scrollbar-track {
            background: transparent;
        }
        *::-webkit-scrollbar-thumb {
            background: var(--hairline-strong);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        *::-webkit-scrollbar-thumb:hover {
            background: var(--text-3);
            background-clip: content-box;
        }
        ::selection {
            background: rgba(201, 164, 104, 0.35);
            color: var(--text-1);
        }

        /* ---------- Glass primitive ---------- */
        .glass {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            border: 1px solid var(--glass-border);
        }
        .glass-solid {
            background: var(--glass-bg-2);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            border: 1px solid var(--glass-border);
        }

        /* ================================================================
           ROOT LAYERS
        ================================================================ */
        #titan-root {
            position: fixed;
            inset: 0;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* ---------- Boot Screen ---------- */
        .boot-screen {
            position: fixed;
            inset: 0;
            z-index: var(--z-boot);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: radial-gradient(ellipse at 50% 40%, #0D1424 0%, var(--ink) 70%);
            transition: opacity var(--dur-slower) var(--ease-out-expo), visibility var(--dur-slower);
        }
        .boot-screen.boot-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .boot-emblem {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: var(--sp-8);
        }
        .boot-emblem svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .boot-ring {
            transform-origin: 75px 75px;
        }
        .boot-ring.r1 {
            animation: spin 7s linear infinite;
        }
        .boot-ring.r2 {
            animation: spin 4.5s linear infinite reverse;
        }
        .boot-ring.r3 {
            animation: spin 11s linear infinite;
        }
        .boot-core {
            animation: pulse-glow 2.1s ease-in-out infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse-glow {
            0%,
            100% {
                opacity: 0.65;
                filter: drop-shadow(0 0 3px currentColor);
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 11px currentColor);
            }
        }
        .boot-wordmark {
            font-size: var(--fs-2xl);
            letter-spacing: 0.42em;
            font-weight: 600;
            text-align: center;
            color: var(--text-1);
            margin-bottom: var(--sp-2);
            padding-left: 0.42em;
        }
        .boot-wordmark span {
            color: var(--brass);
        }
        .boot-tagline {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            letter-spacing: 0.18em;
            color: var(--text-3);
            text-transform: uppercase;
            margin-bottom: var(--sp-10);
        }
        .boot-progress {
            width: 280px;
            height: 2px;
            background: var(--hairline);
            border-radius: 2px;
            overflow: hidden;
        }
        .boot-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--brass), var(--cyan));
            transition: width var(--dur-med) var(--ease-standard);
        }
        .boot-status {
            margin-top: var(--sp-4);
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
            color: var(--text-3);
            letter-spacing: 0.06em;
            height: 16px;
        }
        .boot-error {
            color: var(--rose);
            font-family: var(--font-mono);
            font-size: 12px;
            margin-top: 12px;
            max-width: 80%;
            text-align: center;
            word-break: break-word;
            display: none;
            background: rgba(224, 112, 138, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(224, 112, 138, 0.3);
        }
        .boot-error.visible {
            display: block;
        }

        /* ---------- Desktop ---------- */
        .desktop {
            position: absolute;
            inset: 0;
            top: var(--topbar-h);
            bottom: 0;
            z-index: var(--z-desktop);
            overflow: hidden;
        }
        .wallpaper-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .desktop-icons {
            position: absolute;
            inset: 0;
            z-index: var(--z-icons);
            padding: var(--sp-6);
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 96px);
            gap: 2px;
            justify-content: start;
            align-content: start;
            column-gap: var(--sp-2);
        }
        .desktop-icon {
            width: 88px;
            height: 92px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            padding: 8px 4px;
            border-radius: var(--r-md);
            cursor: default;
            text-align: center;
            border: 1px solid transparent;
        }
        .desktop-icon .di-glyph {
            width: 44px;
            height: 44px;
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--ink-4), var(--ink-3));
            border: 1px solid var(--glass-border-soft);
            color: var(--accent);
            transition: transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast);
        }
        .desktop-icon .di-label {
            font-size: var(--fs-xs);
            color: var(--text-1);
            line-height: 1.25;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .desktop-icon:hover .di-glyph {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .desktop-icon.selected {
            background: rgba(87, 217, 196, 0.08);
            border-color: rgba(87, 217, 196, 0.28);
        }
        .desktop-icon.selected .di-glyph {
            box-shadow: var(--glow-cyan);
            border-color: rgba(87, 217, 196, 0.4);
        }

        /* ---------- TopBar ---------- */
        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: var(--topbar-h);
            z-index: var(--z-topbar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--sp-3);
            background: var(--glass-bg-2);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--hairline);
            font-size: var(--fs-sm);
        }
        .topbar-section {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            height: 100%;
        }
        .tb-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 9px;
            border-radius: var(--r-sm);
            background: transparent;
            border: none;
            cursor: default;
            color: var(--text-2);
            transition: background var(--dur-fast), color var(--dur-fast);
        }
        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-1);
        }
        .tb-btn.tb-logo {
            color: var(--brass);
            font-weight: 700;
            letter-spacing: 0.05em;
            gap: 7px;
        }
        .tb-clock {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            color: var(--text-2);
            letter-spacing: 0.03em;
        }
        .tb-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
            color: var(--text-3);
            padding: 0 6px;
        }
        .tb-stat b {
            color: var(--text-2);
            font-weight: 500;
        }
        .tb-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 6px var(--cyan);
            animation: blink-soft 2.4s ease-in-out infinite;
        }
        @keyframes blink-soft {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }
        .notif-bell {
            position: relative;
        }
        .notif-badge {
            position: absolute;
            top: 1px;
            right: 3px;
            min-width: 14px;
            height: 14px;
            padding: 0 3px;
            border-radius: 8px;
            background: var(--rose);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
        }
        .tb-presence {
            display: flex;
            align-items: center;
            padding: 0 8px 0 2px;
        }
        .tb-presence-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8.5px;
            font-weight: 700;
            color: var(--text-inv);
            border: 1.5px solid var(--bg-deep);
            margin-left: -6px;
            flex: none;
        }
        .tb-presence-dot:first-child {
            margin-left: 0;
        }
        .tb-presence-more {
            font-size: 9.5px;
            color: var(--text-3);
            margin-left: 5px;

        .color-swatch {

        .seq-cell {
            height: 26px;

            border: 1px solid var(--hairline);
            background: rgba(255, 255, 255, 0.02);

            padding: 0;

        }

        .seq-cell.on {
            background: var(--accent);

        }
        .seq-cell.playhead {

        .tb-dropdown {
            position: absolute;
            top: calc(var(--topbar-h) + 6px);
            left: 8px;
            min-width: 220px;

            padding: 6px;
            z-index: var(--z-context);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            pointer-events: none;
            transition: opacity var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
        }
        .tb-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .tb-dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            color: var(--text-1);
            cursor: default;
        }
        .tb-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .tb-dropdown-item .kbd {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-3);
        }
        .tb-dropdown-sep {
            height: 1px;
            background: var(--hairline);
            margin: 5px 2px;

        /* ---------- Dock ---------- */
        .dock {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: var(--z-dock);
            display: flex;
            align-items: flex-end;
            height: var(--dock-h);
            padding: 0 12px;
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
        }
        .dock-inner {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 100%;
            padding-bottom: 9px;
        }
        .dock-icon {
            --mag: 1;
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: var(--r-md);
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            background: linear-gradient(160deg, var(--ink-4), var(--ink-3));
            border: 1px solid var(--glass-border-soft);
            transform: scale(var(--mag)) translateY(calc((var(--mag) - 1) * -16px));
            transition: transform 90ms var(--ease-out-expo), box-shadow var(--dur-fast);
            flex: none;
        }
        .dock-icon:hover {
            box-shadow: var(--shadow-md);
        }
        .dock-icon .dot {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-3);
            transition: background var(--dur-fast);
        }
        .dock-icon.running .dot {
            background: var(--accent-2);
            box-shadow: 0 0 5px var(--accent-2);
        }
        .dock-icon.focused {
            box-shadow: var(--glow-brass);
        }
        .dock-sep {
            width: 1px;
            align-self: stretch;
            margin-bottom: 9px;
            background: var(--hairline-strong);
            flex: none;
        }
        .dock-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            padding: 5px 10px;
            border-radius: 7px;
            font-size: var(--fs-xs);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur-fast), transform var(--dur-fast);
            box-shadow: var(--shadow-md);
        }
        .dock-icon:hover .dock-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---------- Window Layer & Chrome ---------- */
        .window-layer {
            position: absolute;
            inset: 0;
            top: var(--topbar-h);
            z-index: var(--z-windows);
            pointer-events: none;
        }
        .titan-window {
            position: absolute;
            display: flex;
            flex-direction: column;
            border-radius: var(--r-lg);
            overflow: hidden;
            background: var(--glass-bg-2);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            border: 1px solid var(--glass-border-soft);
            box-shadow: var(--shadow-window);
            pointer-events: auto;
            transition: box-shadow var(--dur-fast), border-color var(--dur-fast);
        }
        .titan-window.focused {
            border-color: var(--glass-border);
        }
        .titan-window.dragging,
        .titan-window.resizing {
            transition: none !important;
            user-select: none;
        }
        .titan-window.win-anim-in {
            animation: win-in var(--dur-med) var(--ease-out-expo);
        }
        .titan-window.win-anim-close {
            animation: win-out var(--dur-fast) var(--ease-standard) forwards;
        }
        .titan-window.win-anim-min {
            animation: win-min var(--dur-med) var(--ease-standard) forwards;
        }
        .titan-window.win-anim-restore {
            animation: win-restore var(--dur-med) var(--ease-out-expo);
        }
        @keyframes win-in {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        @keyframes win-out {
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }
        @keyframes win-min {
            to {
                opacity: 0;
                transform: scale(0.15) translateY(60vh);
            }
        }
        @keyframes win-restore {
            from {
                opacity: 0;
                transform: scale(0.15) translateY(60vh);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .win-titlebar {
            display: flex;
            align-items: center;
            height: 38px;
            padding: 0 10px;
            gap: 10px;
            flex: none;
            cursor: default;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
            border-bottom: 1px solid var(--hairline);

        .win-traffic {

        .win-btn {

            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: default;
            background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--btn-c) 55%, white 10%), var(--btn-c));
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
        }
        .win-btn::after {
            content: '';

            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: border-color var(--dur-fast);

        .win-btn:hover::after {

        }
        .win-btn.win-close {
            --btn-c: var(--rose);
        }
        .win-btn.win-min {
            --btn-c: var(--amber);
        }
        .win-btn.win-max {
            --btn-c: var(--cyan);
        }
        .win-icon {
            width: 16px;
            height: 16px;

            flex: none;

        }
        .win-title {

        }
        .win-title-meta {

        .win-body {

        .resize-handle {
            position: absolute;

        }
        .rh-n {
            top: -4px;
            left: 8px;

        }
        .rh-s {
            bottom: -4px;

            right: 8px;
            height: 8px;
            cursor: ns-resize;
        }
        .rh-e {
            right: -4px;

        }
        .rh-w {

        }
        .rh-ne {

        .rh-nw {
            top: -5px;
            left: -5px;
            width: 14px;

            cursor: nwse-resize;
        }
        .rh-se {
            bottom: -5px;
            right: -5px;
            width: 14px;
            height: 14px;

        }
        .rh-sw {
            bottom: -5px;

        .snap-preview {
