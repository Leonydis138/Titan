            color: var(--text-3);
            margin-left: auto;
            padding-left: 8px;
            flex: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            padding: 40px;
            text-align: center;
            color: var(--text-3);
        }
        .empty-state svg {
            color: var(--text-3);
            opacity: 0.5;
        }
        .empty-state .es-title {
            color: var(--text-2);
            font-size: var(--fs-md);
        }
        .empty-state .es-sub {
            font-size: var(--fs-sm);
            max-width: 280px;
        }

        .tooltip-native {
            position: relative;
        }
        .section-label {
            font-size: var(--fs-2xs);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-3);
            font-family: var(--font-mono);
            padding: 10px 12px 6px;
        }
        .divider {
            height: 1px;
            background: var(--hairline);
            margin: 6px 0;
            flex: none;
        }
        .kbd-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-3);
            border: 1px solid var(--hairline-strong);
            border-radius: 4px;
            padding: 1px 5px;
        }

        /* ---------- Command Palette ---------- */
        .command-palette-overlay {
            position: fixed;
            inset: 0;
            z-index: var(--z-palette);
            background: rgba(4, 6, 12, 0.5);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 12vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--dur-fast), visibility var(--dur-fast);
        }
        .command-palette-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .command-palette-panel {
            width: min(600px, 88vw);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transform: translateY(-14px) scale(0.98);
            transition: transform var(--dur-med) var(--ease-out-expo);
        }
        .command-palette-overlay.open .command-palette-panel {
            transform: none;
        }
        .cp-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--hairline);
        }
        .cp-input-row svg {
            color: var(--text-3);
            flex: none;
        }
        #cp-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-1);
            font-size: var(--fs-lg);
        }
        #cp-input::placeholder {
            color: var(--text-3);
        }
        .cp-results {
            max-height: 52vh;
            overflow-y: auto;
            padding: 6px;
        }
        .cp-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 10px;
            border-radius: var(--r-sm);
            cursor: default;
        }
        .cp-item .cp-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--ink-4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex: none;
        }
        .cp-item .cp-text {
            flex: 1;
            min-width: 0;
        }
        .cp-item .cp-title {
            font-size: var(--fs-sm);
            color: var(--text-1);
        }
        .cp-item .cp-sub {
            font-size: var(--fs-2xs);
            color: var(--text-3);
        }
        .cp-item.active {
            background: rgba(201, 164, 104, 0.14);
        }
        .cp-item.active .cp-icon {
            color: var(--brass-bright);
        }
        .cp-footer {
            display: flex;
            gap: 14px;
            padding: 9px 16px;
            border-top: 1px solid var(--hairline);
            font-size: var(--fs-2xs);
            color: var(--text-3);
        }
        .cp-footer span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ---------- Window overview ---------- */
        .window-overview-overlay {
            position: fixed;
            inset: 0;
            z-index: var(--z-overview);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7vh 5vw;
            background: rgba(4, 6, 12, 0.58);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--dur-fast), visibility var(--dur-fast);
        }
        .window-overview-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .window-overview-panel {
            width: min(980px, 90vw);
            max-height: 78vh;
            padding: 18px;
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg);
            overflow: auto;
            transform: translateY(12px) scale(0.98);
            transition: transform var(--dur-med) var(--ease-out-expo);
        }
        .window-overview-overlay.open .window-overview-panel {
            transform: none;
        }
        .window-overview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .window-overview-title {
            color: var(--text-1);
            font-size: var(--fs-lg);
            font-weight: 600;
        }
        .window-overview-hint {
            color: var(--text-3);
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
        }
        .window-overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        .window-overview-card {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.035);
            color: var(--text-1);
            text-align: left;
            cursor: default;
            transition: background var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast);
        }
        .window-overview-card:hover,
        .window-overview-card:focus-visible {
            background: rgba(201, 164, 104, 0.12);
            border-color: var(--glass-border);
            outline: none;
            transform: translateY(-1px);
        }
        .window-overview-card.focused {
            border-color: rgba(87, 217, 196, 0.42);
            box-shadow: 0 0 0 1px rgba(87, 217, 196, 0.12);
        }
        .window-overview-card.minimized {
            opacity: 0.62;
        }
        .window-overview-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex: none;
            border-radius: var(--r-sm);
            background: var(--ink-4);
            color: var(--accent);
        }
        .window-overview-copy {
            min-width: 0;
            flex: 1;
        }
        .window-overview-card-title {
            overflow: hidden;
            color: var(--text-1);
            font-size: var(--fs-sm);
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-overview-card-meta {
            margin-top: 3px;
            color: var(--text-3);
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
        }
        .dock-icon:focus-visible,
        .dock-home:focus-visible,
        .tb-btn:focus-visible,
        .win-btn:focus-visible,
        .cp-item:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 3px;
        }

        /* ---------- Context Menu ---------- */
        .context-menu {
            position: fixed;
            z-index: var(--z-context);
            min-width: 200px;
            border-radius: var(--r-md);
            box-shadow: var(--shadow-lg);
            padding: 6px;
            opacity: 0;
            transform: scale(0.97);
            transition: opacity var(--dur-fast), transform var(--dur-fast);
        }
        .context-menu.open {
            opacity: 1;
            transform: none;
        }
        .ctx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: var(--fs-sm);
            cursor: default;
        }
        .ctx-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .ctx-item.danger {
            color: var(--rose);
        }
        .ctx-item.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .ctx-sep {
            height: 1px;
            background: var(--hairline);
            margin: 5px 4px;
        }
        .ctx-item .kbd-tag {
            flex: none;
        }

        /* ---------- Notifications ---------- */
        .notification-stack {
            position: fixed;
            top: calc(var(--topbar-h) + 12px);
            right: 14px;
            z-index: var(--z-notify);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 320px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            border-radius: var(--r-md);
            box-shadow: var(--shadow-lg);
            padding: 12px 13px;
            display: flex;
            gap: 10px;
            border-left: 3px solid var(--accent-2);
            animation: toast-in var(--dur-med) var(--ease-out-expo);
        }
        .toast.closing {
            animation: toast-out var(--dur-fast) var(--ease-standard) forwards;
        }
        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(24px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        @keyframes toast-out {
            to {
                opacity: 0;
                transform: translateX(24px) scale(0.96);
            }
        }
        .toast.type-success {
            border-left-color: var(--cyan);
        }
        .toast.type-warning {
            border-left-color: var(--amber);
        }
        .toast.type-error {
            border-left-color: var(--rose);
        }
        .toast.type-info {
            border-left-color: var(--violet);
        }
        .toast .toast-icon {
            flex: none;
            width: 17px;
            height: 17px;
            margin-top: 1px;
        }
        .toast .toast-title {
            font-size: var(--fs-sm);
            color: var(--text-1);
            font-weight: 500;
        }
        .toast .toast-msg {
            font-size: var(--fs-xs);
            color: var(--text-2);
            margin-top: 2px;
            line-height: 1.4;
        }
        .toast .toast-close {
            margin-left: auto;
            flex: none;
            color: var(--text-3);
            cursor: default;
        }
        .toast .toast-close:hover {
            color: var(--text-1);
        }

        /* ---------- Global tooltip ---------- */
        .global-tooltip {
            position: fixed;
            z-index: var(--z-tooltip);
            padding: 5px 9px;
            border-radius: 7px;
            font-size: var(--fs-2xs);
            box-shadow: var(--shadow-md);
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur-fast);
            max-width: 240px;
        }
        .global-tooltip.visible {
            opacity: 1;
        }

        /* ---------- Misc animations ---------- */
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .anim-fade {
            animation: fade-in var(--dur-med) var(--ease-standard);
        }
        .anim-rise {
            animation: rise-in var(--dur-med) var(--ease-out-expo);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 860px) {
            .desktop-icons {
                padding: var(--sp-3);
                grid-template-rows: repeat(auto-fill, 84px);
            }
            .dock {
                bottom: 8px;
                padding: 0 8px;
            }
            .dock-icon {
                width: 38px;
                height: 38px;
            }
            .tb-stat {
                display: none;
            }
        }

        /* ================================================================
           COMPACT LAYOUT — [data-layout="mobile"]
        ================================================================ */
        .dock-home {
            display: none;
            flex: none;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-right: 4px;
            border-radius: var(--r-md);
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            cursor: default;
        }
        .dock-home.disabled {
            color: var(--text-3);
            opacity: 0.5;
        }
        [data-layout="mobile"] {
            --topbar-h: 46px;
        }
        [data-layout="mobile"] .window-layer {
            bottom: calc(var(--mobile-dock-h) + env(safe-area-inset-bottom));
        }
        [data-layout="mobile"] .desktop-icons {
            bottom: calc(var(--mobile-dock-h) + env(safe-area-inset-bottom));
            grid-auto-flow: row;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            grid-template-rows: none;
            row-gap: var(--sp-2);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: var(--sp-3) var(--sp-2) var(--sp-4);
        }
        [data-layout="mobile"] .tb-stat,
        [data-layout="mobile"] .tb-logo span {
            display: none;
        }
        [data-layout="mobile"] .dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(var(--mobile-dock-h) + env(safe-area-inset-bottom));
            transform: none;
            border-radius: 0;
            padding: 0 10px env(safe-area-inset-bottom);
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
        }
        [data-layout="mobile"] .dock-home {
            display: flex;
        }
        [data-layout="mobile"] .dock-inner {
            flex: 1;
            height: 100%;
            padding-bottom: 0;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        [data-layout="mobile"] .dock-inner::-webkit-scrollbar {
            display: none;
        }
        [data-layout="mobile"] .dock-icon {
            width: 44px;
            height: 44px;
            transform: none !important;
            touch-action: manipulation;
        }
        [data-layout="mobile"] .dock-tooltip {
            display: none;
        }
        [data-layout="mobile"] .titan-window {
            border-radius: 0;
            border-width: 0 0 1px;
            box-shadow: none;
        }
        [data-layout="mobile"] .win-titlebar {
            height: 46px;
            cursor: default;
        }
        [data-layout="mobile"] .win-max {
            display: none;
        }
        [data-layout="mobile"] .resize-handle {
            display: none;
        }
        [data-layout="mobile"] .snap-preview {
            display: none;
        }
        [data-layout="mobile"] .notification-stack {
            left: 10px;
            right: 10px;
            width: auto;
        }
        [data-layout="mobile"] .command-palette-overlay {
            padding-top: 8vh;
        }
        [data-layout="mobile"] .window-overview-overlay {
            align-items: flex-start;
            padding: 8vh 12px 80px;
        }
        [data-layout="mobile"] .window-overview-panel {
            width: 100%;
            max-height: 82vh;
            padding: 14px;
        }
        [data-layout="mobile"] .window-overview-grid {
            grid-template-columns: 1fr;
        }
        [data-layout="mobile"] .app-body {
            flex-direction: column;
        }
        [data-layout="mobile"] .split-side {
            width: 100% !important;
            max-height: 38vh;
            border-right: none !important;
            border-left: none !important;
            border-top: 1px solid var(--hairline);
            border-bottom: 1px solid var(--hairline);
        }
        [data-layout="mobile"] .split-main {
            min-height: 32vh;
            flex: 1 1 auto;
        }

        /* ================================================================
           CODE EDITOR APP — custom styles
        ================================================================ */
        .editor-gutter {
            flex: none;
            width: 42px;
            padding: 10px 4px;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.65;
            color: var(--text-3);
            background: rgba(0, 0, 0, 0.18);
            user-select: none;
            border-right: 1px solid var(--hairline);
            overflow: hidden;
            position: relative;
            min-height: 100%;
        }
        .editor-gutter .gutter-line {
            display: block;
            padding-right: 6px;
            transition: color var(--dur-fast);
        }
        .editor-gutter .gutter-line.active-line {
            color: var(--accent-bright);
        }
        .editor-textarea {
            flex: 1;
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.65;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-1);
            resize: none;
            tab-size: 2;
            white-space: pre;
            overflow: auto;
            min-height: 100%;
            width: 100%;
        }
        .editor-textarea::selection {
            background: rgba(87, 217, 196, 0.25);
        }
        .editor-textarea::placeholder {
            color: var(--text-3);
            font-style: italic;
        }
        .editor-wrap {
            display: flex;
            flex: 1;
            min-height: 0;
            background: rgba(0, 0, 0, 0.2);
        }
        .console-panel {
            border-top: 1px solid var(--hairline);
            flex: none;
            height: 140px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.15);
        }
        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--hairline);
            flex: none;
            font-size: var(--fs-2xs);
            color: var(--text-3);
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }
        .console-output {
            flex: 1;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-2);
            min-height: 0;
        }
        .console-output .log-line {
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .console-output .log-line .log-prefix {
            color: var(--text-3);
            margin-right: 8px;
            font-size: 10px;
        }
        .console-output .log-line.log-info {
            color: var(--text-2);
        }
        .console-output .log-line.log-error {
            color: var(--rose);
        }
        .console-output .log-line.log-success {
            color: var(--cyan-bright);
        }
        .console-output .log-line.log-warn {
            color: var(--amber);
        }
        .console-output .log-line.log-result {
            color: var(--violet-bright);
        }
        .console-output .log-line .log-value {
            font-weight: 500;
        }
        .console-output .log-line.log-undefined {
            color: var(--text-3);
            font-style: italic;
        }
        .console-empty {
            color: var(--text-3);
            font-style: italic;
            padding: 12px 0;
            font-size: 11px;
        }

        .syntax-highlight {
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.65;
            white-space: pre;
            padding: 10px 14px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            color: transparent;
            background: transparent;
            tab-size: 2;
        }
        .syntax-highlight .sh-keyword {
            color: #c792ea;
        }
        .syntax-highlight .sh-string {
            color: #c3e88d;
        }
        .syntax-highlight .sh-comment {
            color: #546e7a;
            font-style: italic;
        }
        .syntax-highlight .sh-number {
            color: #f78c6c;
        }
        .syntax-highlight .sh-function {
            color: #82aaff;
        }
        .syntax-highlight .sh-operator {
            color: #89ddff;
        }
        .syntax-highlight .sh-variable {
            color: #eeffff;
        }
        .syntax-highlight .sh-builtin {
            color: #ffcb6b;
        }
        .syntax-highlight .sh-bracket {
            color: #89ddff;
        }
        .syntax-highlight .sh-regex {
            color: #c3e88d;
        }
        .syntax-highlight .sh-constant {
            color: #f78c6c;
        }
        .syntax-highlight .sh-class {
            color: #ffcb6b;
        }
        .syntax-highlight .sh-attr {
            color: #82aaff;
        }
        .syntax-highlight .sh-tag {
            color: #f07178;
        }
        .editor-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 14px;
            border-top: 1px solid var(--hairline);
            font-family: var(--font-mono);
            font-size: var(--fs-2xs);
            color: var(--text-3);
            flex: none;
            background: rgba(0, 0, 0, 0.1);
        }
        .editor-status .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .editor-status .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-3);
        }
        .editor-status .status-dot.ok {
            background: var(--cyan);
        }
        .editor-status .status-dot.err {
            background: var(--rose);
        }

        /* ================================================================
           CALCULATOR APP — custom styles
        ================================================================ */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 12px;
            flex: 1;
        }
        .calc-btn {
            border-radius: var(--r-sm);
            border: 1px solid var(--glass-border-soft);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-1);
            font-size: var(--fs-lg);
            cursor: default;
            padding: 0;
            transition: all var(--dur-fast);
            font-weight: 500;
        }
        .calc-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .calc-btn.operator {
            color: var(--accent);
        }
        .calc-btn.equals {
            background: var(--accent);
            color: var(--text-inv);
            border-color: var(--accent);
        }
        .calc-btn.equals:hover {
            filter: brightness(1.08);
        }
        .calc-display {
            padding: 12px 14px;
            font-size: var(--fs-2xl);
            font-family: var(--font-mono);
            text-align: right;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--hairline);
            flex: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ================================================================
           TERMINAL APP — custom styles
        ================================================================ */
        .terminal-output {
            flex: 1;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-2);
            background: rgba(0, 0, 0, 0.3);
            min-height: 0;
        }
        .terminal-output .term-line {
            padding: 1px 0;
        }
        .terminal-output .term-prompt {
            color: var(--cyan);
            margin-right: 6px;
        }
        .terminal-input-wrap {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-top: 1px solid var(--hairline);
            background: rgba(0, 0, 0, 0.2);
            flex: none;
        }
        .terminal-input-wrap .term-prompt {
            color: var(--cyan);
            margin-right: 8px;
            font-family: var(--font-mono);
            font-size: 13px;
            flex: none;
        }
        .terminal-input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-1);
            font-family: var(--font-mono);
            font-size: 13px;
        }

        /* ================================================================
           WHITEBOARD APP — custom styles
        ================================================================ */
        .whiteboard-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: rgba(0, 0, 0, 0.2);
            cursor: crosshair;
        }

        /* ================================================================
           TO-DO APP — custom styles
        ================================================================ */
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--r-sm);
            border-bottom: 1px solid var(--hairline);
            cursor: default;
            transition: background var(--dur-fast);
        }
        .todo-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .todo-item .todo-check {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid var(--text-3);
            flex: none;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--dur-fast);
        }
        .todo-item .todo-check.done {
            background: var(--accent-2);
            border-color: var(--accent-2);
            color: #04140f;
        }
        .todo-item .todo-text {
            flex: 1;
            font-size: var(--fs-sm);
            color: var(--text-1);
        }
        .todo-item .todo-text.done {
            text-decoration: line-through;
            color: var(--text-3);
        }
        .todo-item .todo-delete {
            color: var(--text-3);
            cursor: default;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all var(--dur-fast);
        }
        .todo-item .todo-delete:hover {
            color: var(--rose);
            background: rgba(224, 112, 138, 0.15);
        }

        /* ================================================================
           FILE MANAGER APP — custom styles
        ================================================================ */
        .file-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: var(--r-sm);
            cursor: default;
            border-bottom: 1px solid var(--hairline);
            transition: background var(--dur-fast);
        }
        .file-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .file-row .file-icon {
            color: var(--accent);
            flex: none;
        }
        .file-row .file-name {
            flex: 1;
            font-size: var(--fs-sm);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-row .file-actions {
            display: flex;
            gap: 4px;
            flex: none;
        }
        .file-row .file-actions button {
            background: transparent;
            border: none;
            color: var(--text-3);
            cursor: default;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all var(--dur-fast);
        }
        .file-row .file-actions button:hover {
            color: var(--text-1);
            background: rgba(255, 255, 255, 0.06);
        }
        .file-row .file-actions button.danger:hover {
            color: var(--rose);
            background: rgba(224, 112, 138, 0.15);
        }

        /* ================================================================
           NOTES APP — custom styles
        ================================================================ */
        .note-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: var(--r-sm);
            cursor: default;
            border-bottom: 1px solid var(--hairline);
            transition: background var(--dur-fast);
        }
        .note-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .note-item .note-icon {
            color: var(--accent-2);
            flex: none;
        }
        .note-item .note-title {
            flex: 1;
            font-size: var(--fs-sm);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .note-item .note-actions {
            display: flex;
            gap: 4px;
            flex: none;
        }
        .note-item .note-actions button {
            background: transparent;
            border: none;
            color: var(--text-3);
            cursor: default;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all var(--dur-fast);
        }
        .note-item .note-actions button:hover {
            color: var(--text-1);
            background: rgba(255, 255, 255, 0.06);
        }
        .note-item .note-actions button.danger:hover {
            color: var(--rose);
            background: rgba(224, 112, 138, 0.15);
        }

        /* ================================================================
           COLOR PICKER APP — custom styles
        ================================================================ */
        .color-picker-wrap {
            display: flex;
            flex: 1;
            gap: 16px;
            padding: 16px;
            min-height: 0;
        }
        .color-picker-wrap .hue-canvas {
            flex: 1;
            min-width: 0;
            border-radius: var(--r-sm);
            cursor: crosshair;
        }
        .color-picker-wrap .info-panel {
            width: 180px;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .color-picker-wrap .info-panel .color-preview {
            width: 100%;
            height: 80px;
            border-radius: var(--r-sm);
            border: 1px solid var(--hairline-strong);
        }
        .color-picker-wrap .info-panel .color-values {
            font-family: var(--font-mono);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* ================================================================
           MUSIC PLAYER APP — custom styles
        ================================================================ */
        .music-player-wrap {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 16px;
            gap: 12px;
        }
        .music-player-wrap .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .music-player-wrap .player-controls button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--glass-border-soft);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-1);
            font-size: 18px;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--dur-fast);
        }
        .music-player-wrap .player-controls button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .music-player-wrap .player-controls button.playing {
            background: var(--accent);
            color: var(--text-inv);
            border-color: var(--accent);
        }
        .music-player-wrap .player-controls .volume-slider {
            width: 80px;
        }
        .music-player-wrap .playlist {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .music-player-wrap .playlist .song-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: var(--r-sm);
            cursor: default;
            border-bottom: 1px solid var(--hairline);
            transition: background var(--dur-fast);
        }
        .music-player-wrap .playlist .song-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .music-player-wrap .playlist .song-item.playing {
            background: rgba(87, 217, 196, 0.1);
            color: var(--accent-2);
        }
        .music-player-wrap .playlist .song-item .song-name {
            flex: 1;
            font-size: var(--fs-sm);
        }

        /* ================================================================
           POMODORO TIMER APP
        ================================================================ */
        .pomodoro-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 28px; padding: 24px; }
        .pomodoro-ring { position: relative; width: 200px; height: 200px; }
        .pomodoro-ring canvas { position: absolute; inset: 0; }
        .pomodoro-time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pomodoro-time .pom-digits { font-family: var(--font-mono); font-size: 38px; font-weight: 600; color: var(--text-1); letter-spacing: 2px; }
        .pomodoro-time .pom-mode { font-size: var(--fs-xs); color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
        .pom-sessions { display: flex; gap: 8px; }
        .pom-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hairline-strong); transition: background var(--dur-med); }
        .pom-dot.done { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
        .pom-controls { display: flex; gap: 12px; }

        /* ================================================================
           WORLD CLOCK APP
        ================================================================ */
        .world-clock-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .world-clock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 20px; overflow-y: auto; flex: 1; }
        .clock-card { background: var(--ink-3); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: default; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
        .clock-card:hover { border-color: var(--glass-border); box-shadow: var(--shadow-sm); }
        .clock-city { font-size: var(--fs-sm); font-weight: 600; color: var(--text-1); }
        .clock-zone { font-size: var(--fs-2xs); color: var(--text-3); }
        .clock-time { font-family: var(--font-mono); font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
        .clock-date { font-size: var(--fs-2xs); color: var(--text-2); }
        .clock-day-bar { height: 3px; border-radius: 2px; background: var(--hairline); margin-top: 4px; overflow: hidden; }
        .clock-day-fill { height: 100%; background: var(--accent-2); border-radius: 2px; transition: width 1s linear; }

        /* ================================================================
           MARKDOWN EDITOR APP
        ================================================================ */
        .md-editor-wrap { display: flex; flex: 1; overflow: hidden; }
        .md-editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .md-editor-pane + .md-editor-pane { border-left: 1px solid var(--hairline); }
        .md-pane-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-xs); color: var(--text-3); flex: none; }
        .md-textarea { flex: 1; background: transparent; border: none; outline: none; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; color: var(--text-1); resize: none; overflow-y: auto; }
        .md-preview { flex: 1; padding: 16px 20px; overflow-y: auto; font-size: 13px; line-height: 1.75; color: var(--text-2); }
        .md-preview h1, .md-preview h2, .md-preview h3 { color: var(--text-1); margin: 16px 0 8px; font-weight: 600; }
        .md-preview h1 { font-size: 22px; border-bottom: 1px solid var(--hairline); padding-bottom: 8px; }
        .md-preview h2 { font-size: 17px; }
        .md-preview h3 { font-size: 14px; }
        .md-preview p { margin: 0 0 12px; }
        .md-preview code { font-family: var(--font-mono); font-size: 11.5px; background: var(--ink-4); padding: 2px 5px; border-radius: 4px; color: var(--accent-2); }
        .md-preview pre { background: var(--ink-4); border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
        .md-preview pre code { background: none; padding: 0; }
        .md-preview blockquote { border-left: 3px solid var(--accent); margin: 0 0 12px; padding: 4px 14px; color: var(--text-3); font-style: italic; }
        .md-preview ul, .md-preview ol { padding-left: 20px; margin: 0 0 12px; }
        .md-preview li { margin-bottom: 4px; }
        .md-preview hr { border: none; border-top: 1px solid var(--hairline); margin: 20px 0; }
        .md-preview a { color: var(--accent-2); text-decoration: underline; }
        .md-preview strong { color: var(--text-1); font-weight: 600; }
        .md-preview em { font-style: italic; }
        .md-preview table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; }
        .md-preview th { background: var(--ink-4); border: 1px solid var(--hairline); padding: 6px 10px; text-align: left; color: var(--text-1); font-weight: 600; }
        .md-preview td { border: 1px solid var(--hairline); padding: 6px 10px; }
        .md-word-count { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-3); padding: 0 4px; }

        /* ================================================================
           AI CHAT (COSMOS) APP
        ================================================================ */
        .chat-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .chat-bubble { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
        .chat-bubble.user { align-self: flex-end; align-items: flex-end; }
        .chat-bubble.ai { align-self: flex-start; }
        .chat-bubble-content { padding: 10px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); line-height: 1.6; }
        .chat-bubble.user .chat-bubble-content { background: var(--accent); color: var(--text-inv); border-bottom-right-radius: 4px; font-weight: 500; }
        .chat-bubble.ai .chat-bubble-content { background: var(--ink-3); color: var(--text-1); border: 1px solid var(--hairline); border-bottom-left-radius: 4px; }
        .chat-bubble-meta { font-size: var(--fs-2xs); color: var(--text-3); padding: 0 4px; }
        .chat-input-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--hairline); }
        .chat-input { flex: 1; background: var(--ink-3); border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--fs-sm); color: var(--text-1); outline: none; font-family: var(--font-sans); resize: none; min-height: 36px; max-height: 120px; }
        .chat-input:focus { border-color: var(--glass-border); }
        .chat-typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
        .chat-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: typing-dot 1.2s infinite ease-in-out; }
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-dot { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
        .chat-ai-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
        .chat-ai-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-inv); flex: none; }

        /* ================================================================
           WEATHER APP
        ================================================================ */
        .weather-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .weather-hero { display: flex; align-items: center; justify-content: space-between; padding: 24px 28px; border-bottom: 1px solid var(--hairline); }
        .weather-temp-big { font-family: var(--font-mono); font-size: 72px; font-weight: 300; color: var(--text-1); line-height: 1; }
        .weather-temp-big sup { font-size: 28px; vertical-align: top; margin-top: 10px; color: var(--text-3); }
        .weather-desc { font-size: var(--fs-md); color: var(--text-2); margin-top: 6px; }
        .weather-city-name { font-size: var(--fs-2xl); font-weight: 600; color: var(--text-1); }
        .weather-icon-large { font-size: 80px; line-height: 1; }
        .weather-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 20px; flex: 1; }
        .weather-detail-card { background: var(--ink-3); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 14px; }
        .weather-detail-label { font-size: var(--fs-2xs); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
        .weather-detail-value { font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: 600; color: var(--text-1); }
        .weather-detail-unit { font-size: var(--fs-xs); color: var(--text-3); margin-left: 2px; }
        .weather-forecast { display: flex; gap: 10px; padding: 0 20px 20px; overflow-x: auto; }
        .weather-forecast-day { background: var(--ink-3); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 80px; }
        .weather-forecast-day .day-name { font-size: var(--fs-2xs); color: var(--text-3); text-transform: uppercase; }
        .weather-forecast-day .day-icon { font-size: 24px; }
        .weather-forecast-day .day-temp { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; color: var(--text-1); }
        .weather-forecast-day.active { border-color: var(--glass-border); background: var(--ink-4); }

        /* ================================================================
           ENHANCED COLOR PICKER
        ================================================================ */
        .color-harmonies { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .harmony-swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--hairline); cursor: default; transition: transform var(--dur-fast); }
        .harmony-swatch:hover { transform: scale(1.15); }
        .color-copy-row { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .color-copy-item { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; }
        .color-copy-label { color: var(--text-3); width: 36px; flex: none; }
        .color-copy-value { color: var(--text-2); flex: 1; background: var(--ink-4); padding: 3px 6px; border-radius: 4px; }
        .color-copy-btn { padding: 2px 8px; font-size: 10px; border-radius: 4px; background: var(--ink-4); border: 1px solid var(--hairline); color: var(--text-2); cursor: default; }
        .color-copy-btn:hover { background: var(--ink-3); color: var(--text-1); }
        .color-history-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
        .color-hist-dot { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--hairline); cursor: default; }

        /* ================================================================
           ENHANCED WHITEBOARD APP
        ================================================================ */
        .wb-toolpanel { display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; border-right: 1px solid var(--hairline); background: var(--ink-3); flex: none; }
        .wb-tool { width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: default; font-size: 13px; transition: all var(--dur-fast); }
        .wb-tool:hover { background: rgba(255,255,255,0.06); color: var(--text-1); }
        .wb-tool.active { background: rgba(201,164,104,0.15); border-color: var(--glass-border); color: var(--accent); }
        .wb-tool-sep { height: 1px; background: var(--hairline); margin: 4px 4px; }

        /* ================================================================
           ENHANCED FILE MANAGER
        ================================================================ */
        .fm-sidebar { width: 160px; border-right: 1px solid var(--hairline); padding: 8px; overflow-y: auto; flex: none; display: flex; flex-direction: column; gap: 2px; }
        .fm-sidebar-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text-2); cursor: default; transition: background var(--dur-fast), color var(--dur-fast); }
        .fm-sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--text-1); }
        .fm-sidebar-item.active { background: rgba(201,164,104,0.12); color: var(--accent); }
        .fm-breadcrumb { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--hairline); font-size: var(--fs-xs); color: var(--text-3); flex: none; }
        .fm-breadcrumb span { color: var(--text-2); cursor: default; }
        .fm-breadcrumb span:hover { color: var(--text-1); }
        .fm-breadcrumb .sep { color: var(--text-3); }
        .fm-file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; padding: 12px; overflow-y: auto; align-content: start; }
        .fm-file-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-md); border: 1px solid transparent; cursor: default; text-align: center; transition: all var(--dur-fast); }
        .fm-file-item:hover { background: rgba(255,255,255,0.05); border-color: var(--hairline); }
        .fm-file-item.selected { background: rgba(87,217,196,0.08); border-color: rgba(87,217,196,0.3); }
        .fm-file-icon { font-size: 32px; line-height: 1; }
        .fm-file-name { font-size: 10.5px; color: var(--text-1); word-break: break-word; line-height: 1.3; }
        .fm-file-size { font-size: 9px; color: var(--text-3); font-family: var(--font-mono); }
        .fm-preview { width: 220px; border-left: 1px solid var(--hairline); padding: 16px; overflow-y: auto; flex: none; display: flex; flex-direction: column; gap: 10px; }
        .fm-preview-icon { font-size: 52px; text-align: center; }

    <script>
        // Global error handler for boot issues
        (function bootErrorHandler() {
            var errorEl = document.getElementById('boot-error');
            window.addEventListener('error', function(e) {
                errorEl.textContent = 'Boot error: ' + (e.message || e.error || 'Unknown error');
                errorEl.classList.add('visible');
                console.error('TITAN Ω boot error:', e);
            });
            window.addEventListener('unhandledrejection', function(e) {
                errorEl.textContent = 'Boot error (promise): ' + (e.reason || 'Unknown');
                errorEl.classList.add('visible');
                console.error('Unhandled rejection:', e.reason);
            });
        })();

        "use strict";

        /* ==== js/core/config.js ==== */
        "use strict";
        /******************************************************************
         *
         *   TITAN Ω  —  SINGLE-FILE COMPUTATIONAL WORKSPACE
         *   ------------------------------------------------------------
         *   A desktop-class operating environment, AI workspace,
         *   architecture atlas, knowledge graph, 3D visualization suite
         *   and simulation laboratory, built entirely with vanilla
         *   JavaScript, CSS and Canvas — zero external dependencies,
         *   zero network calls, zero build step.
         *
         *   BUILD STATUS  (see header of each module for detail)
         *   ------------------------------------------------------------
         *   ✅ Core Engine      : Config, Utils, EventBus, StateManager, Logger
         *   ✅ Shell            : WindowManager, Desktop, Dock, TopBar
         *   ✅ Navigation       : CommandPalette, ContextMenu, Notifications
         *   ✅ Apps             : Dashboard, Architecture Atlas, Knowledge Graph,
         *                         3D Visualization Hub (Brain/Galaxy/Universe/Network),
         *                         Simulation Lab, Memory System, Timeline Explorer,
         *                         Analytics, Plugin Framework, Dev Console,
         *                         Settings, Help, Code Editor,
         *                         Calculator, Terminal, Whiteboard, To-Do,
         *                         System Monitor, File Manager,
         *                         Notes, Color Picker, Scientific Calculator,
         *                         Music Player
         *   🔜 Roadmap          : see Help > Roadmap for the list of planned
         *                         deepenings for the next pass.
         *
         *   INTERNAL MODULE INDEX (search for the bracketed tag to jump)
         *   ------------------------------------------------------------
         *   [CONFIG]  [UTILS]  [EVENTBUS]  [STATE]  [LOGGER]
         *   [NOTIFY]  [CONTEXTMENU]  [WINDOWMGR]  [DESKTOP]  [DOCK]
         *   [TOPBAR]  [PALETTE]  [APPREGISTRY]  [RENDERER3D]
         *   [APP:DASHBOARD]  [APP:ATLAS]  [APP:GRAPH]  [APP:VIZ3D]
         *   [APP:SIMLAB]  [APP:MEMORY]  [APP:TIMELINE]  [APP:ANALYTICS]
         *   [APP:PLUGINS]  [APP:DEVCONSOLE]  [APP:SETTINGS]  [APP:HELP]
         *   [APP:CODEEDITOR]  [APP:CALCULATOR]  [APP:TERMINAL]
         *   [APP:WHITEBOARD]  [APP:TODO]  [APP:SYSTEMMONITOR]
         *   [APP:FILEMANAGER]  [APP:NOTES]  [APP:COLORPICKER]
         *   [APP:MUSICPLAYER]
         *   [BOOT]  [INIT]
         *
         ******************************************************************/



        /******************************************************************
         * [CONFIG] — Global configuration & feature flags
         ******************************************************************/
        const TITAN_CONFIG = Object.freeze({
            version: "0.3.2-omega",
            codename: "Observatory",
            buildDate: "2026-07-21",
            author: "Juan louw Greyling",
            email: "juanlouw.greyling@gmail.com",
            defaultTheme: "midnight",
            themes: ["midnight", "aurora", "solar", "obsidian", "neon", "matrix", "forest"],
            wallpaperStyles: ["nebula", "grid-field", "aurora", "constellation", "matrix-rain", "plasma", "geometric"],
            bootSteps: [
                "Initializing core systems…",
                "Calibrating instrumentation…",
                "Mounting window manager…",
                "Charting architecture atlas…",
                "Weaving knowledge graph…",
                "Warming cognition regions…",
                "Synchronizing simulation clock…",
                "Loading applications…",
                "Establishing presence channels…",
                "Finalizing workspace…",
                "Ready."
            ],
            bootDuration: 3200,
            window: {
                defaultMinWidth: 360,
                defaultMinHeight: 240,
                cascadeOffset: 28,
                snapThreshold: 18
            },
            dock: {
                magnifyRadius: 90,
                magnifyMax: 1.55
            },
            palette: { maxResults: 9 },
            notifications: { defaultDuration: 4200, maxVisible: 5 },
            performance: {
                fpsSampleSize: 40,
                reduceMotionDefault: false
            },
            storage: {
                key: "titan_omega_state",
                autoSaveInterval: 5000
            }
        });



        /* ==== js/core/utils.js ==== */
        "use strict";
        /******************************************************************
         * [UTILS] — Shared, dependency-free utility belt
         ******************************************************************/
        const Utils = (() => {
            let _uid = 0;

            /** Monotonically increasing unique id, optionally namespaced. */
            function uid(prefix = "id") { return `${prefix}_${(++_uid).toString(36)}_${Date.now().toString(36)}`; }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function lerp(a, b, t) { return a + (b - a) * t; }
            function mapRange(v, inMin, inMax, outMin, outMax) {
                if (inMax === inMin) return outMin;
                return outMin + ((v - inMin) * (outMax - outMin)) / (inMax - inMin);
            }

            /** Deterministic seeded PRNG (mulberry32) — same seed -> same sequence. */
            function seededRandom(seed) {
                let a = seed >>> 0;
                return function() {
                    a |= 0;
                    a = (a + 0x6D2B79F5) | 0;
                    let t = Math.imul(a ^ (a >>> 15), 1 | a);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function hashCode(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
                return Math.abs(h);
            }

            function hashToHue(str) { return hashCode(str) % 360; }

            function pick(arr, rnd = Math.random) { return arr[Math.floor(rnd() * arr.length)]; }
            function pickN(arr, n, rnd = Math.random) {
                const copy = arr.slice();
                const out = [];
                while (copy.length && out.length < n) { out.push(copy.splice(Math.floor(rnd() * copy.length), 1)[0]); }
                return out;
            }

            function debounce(fn, wait = 150) {
                let t;
                return function(...args) { clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, args), wait); };
            }
            function throttle(fn, wait = 100) {
                let last = 0,
                    timer = null;
                return function(...args) {
                    const now = performance.now();
                    if (now - last >= wait) { last = now;
                        fn.apply(this, args); } else { clearTimeout(timer);
                        timer = setTimeout(() => { last = performance.now();
                            fn.apply(this, args); }, wait - (now - last)); }
                };
            }

            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
                    "'": "&#39;" } [c]));
            }

            /** Safe DOM builder. Text children are set via textContent (XSS-safe). */
            function el(tag, attrs = {}, children = []) {
                const node = document.createElement(tag);
                for (const [k, v] of Object.entries(attrs || {})) {
                    if (v == null || v === false) continue;
                    if (k === "class") node.className = v;
                    else if (k === "html") node.innerHTML = v; // explicit opt-in only
                    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
                    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
                    else if (k === "dataset" && typeof v === "object") Object.assign(node.dataset, v);
                    else node.setAttribute(k, v);
                }
                const kids = Array.isArray(children) ? children : [children];
                for (const kid of kids) {
                    if (kid == null || kid === false) continue;
                    node.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
                }
                return node;
            }

            function fmtTime(d = new Date()) {
                return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            }
            function fmtClock24(d = new Date()) {
                const p = (n) => String(n).padStart(2, "0");
                return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            function fmtRelative(ts) {
                const diff = Date.now() - ts;
                const s = Math.floor(diff / 1000);
                if (s < 5) return "just now";
                if (s < 60) return `${s}s ago`;
                const m = Math.floor(s / 60);
                if (m < 60) return `${m}m ago`;
                const h = Math.floor(m / 60);
                if (h < 24) return `${h}h ago`;
                const dd = Math.floor(h / 24);
                return `${dd}d ago`;
            }
            function fmtNum(n) {
                if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
                if (n >= 1_000) return (n / 1_000).toFixed(1) + "k";
                return String(Math.round(n));
            }

            function hsl(h, s, l, a = 1) { return `hsla(${h.toFixed(0)}, ${s}%, ${l}%, ${a})`; }

            const EASING = {
                linear: (t) => t,
                outQuad: (t) => 1 - (1 - t) * (1 - t),
                outCubic: (t) => 1 - Math.pow(1 - t, 3),
                outExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
                inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2
            };

            /** Minimal fuzzy match scorer used by search UIs across the app. */
            function fuzzyScore(query, target) {
                if (!query) return 1;
                const q = query.toLowerCase();
                const t = target.toLowerCase();
                if (t === q) return 200;
                if (t.startsWith(q)) return 120 - (t.length - q.length) * 0.15;
                const idx = t.indexOf(q);
                if (idx !== -1) return 70 - idx * 0.5;
                let qi = 0,
                    score = 0,
                    streak = 0;
                for (let ti = 0; ti < t.length && qi < q.length; ti++) {
                    if (t[ti] === q[qi]) { qi++;
                        score += 1 + streak;
                        streak++; } else streak = 0;
                }
                return qi === q.length ? score : -1;
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(
                () => {});
                return Promise.resolve();
            }

            /**
             * Keep a canvas's backing-store size in sync with its CSS box, accounting
             * for device pixel ratio (capped at 2x to bound fill cost on 3x+ panels).
             * Calls onResize(cssWidth, cssHeight) once immediately and again on every
             * observed size change. Returns the ResizeObserver so callers can
             * .disconnect() it on teardown — this was five near-identical inline
             * copies across viz3d/simlab/graph before being pulled in here.
             */
            function observeCanvasResize(canvas, ctx, onResize) {
                function apply() {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const rect = canvas.getBoundingClientRect();
                    const w = Math.max(1, rect.width),
                        h = Math.max(1, rect.height);
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    onResize(w, h);
                }
                const ro = new ResizeObserver(apply);
                ro.observe(canvas);
                apply();
                return ro;
            }

            return {
                uid,
                clamp,
                lerp,
                mapRange,
                seededRandom,
                hashCode,
                hashToHue,
                pick,
                pickN,
                debounce,
                throttle,
                escapeHtml,
                el,
                fmtTime,
                fmtClock24,
                fmtRelative,
                fmtNum,
                hsl,
                EASING,
                fuzzyScore,
                copyToClipboard,
                observeCanvasResize
            };
        })();



        /* ==== js/core/eventbus.js ==== */
        "use strict";
        /******************************************************************
         * [EVENTBUS] — Global pub/sub backbone
         * Every subsystem communicates through here, which is also what
         * powers the Timeline Explorer and Dev Console's live event feed.
         ******************************************************************/
        class EventBusClass {
            constructor() { this._listeners = new Map();
                this._wildcard = new Set();
                this._history = [];
                this._historyCap = 500; }

            on(event, handler) {
                if (!this._listeners.has(event)) this._listeners.set(event, new Set());
                this._listeners.get(event).add(handler);
                return () => this.off(event, handler);
            }
            once(event, handler) {
                const off = this.on(event, (payload) => { off();
                    handler(payload); });
                return off;
            }
            off(event, handler) { this._listeners.get(event)?.delete(handler); }

            /** Subscribe to every event (used by Timeline / Dev Console). */
            onAny(handler) { this._wildcard.add(handler); return () => this._wildcard.delete(handler); }

            emit(event, payload) {
                const record = { event, payload, ts: Date.now() };
                this._history.push(record);
                if (this._history.length > this._historyCap) this._history.shift();
                this._listeners.get(event)?.forEach((fn) => {
                    try { fn(payload); } catch (e) { console.error(`[EventBus] handler error for "${event}"`, e); }
                });
                this._wildcard.forEach((fn) => { try { fn(record); } catch (e) { /* silent */ } });
            }

            history(limit = 100) { return this._history.slice(-limit); }
        }
        const EventBus = new EventBusClass();



        /* ==== js/core/state.js ==== */
        "use strict";
        /******************************************************************
         * [STATE] — Reactive in-memory state store with localStorage persistence
         ******************************************************************/
        class StateManagerClass {
            constructor() {
                this._state = {
                    theme: TITAN_CONFIG.defaultTheme,
                    reduceMotion: false,
                    wallpaperStyle: "nebula",
                    windowOpacity: 1,
                    openWindows: [],
                    focusedWindow: null,
                    bootedAt: null,
                    memories: [],
                    pluginsEnabled: {},
                    codeSnippets: [],
                    customGraphs: [],
                    layoutMode: "auto",
                    _windowPositions: {},
                    _openAppIds: [],
                    _lastSaved: null,
                    _version: TITAN_CONFIG.version,
                    firstBoot: true,
                    todos2: [],
                    notes3: [],
                    files: [],
                    mdEditorContent: "",
                    chatMessages: []
                };
                this._subs = new Map();
                this._saveTimer = null;
                this._loadFromStorage();
                this._autoSaveTimer = setInterval(() => this._saveNow(), TITAN_CONFIG.storage.autoSaveInterval);
                window.addEventListener("beforeunload", () => this._saveNow());
            }

            _isCompatible(key, value) {
                const fallback = this._state[key];
                if (typeof value === "string" && value.length > 500000) return false;
                if (Array.isArray(fallback)) return Array.isArray(value) && value.length <= 10000;
                if (typeof fallback === "boolean") return typeof value === "boolean";
                if (typeof fallback === "number") return Number.isFinite(value);
                if (typeof fallback === "string") return typeof value === "string";
                if (fallback === null) return value === null || ["object", "string", "number", "boolean"].includes(typeof value);
                return value !== null && typeof value === "object";
            }

            _loadFromStorage() {
                try {
                    const raw = localStorage.getItem(TITAN_CONFIG.storage.key);
                    if (!raw) return;
                    const saved = JSON.parse(raw);
                    if (!saved || typeof saved !== "object" || Array.isArray(saved)) return;
                    // Accept older snapshots, but only copy values whose type matches
                    // a current default. Unknown keys are intentionally ignored.
                    if (saved.todos2 === undefined && Array.isArray(saved.todos)) saved.todos2 = saved.todos;
                    if (saved.notes3 === undefined && Array.isArray(saved.notes)) saved.notes3 = saved.notes;
                    Object.keys(this._state).forEach((k) => {
                        if (!(k in saved) || k.startsWith("_")) return;
                        const value = saved[k];
                        if (this._isCompatible(k, value)) this._state[k] = value;
                    });
                } catch (e) { /* ignore */ }
            }

            _saveNow() {
                clearTimeout(this._saveTimer);
                this._saveTimer = null;
                const data = {};
                for (const k in this._state) { data[k] = this._state[k]; }
                data._lastSaved = Date.now();
                data._version = TITAN_CONFIG.version;
                try {
                    const serialized = JSON.stringify(data);
                    if (serialized.length > 1500000) {
                        Logger.warn("State", "Workspace is too large to persist safely.");
                        EventBus.emit("state:persistence-error", { reason: "quota", size: serialized.length });
                        return false;
                    }
                    localStorage.setItem(TITAN_CONFIG.storage.key, serialized);
                    EventBus.emit("state:persisted", { size: serialized.length });
                    return true;
                } catch (e) {
                    Logger.warn("State", "Workspace persistence failed:", e?.message || e);
                    EventBus.emit("state:persistence-error", { reason: "storage", message: e?.message || String(e) });
                    return false;
                }
            }

            _scheduleSave() {
                clearTimeout(this._saveTimer);

        const ViewportMode = (() => {

                const next = computed();

                if (next === current) return;
                current = next;
                EventBus.emit("viewport:change", { mobile: current });

                            e); } });
            }
            mq.addEventListener ? mq.addEventListener("change", apply) : mq.addListener(apply);

                    Utils.el("div", { class: "grow" }, [

                    opts.delay ?? 400);

        const cIdx = cascadeIndex % 7;
        const x = clamp(
            boundsW / 2 - width / 2 + (cIdx - 3) * cascadeOffset,
            16,
            Math.max(16, boundsW - width - 16)
        );
        const y = clamp(
            boundsH / 2 - height / 2 + (cIdx - 3) * cascadeOffset * 0.7,
            10,
            Math.max(10, boundsH - height - 16)
        );
        return { x, y };
    }

    function zoneRect(zone, bounds) {
        const { w, h } = bounds;
        switch (zone) {
            case "left":
                return { x: 0, y: 0, w: w / 2, h };
            case "right":
                return { x: w / 2, y: 0, w: w / 2, h };
            case "top-left":
                return { x: 0, y: 0, w: w / 2, h: h / 2 };
            case "top-right":
                return { x: w / 2, y: 0, w: w / 2, h: h / 2 };
            case "bottom-left":
                return { x: 0, y: h / 2, w: w / 2, h: h / 2 };
            case "bottom-right":
                return { x: w / 2, y: h / 2, w: w / 2, h: h / 2 };
            default:
                return { x: 0, y: 0, w, h };
        }
    }

    function snapZoneAt({ clientX, clientY, boundsH, topbarHeight, innerWidth, threshold }) {
        const localY = clientY - topbarHeight;
        if (localY < threshold) return "top";
        if (clientX < threshold && localY < boundsH * 0.35) return "top-left";
        if (clientX < threshold && localY > boundsH * 0.65) return "bottom-left";
        if (clientX < threshold) return "left";
        if (clientX > innerWidth - threshold && localY < boundsH * 0.35) return "top-right";
        if (clientX > innerWidth - threshold && localY > boundsH * 0.65) return "bottom-right";
        if (clientX > innerWidth - threshold) return "right";
        return null;
    }

    function clampPosition({ x, y, w, boundsW, boundsH }) {
        return {
            x: clamp(x, -(w - 120), Math.max(20, boundsW - 120)),
            y: clamp(y, 0, Math.max(10, boundsH - 60)),
        };
    }

    function cycleFocusOrder(windows, focusedId, dir = 1) {
        const arr = windows.filter((w) => !w.minimized).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
        if (arr.length < 2) return null;
        const curIdx = arr.findIndex((w) => w.id === focusedId);
        const next = arr[(curIdx + dir + arr.length) % arr.length];
        return next ? next.id : null;
    }

    return { cascadePosition, zoneRect, snapZoneAt, clampPosition, cycleFocusOrder };

        "use strict";
        /******************************************************************
         * [PERF] — Lightweight FPS / memory sampler
         ******************************************************************/
        const PerfMonitor = (() => {
            let frames = 0,
                lastT = performance.now(),
                fps = 60,
                running = false,
                raf = null;
            const history = [];

            function memInfo() { return performance.memory ? { used: performance.memory.usedJSHeapSize, limit: performance
                        .memory.jsHeapSizeLimit } : null; }

            function loop(t) {
                if (!running) return;
                frames++;
                if (t - lastT >= 500) {
                    fps = Math.round((frames * 1000) / (t - lastT));
                    frames = 0;
                    lastT = t;
                    history.push(fps);
                    if (history.length > 80) history.shift();
                    const el = document.querySelector("#tb-fps b");
                    if (el) el.textContent = String(fps);
                    EventBus.emit("perf:tick", { fps, memory: memInfo(), windows: WindowManager.windows.size });
                }
                raf = requestAnimationFrame(loop);
            }

            function start() {
                if (running || document.hidden) return;
                running = true;
                lastT = performance.now();
                raf = requestAnimationFrame(loop);
            }
            function stop() {
                running = false;
                if (raf) cancelAnimationFrame(raf);
                raf = null;
            }
            document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
            return { start, stop, getFps: () => fps, getHistory: () => history.slice(), memInfo };
        })();
